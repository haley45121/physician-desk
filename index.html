<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<meta name="apple-mobile-web-app-title" content="Physician Desk">
<meta name="color-scheme" content="light">
<!-- Installed as a home screen app on purpose. The original spec avoided standalone
     mode because it keeps its own storage separate from the Safari tab, and that is
     still true: installing costs one reset of phone progress. It buys back durable
     storage that Safari will not evict after a week of not opening the app, plus
     real offline loading. These are relative paths so nothing here reaches the
     network at runtime, and they simply 404 harmlessly when opened from a file. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>The Physician Desk</title>
<style>
/* Warm Paper commits to a single light world by design (UI_DESIGN_GUIDE direction B),
   so the palette is declared once and never redefined for dark mode. color-scheme is
   set here rather than in a meta tag because the artifact build strips the document head. */
:root{
  color-scheme:light;
  --display:ui-serif,"New York",Constantia,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;

  --bg:#f6f1e8;
  --panel:#fdfaf3;
  --panel-2:#efe8da;
  --ink:#2a2620;
  --ink-dim:#5c554a;
  --ink-mute:#8a8172;

  --accent:#8b4513;
  --accent-deep:#6e3610;
  --accent-soft:rgba(139,69,19,0.07);
  --accent-line:rgba(139,69,19,0.28);
  --negative:#9a3b2f;
  --negative-soft:rgba(154,59,47,0.07);

  --line:rgba(42,38,32,0.13);
  --line-soft:rgba(42,38,32,0.07);

  --r:5px;
  --r-sm:4px;
  --tabh:58px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
html,body{background:var(--bg); color:var(--ink);}
body{
  font-family:var(--body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-wrap:break-word;
}
::selection{background:var(--accent); color:var(--bg);}
a{color:var(--accent); text-decoration:none;}
a:hover{color:var(--accent-deep); text-decoration:underline; text-underline-offset:2px;}
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; cursor:pointer; touch-action:manipulation;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.mono{font-family:var(--mono);}
.eyebrow{
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.18em;
  color:var(--ink-mute); font-weight:500;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; font-size:13px;}

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:14px 28px 13px; border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;}
.brand a{color:var(--ink);}
.brand a:hover{text-decoration:none; color:var(--accent);}
.streakbox{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--ink-mute);
  font-variant-numeric:tabular-nums; text-transform:uppercase; white-space:nowrap;
}
.streakbox b{color:var(--accent); font-weight:600;}

/* ---------- bottom tab bar ---------- */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  display:flex; border-top:1px solid var(--line);
  background:var(--panel); padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1 1 0; min-width:0; min-height:var(--tabh);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-mute); padding:8px 2px; border-top:2px solid transparent;
  transition:color .15s, border-color .15s, background .15s;
}
.tab:hover{color:var(--ink); text-decoration:none; background:var(--accent-soft);}
.tab.active{color:var(--accent); border-top-color:var(--accent); background:var(--accent-soft);}
.tab .glyph{font-family:var(--display); font-size:15px; line-height:1; font-style:italic;}

/* ---------- layout ---------- */
.wrap{
  max-width:680px; margin:0 auto;
  padding:30px 28px calc(var(--tabh) + 56px);
}
.banner{
  font-family:var(--mono); font-size:11.5px; line-height:1.5; color:var(--ink-dim);
  border-left:2px solid var(--accent); padding:9px 0 9px 14px; margin-bottom:24px;
}

/* ---------- headings ---------- */
h1{
  font-family:var(--display); font-weight:600; font-size:36px; letter-spacing:-.02em;
  line-height:1.1; margin:10px 0 12px; color:var(--ink);
}
h1 em{font-style:italic; color:var(--accent); font-weight:600;}
h2{
  font-family:var(--display); font-size:23px; font-weight:600; letter-spacing:-.012em;
  line-height:1.22; margin:38px 0 12px;
}
h3{font-family:var(--body); font-size:16px; font-weight:700; margin:22px 0 6px;}
p{margin:0 0 14px;}
.tagline{color:var(--ink-dim); margin-bottom:6px; font-size:16.5px; line-height:1.6;}
.hd{margin-bottom:26px;}
.hd .eyebrow{display:block; margin-bottom:3px;}
.backlink{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute);}
.backlink:hover{color:var(--accent);}
.hero-rule{height:1px; background:var(--accent-line); margin:20px 0 4px;}
.rule{height:1px; background:var(--line); margin:30px 0;}

/* ---------- today ---------- */
.daystrip{
  display:flex; gap:6px; overflow-x:auto; padding:2px 28px 12px; margin:0 -28px 4px;
  scrollbar-width:none;
}
.daystrip::-webkit-scrollbar{display:none;}
.daychip{
  flex:none; min-width:46px; min-height:46px; border:1px solid var(--line); border-radius:var(--r-sm);
  background:var(--panel); font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  color:var(--ink-mute); text-transform:uppercase; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; padding:6px 8px;
  transition:border-color .15s, color .15s, background .15s;
}
.daychip b{font-size:14px; font-weight:600; letter-spacing:0; color:var(--ink);}
.daychip:hover{border-color:var(--accent-line); background:var(--accent-soft);}
.daychip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
.daychip.on b{color:var(--accent);}

.tasklist{list-style:none; margin:14px 0 0;}
.tasklist li{border-bottom:1px solid var(--line-soft);}
.tasklist li:last-child{border-bottom:none;}
.taskrow{
  display:flex; align-items:baseline; gap:13px; width:100%; text-align:left;
  padding:15px 2px; min-height:52px; transition:background .15s;
}
.taskrow:hover{background:var(--accent-soft); text-decoration:none;}
.taskbox{
  font-family:var(--mono); font-size:12px; flex:none; width:17px; color:var(--ink-mute);
  border:1px solid var(--line); border-radius:2px; height:17px; line-height:15px;
  text-align:center; transform:translateY(2px);
}
.taskrow.done .taskbox{color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft);}
.taskmain{flex:1 1 auto; min-width:0;}
.taskmain b{font-weight:600; font-family:var(--body); font-size:16px;}
.taskkind{
  display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-mute); margin-top:2px;
}
.taskscore{font-family:var(--mono); font-size:11.5px; color:var(--accent); flex:none; font-variant-numeric:tabular-nums;}
.focusline{
  font-family:var(--display); font-style:italic; font-size:19px; line-height:1.42;
  color:var(--ink-dim); margin:6px 0 4px;
}

/* ---------- tables ---------- */
.scrollx{overflow-x:auto; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
table{border-collapse:collapse; width:100%; font-size:15px;}
th{
  font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em;
  color:var(--ink-mute); font-weight:500; text-align:left; padding:11px 12px 11px 0;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:13px 12px 13px 0; border-bottom:1px solid var(--line-soft); vertical-align:top;}
tr:last-child td{border-bottom:none;}
th:last-child,td:last-child{padding-right:0;}
th.num,td.num{text-align:right;}
td strong{font-weight:600;}
.sub{color:var(--ink-mute); font-size:13px; display:block; margin-top:2px; line-height:1.45;}

.modrow{display:flex; align-items:baseline; gap:12px; width:100%; text-align:left; padding:16px 2px; min-height:56px; transition:background .15s;}
.modrow:hover{background:var(--accent-soft); text-decoration:none;}
.modnum{font-family:var(--mono); font-size:11px; color:var(--accent); flex:none; width:20px; font-variant-numeric:tabular-nums;}
.modmain{flex:1 1 auto; min-width:0;}
.modmain b{font-weight:600; font-size:16.5px; font-family:var(--display);}
.modpct{font-family:var(--mono); font-size:11.5px; color:var(--ink-mute); flex:none; font-variant-numeric:tabular-nums;}
.modlist{list-style:none;}
.modlist li{border-bottom:1px solid var(--line-soft);}
.modlist li:last-child{border-bottom:none;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--accent-line); border-radius:var(--r-sm);
  padding:13px 20px; min-height:46px; background:var(--panel); color:var(--ink);
  transition:background .15s, color .15s, border-color .15s;
}
.btn:hover{background:var(--accent-soft); border-color:var(--accent); text-decoration:none;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--bg);}
.btn.primary:hover{background:var(--accent-deep); border-color:var(--accent-deep); color:var(--bg);}
.btn:disabled{opacity:.38; cursor:not-allowed;}
.btn:disabled:hover{background:var(--panel); border-color:var(--accent-line);}
.btn.primary:disabled:hover{background:var(--accent); border-color:var(--accent);}
.btn.small{padding:9px 14px; min-height:38px; font-size:10.5px;}
.btn.wide{width:100%;}
.btnrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; align-items:center;}
.linkbtn{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--accent); padding:10px 0; min-height:40px; display:inline-flex; align-items:center;}
.linkbtn:hover{text-decoration:underline;}
.dangerbtn{border-color:var(--line); color:var(--ink-mute);}
.dangerbtn:hover{border-color:var(--negative); color:var(--negative); background:var(--negative-soft);}

/* ---------- session meta ---------- */
.quizmeta{
  display:flex; justify-content:space-between; align-items:baseline; gap:14px;
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--ink-mute);
  font-variant-numeric:tabular-nums; margin-bottom:20px; text-transform:uppercase;
  border-bottom:1px solid var(--line-soft); padding-bottom:11px;
}
.stem{font-family:var(--display); font-size:21px; font-weight:600; line-height:1.34; margin-bottom:20px; letter-spacing:-.008em;}
.kbdhint{font-family:var(--mono); font-size:10px; color:var(--ink-mute); letter-spacing:.05em; margin-top:14px; text-transform:uppercase; line-height:1.6;}

/* ---------- options ---------- */
.opt{
  display:flex; gap:12px; align-items:baseline; width:100%; text-align:left;
  border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel);
  padding:15px; margin-bottom:8px; line-height:1.5; min-height:52px; font-size:15.5px;
  transition:background .15s, border-color .15s, box-shadow .15s;
}
.opt:hover{background:var(--accent-soft); border-color:var(--accent-line);}
.opt .key{font-family:var(--mono); font-size:10.5px; color:var(--ink-mute); font-variant-numeric:tabular-nums; flex:none; padding-top:2px;}
.opt.sel{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); background:var(--accent-soft);}
.opt.sel .key{color:var(--accent); font-weight:600;}
.opt.correct{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); background:var(--accent-soft);}
.opt.wrongpick{border-color:var(--negative); box-shadow:inset 3px 0 0 var(--negative); background:var(--negative-soft);}
.opt.wrongpick .optbody{color:var(--ink-dim);}
.opt .mark{font-family:var(--mono); font-size:10px; flex:none; margin-left:auto; padding-left:10px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;}
.opt .mark.ok{color:var(--accent);}
.opt .mark.bad{color:var(--negative);}
.opt:disabled{cursor:default;}
.opt:disabled:hover{background:var(--panel); border-color:var(--line);}
.opt.correct:disabled:hover{background:var(--accent-soft); border-color:var(--accent);}
.opt.wrongpick:disabled:hover{background:var(--negative-soft); border-color:var(--negative);}

/* ---------- match ---------- */
.matchcols{display:grid; grid-template-columns:1fr; gap:9px;}
.mcol + .mcol{margin-top:10px;}
.mitem{
  display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; font-size:15px;
  border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel); padding:13px;
  min-height:48px; line-height:1.45; margin-bottom:7px;
  transition:background .15s, border-color .15s, box-shadow .15s;
}
.mitem:hover{background:var(--accent-soft); border-color:var(--accent-line);}
.mitem.sel{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); background:var(--accent-soft);}
.mitem.locked{border-color:var(--accent-line);}
.mbadge{font-family:var(--mono); font-size:10.5px; flex:none; min-width:16px; color:var(--ink-mute); font-variant-numeric:tabular-nums;}
.mitem.locked .mbadge{color:var(--accent); font-weight:600;}

/* ---------- categorize ---------- */
.catrow{border-bottom:1px solid var(--line-soft); padding:14px 0;}
.catrow:last-child{border-bottom:none;}
.cattext{margin-bottom:9px; font-size:15.5px; line-height:1.5;}
.catbtns{display:flex; gap:8px; flex-wrap:wrap;}
.catbtn{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; border:1px solid var(--line);
  border-radius:var(--r-sm); padding:10px 14px; min-height:40px; background:var(--panel);
  transition:background .15s, border-color .15s, color .15s;
}
.catbtn:hover{background:var(--accent-soft); border-color:var(--accent-line);}
.catbtn.sel{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); font-weight:600;}
.catfb{display:flex; gap:10px; align-items:baseline; padding:13px 0; border-bottom:1px solid var(--line-soft); font-size:15px;}
.catfb:last-child{border-bottom:none;}
.catfb .grow{flex:1 1 auto; min-width:0;}

/* ---------- order ---------- */
.orderwrap{display:grid; grid-template-columns:1fr; gap:16px;}
.ocolhd{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.15em; color:var(--ink-mute); margin-bottom:9px;}
.step{
  display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; font-size:15px;
  border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel); padding:13px;
  margin-bottom:7px; line-height:1.45; min-height:48px; transition:background .15s, border-color .15s;
}
.step:hover{background:var(--accent-soft); border-color:var(--accent-line);}
.step .mbadge{color:var(--accent); font-weight:600;}

/* ---------- inputs ---------- */
.textinput{
  width:100%; font-family:var(--mono); font-size:16px; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm); padding:14px;
  transition:border-color .15s, box-shadow .15s;
}
.textinput:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
textarea.textinput{min-height:230px; font-family:var(--body); font-size:16px; line-height:1.62; resize:vertical;}
.searchinput{width:100%; font-family:var(--body); font-size:16px; padding:13px 14px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-sm); color:var(--ink);}
.searchinput:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.counter{font-family:var(--mono); font-size:10px; color:var(--ink-mute); font-variant-numeric:tabular-nums; margin-top:6px; text-align:right; letter-spacing:.04em;}

/* ---------- feedback ---------- */
.verdict{font-family:var(--display); font-size:20px; font-style:italic; margin:22px 0 10px;}
.verdict.ok{color:var(--accent);}
.verdict.bad{color:var(--negative);}
.explain{border-left:2px solid var(--accent-line); padding:2px 0 2px 15px; color:var(--ink-dim); margin:13px 0; font-size:15.5px;}
.explain .eyebrow{display:block; margin-bottom:4px; color:var(--accent);}
.canonical{font-family:var(--mono); font-size:17px; color:var(--accent); margin:11px 0 4px;}
.notep{color:var(--ink-dim); font-size:15px;}

/* ---------- self-grade ---------- */
.panelbox{border:1px solid var(--line); border-radius:var(--r); background:var(--panel); padding:18px; margin:15px 0;}
.panelbox .eyebrow{display:block; margin-bottom:9px; color:var(--accent);}
.respbox{white-space:pre-wrap; line-height:1.65;}
.rubric{list-style:none; margin:11px 0;}
.rubric li{border-bottom:1px solid var(--line-soft);}
.rubric li:last-child{border-bottom:none;}
.rubric label{display:flex; gap:12px; align-items:baseline; padding:14px 3px; min-height:50px; cursor:pointer; transition:background .15s;}
.rubric label:hover{background:var(--accent-soft);}
.rubric input[type=checkbox]{accent-color:var(--accent); transform:translateY(2px); width:18px; height:18px; flex:none;}
.scorebig{font-family:var(--mono); font-size:26px; font-variant-numeric:tabular-nums; margin:15px 0; color:var(--accent); font-weight:600;}
.scorebig span{color:var(--ink-mute); font-size:13px; font-weight:400;}
.setup{border-left:2px solid var(--accent-line); padding-left:16px; margin-bottom:20px;}
.setup p{font-size:15.5px; color:var(--ink-dim);}
.setup ul,.setup ol{margin:0 0 14px 20px; color:var(--ink-dim); font-size:15.5px;}
.setup li{margin-bottom:6px;}

/* ---------- learn ---------- */
.learnsec p{font-size:17px; line-height:1.68;}
.learnsec ul,.learnsec ol{margin:0 0 15px 21px;}
.learnsec li{margin-bottom:8px; line-height:1.6; font-size:16.5px;}
.checklist{list-style:none; margin:12px 0 0;}
.checklist li{padding:12px 0 12px 24px; border-bottom:1px solid var(--line-soft); position:relative; color:var(--ink-dim); font-size:16px;}
.checklist li:last-child{border-bottom:none;}
.checklist li::before{content:"\25AA"; font-size:9px; color:var(--accent); position:absolute; left:3px; top:16px;}
dfn{font-style:normal; font-weight:700; color:var(--ink); border-bottom:1px solid var(--accent-line);}

/* ---------- misses ---------- */
.missitem{border-top:1px solid var(--line); padding:16px 0;}
.missitem .stem{font-family:var(--body); font-size:15.5px; font-weight:600; margin-bottom:8px; line-height:1.5;}
.missitem .explain{margin:8px 0 0;}
.sumline{font-family:var(--mono); font-size:12.5px; letter-spacing:.04em; font-variant-numeric:tabular-nums; margin:4px 0; color:var(--ink-dim);}

/* ---------- subnav ---------- */
.subnav{display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 30px;}
.subnav .btn{font-size:10.5px; padding:11px 14px; min-height:42px;}

/* ---------- rough day ---------- */
.roughgrid{display:grid; grid-template-columns:1fr; gap:9px; margin-top:18px;}
.roughcard{
  display:block; width:100%; text-align:left; border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel); padding:17px; min-height:62px; transition:background .15s, border-color .15s;
}
.roughcard:hover{background:var(--accent-soft); border-color:var(--accent-line); text-decoration:none;}
.roughcard b{display:block; font-family:var(--display); font-size:18px; font-weight:600; color:var(--ink); line-height:1.3;}
.roughcard span{display:block; font-size:14.5px; color:var(--ink-mute); margin-top:4px; line-height:1.5;}
.roughbody p{font-size:17px; line-height:1.68;}
.roughbody ul{margin:0 0 15px 21px;}
.roughbody li{margin-bottom:8px; line-height:1.6; font-size:16.5px;}
.mathbox{border:1px solid var(--accent-line); border-radius:var(--r); padding:16px 18px; margin:18px 0; background:var(--panel);}
.mathbox .eyebrow{display:block; margin-bottom:7px; color:var(--accent);}
.mathbox p:last-child{margin-bottom:0;}

/* ---------- guide ---------- */
.gentry{border-bottom:1px solid var(--line-soft); padding:14px 0;}
.gentry:last-child{border-bottom:none;}
.gterm{font-family:var(--body); font-weight:700; font-size:16px; color:var(--ink);}

const MODULES = [];

MODULES.push({
  id: "m01",
  title: "The Map",
  tagline: "Who reports to whom, where the money comes from, and why your candidates cost so much",

  learn: {
    sections: [
      { heading: "The line you draw on every intake call",
        point: "The CSO owns the molecule until it reaches a person and the CMO owns everything after, and that second half is your desk.",
        diagram: "<svg viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Board to CEO, then CSO and CMO, with clinical development and its neighbouring functions beneath the CMO\"><rect x=\"210\" y=\"6\" width=\"100\" height=\"30\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"260\" y=\"25\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Board</text><line x1=\"260\" y1=\"36\" x2=\"260\" y2=\"50\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><rect x=\"210\" y=\"50\" width=\"100\" height=\"30\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"260\" y=\"69\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">CEO</text><line x1=\"260\" y1=\"80\" x2=\"260\" y2=\"94\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"130\" y1=\"94\" x2=\"390\" y2=\"94\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"130\" y1=\"94\" x2=\"130\" y2=\"108\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"260\" y1=\"94\" x2=\"260\" y2=\"108\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"390\" y1=\"94\" x2=\"390\" y2=\"108\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><rect x=\"70\" y=\"108\" width=\"120\" height=\"36\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"130\" y=\"124\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">CSO</text><text x=\"130\" y=\"138\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">molecule before humans</text><rect x=\"200\" y=\"108\" width=\"120\" height=\"36\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"260\" y=\"124\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">CMO</text><text x=\"260\" y=\"138\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">everything after</text><rect x=\"330\" y=\"108\" width=\"120\" height=\"36\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"390\" y=\"124\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">CFO and others</text><text x=\"390\" y=\"138\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">capital, legal, people</text><line x1=\"260\" y1=\"144\" x2=\"260\" y2=\"162\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><rect x=\"180\" y=\"162\" width=\"160\" height=\"34\" rx=\"4\" fill=\"#f3e7db\" stroke=\"#8b4513\" stroke-width=\"1\"/><text x=\"260\" y=\"177\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#8b4513\">Clinical Development</text><text x=\"260\" y=\"191\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">YOUR DESK</text><line x1=\"260\" y1=\"196\" x2=\"260\" y2=\"212\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"60\" y1=\"212\" x2=\"460\" y2=\"212\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"60\" y1=\"212\" x2=\"60\" y2=\"226\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"160\" y1=\"212\" x2=\"160\" y2=\"226\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"260\" y1=\"212\" x2=\"260\" y2=\"226\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"360\" y1=\"212\" x2=\"360\" y2=\"226\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><line x1=\"460\" y1=\"212\" x2=\"460\" y2=\"226\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><rect x=\"14\" y=\"226\" width=\"92\" height=\"32\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"60\" y=\"240\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Clin Ops</text><text x=\"60\" y=\"254\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">runs the trial</text><rect x=\"114\" y=\"226\" width=\"92\" height=\"32\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"160\" y=\"240\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Biometrics</text><text x=\"160\" y=\"254\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">the numbers</text><rect x=\"214\" y=\"226\" width=\"92\" height=\"32\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"260\" y=\"240\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Regulatory</text><text x=\"260\" y=\"254\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">the agency</text><rect x=\"314\" y=\"226\" width=\"92\" height=\"32\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"360\" y=\"240\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Drug Safety</text><text x=\"360\" y=\"254\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">the harms</text><rect x=\"414\" y=\"226\" width=\"92\" height=\"32\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"460\" y=\"240\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Med Affairs</text><text x=\"460\" y=\"254\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">after approval</text><text x=\"260\" y=\"285\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8a8172\">The five below are neighbours, not reports. Most companies run them in a matrix.</text></svg><figcaption>Board to CMO, and the functions around your desk</figcaption>",
        html: "<p>Start at the top and work down, because every intake call is a question about this line. The board hires a CEO, who owns capital and strategy. Reporting to the CEO is a short executive bench: a <dfn>Chief Medical Officer</dfn> (CMO), a <dfn>Chief Scientific Officer</dfn> (CSO), a CFO, a chief operating or business officer, a general counsel, and at commercial-stage companies a chief commercial officer. Larger organizations insert a head of research and development or a chief development officer above both the CMO and the CSO. Small ones collapse the whole bench into three or four people wearing six hats each.</p>" +
        "<p>The split that matters to you is CSO versus CMO. The CSO owns the molecule before it reaches a human being: target biology, chemistry, animal work. The CMO owns everything after: what trial to run, in which patients, measuring what, and what the results mean. The CMO is also the company's medical face to the FDA, to investigators, and increasingly to investors. When a program blows up, the CMO is the one who explains it.</p>" +
        "<p><dfn>Clinical Development</dfn> is the organization under the CMO, and it is your desk. Its people are physicians and clinical scientists who own the medical strategy of a program: the protocol concept, the endpoint, the eligibility criteria, the running read of safety and efficacy, and the recommendation to continue or kill. The ladder runs Medical Director, Senior Medical Director, Executive Medical Director, Vice President of Clinical Development, CMO. Therapeutic Area Head sits beside that line rather than inside it: it is a disease-area authority seat whose title lands at VP, SVP, or above depending on the company, so never tell a client a TA Head outranks a VP as a rule.</p>" +
        "<p>Two structural facts to keep straight. First, most companies run a <dfn>matrix</dfn>: a drug is managed by a cross-functional program team drawn from every function, and the physician sits on it as medical lead without line-managing most of the people in the room. Second, Clinical Development is not <dfn>Clinical Operations</dfn>. Development decides what the trial asks and what the answer means. Operations makes the trial happen across sites, vendors, and countries. Mixing those two up in front of a physician is the fastest way to get written off inside a minute.</p>" },

      { heading: "The functions standing next to your candidate",
        point: "Seven functions surround Clinical Development, and whoever runs one of them is usually your hiring manager, your interview panel, or your candidate's reason for leaving.",
        html: "<p>Seven functions sit around Clinical Development. You need one honest sentence on each and the title of whoever runs it, because that person is frequently the hiring manager, the interview panel, or the reason your candidate is unhappy.</p>" +
        "<ul><li><dfn>Clinical Operations</dfn>: executes the trial, selecting and contracting sites, managing the CRO and other vendors, driving enrollment, monitoring sites, holding timeline and budget. Led by a Head or VP of Clinical Operations, sometimes an SVP of Development Operations. Rarely physicians.</li>" +
        "<li><dfn>Biostatistics</dfn>: writes the statistical analysis plan, calculates how many patients the trial needs, and produces the analysis that says whether the drug actually worked. Led by a VP of Biostatistics or Biometrics. Nothing reaches the FDA without them.</li>" +
        "<li><dfn>Data Management</dfn>: builds the trial database, cleans it, chases discrepancies through queries to sites, and delivers a locked dataset. Usually sits under Biometrics alongside Biostatistics. Invisible until the data are dirty, then the loudest problem in the building.</li>" +
        "<li><dfn>Regulatory Affairs</dfn>: owns the interface with the FDA and other health authorities, runs meeting requests, and assembles submissions. Led by a VP or SVP of Regulatory Affairs, occasionally a Chief Regulatory Officer. Awareness only for you, but they are in every meeting that decides your candidate's program.</li>" +
        "<li><dfn>Drug Safety</dfn>, also called Pharmacovigilance or PV: collects and assesses adverse events across the product lifecycle, detects safety signals, owns the safety language in the label, files periodic safety reports. Led by a VP or Head of Drug Safety, usually a physician. You do recruit here; the Drug Safety Physician is one of your roles.</li>" +
        "<li><dfn>Medical Affairs</dfn>: the non-promotional medical voice near and after approval, running medical science liaisons, publications, advisory boards, and investigator-initiated studies. Led by a VP of Medical Affairs or a Chief Medical Affairs Officer. A different career track from development, and physicians who cross over rarely cross back. Module 11 maps this world properly.</li>" +
        "<li><dfn>Commercial</dfn>: market research, pricing, launch planning, marketing, sales. Led by a Chief Commercial Officer. Their forecast is one reason a program lives or dies, which is why your physician candidates complain about them by name.</li></ul>" +
        "<p>On a Medical Director search the hiring manager is usually a VP of Clinical Development or a Therapeutic Area Head, with the CMO approving and talent acquisition running logistics. Ask on intake who actually decides. The answer changes how you run the process and who you spend your prep time on.</p>" },

      { heading: "How the money works, and how it runs out",
        point: "A clinical stage company sells a story to investors, so burn, runway, and the next readout decide whether it survives and when its physicians hit the market.",
        html: "<p>A clinical-stage biotech has no product and no revenue. What it sells is a credible story about a future asset, and it sells that story to investors. <dfn>Burn rate</dfn> is the cash the company consumes per month or per quarter. <dfn>Runway</dfn> is how many months of cash remain at that burn. Boards generally want 18 to 24 months of runway, because raising money with six months left is negotiating from your knees.</p>" +
        "<p>Money arrives in rounds: seed and Series A, B, and C from venture investors, then a crossover round, then an IPO, then follow-on offerings or a private placement into public equity. It also arrives through partnership, where a larger company pays an upfront fee plus future <dfn>milestone payments</dfn> and royalties for rights to the asset. Every raise is priced off the last <dfn>catalyst</dfn>: a data readout, a regulatory meeting outcome, a partnership signature. Trial data is the currency the whole thing runs on.</p>" +
        "<p>Eventually a drug is approved and sells, and the clock governing that revenue is the patent. A composition-of-matter patent runs roughly 20 years from filing, and filing happens early, long before a human is dosed, so a decade or more of that life burns off during development. Some term can be restored and separate regulatory exclusivity periods apply, but the practical point holds: the selling window is far shorter than 20 years. When it closes you hit <dfn>loss of exclusivity</dfn>, generics or biosimilars enter, and revenue on that product can fall by most of its value within a year or two. That cliff is a large part of why big pharma buys biotechs.</p>" +
        "<p>Put those together and you see why one readout ends a company. A single-asset biotech that misses its Phase III primary endpoint loses the story, the share price, and the ability to raise, in that order and inside a week. What follows is standard: restructuring, layoffs concentrated in clinical, a hunt for a reverse merger or an asset sale, sometimes a wind-down. Commonly cited estimates put the fully capitalized cost of bringing one drug to approval somewhere between several hundred million and over two billion dollars, and that figure includes all the failures it took. For you the consequence is simple and slightly uncomfortable: company events create candidates. When a program dies, excellent physicians hit the market at once and every competitor calls them the same week.</p>" },

      { heading: "Why these people are scarce and expensive",
        point: "The pool is tiny once you apply real filters and the decisions are enormous, so scarcity and leverage are your two honest answers when a client questions the money.",
        html: "<p>You will be asked to justify a physician's compensation, sometimes by a client and sometimes by your own doubt at eleven at night. There are two honest reasons. Learn to state both without sounding defensive.</p>" +
        "<p>The first is population. There are roughly a million licensed physicians in the United States, and the overwhelming majority practice medicine. The ones who left practice for industry drug development are a small fraction of that. Then apply the filters a real search carries: late-phase experience, sponsor side rather than only CRO, one therapeutic area, a specific mechanism or tumor type, prior submission exposure, and a location or remote arrangement that works. Each filter cuts hard. A search for an oncology Medical Director with Phase III leadership in a specific tumor type does not have a candidate pool of thousands. It has a list you can write on one page, and a third of that list will not take your call. Building and working that list is your actual product.</p>" +
        "<p>The second is leverage. A physician's judgment sits directly on top of the largest checks the company writes. Carry the wrong dose out of Phase II and the Phase III fails at a cost of hundreds of millions of dollars and three or four years, and a small company does not survive it. Choose the wrong comparator, the wrong endpoint, or the wrong patient population and you get the same outcome by a different route. Read a safety signal wrong in either direction and you either kill a working drug or keep dosing patients you should have stopped. Companies pay for that judgment because every alternative is more expensive than the salary.</p>" +
        "<p>The recruiting consequence follows directly. These people are employed, contacted constantly, and absent from job boards, and they decide inside about ninety seconds whether you are worth more time. What buys the next ninety seconds is not enthusiasm or a polished intro. It is knowing their indication, their phase, and roughly what their molecule is trying to do.</p>" },

      { heading: "Four employers, four different jobs",
        point: "Large pharma, mid cap, small biotech, and CRO differ in span, support, what a title means, and the shape of the money, so name the trade instead of selling the opportunity.",
        html: "<p>The same title means four different jobs depending on where it sits. This frame is the most useful thing you own when a physician asks what a move would be like.</p>" +
        "<ul><li><strong>Large pharma</strong>: tens of thousands of employees, dozens of programs, deep functional support in every direction. A Medical Director here may own one indication inside one program, with statistics, operations, regulatory, and safety fully staffed beside them. Titles run conservative, promotion is structured and slow, cash compensation is strong and stable, and equity is stock in a large company rather than a lottery ticket. The complaint you will hear is layers: a good idea passes through committees for a year.</li>" +
        "<li><strong>Mid-cap biotech</strong>: hundreds to a few thousand people, one or a few approved products, a real pipeline behind them. Broader span than large pharma, functions that exist but run thin, and usually the best available balance of resources and ownership. Often your easiest sell in either direction.</li>" +
        "<li><strong>Small clinical-stage biotech</strong>: twenty to two hundred people, one or two assets, no revenue. The physician may be the entire medical function: writing the protocol, taking investigator calls, sitting in the FDA meeting, managing the CRO's medical monitor, and briefing investors inside the same week. Enormous ownership, thin support, and title inflation is real, so a Vice President at a forty-person company may have one direct report. Equity is the story here: a meaningful option grant that ends up worth a great deal or nothing at all.</li>" +
        "<li><strong>CRO</strong>, contract research organization: sells trial execution services to sponsors. Physicians work as medical monitors or medical directors across several clients' studies at once. The upside is volume and variety, exposure to many protocols and therapeutic areas quickly. The limits are real: you execute someone else's strategy, you rarely own a go decision, there is no equity in the asset, and sponsor-side hiring managers routinely discount CRO time as execution rather than development leadership. Fair or not, expect that objection on every CRO candidate.</li></ul>" +
        "<p>What genuinely changes moving between these: span of ownership, depth of support, decision authority, speed, what a title means, and the shape of the money. A Senior Medical Director leaving large pharma for a small biotech is buying ownership and equity with stability and support. Say it that plainly to a candidate and you will be trusted more than the recruiter who calls it an exciting opportunity.</p>" },

      { heading: "Discovery and preclinical, and why they are not your desk",
        point: "Discovery and preclinical sit under the CSO and belong to another desk, so learn the vocabulary, name the boundary, and hand those searches off cleanly.",
        html: "<p>Two words come up constantly. Place them correctly and then let them go. <dfn>Discovery</dfn> is the hunt for the molecule: picking a biological target, screening compounds or engineering an antibody, then optimizing a lead candidate. <dfn>Preclinical</dfn>, also called nonclinical, is everything required before a human can be dosed: pharmacology showing the molecule does what the theory says, plus formal toxicology and safety pharmacology in animals run to a regulated quality standard. That work builds the safety case inside the IND and sets the first human dose.</p>" +
        "<p>Both sit under the CSO, not the CMO, and both are staffed largely by PhDs: medicinal chemists, biologists, toxicologists, pharmacokinetics scientists. They are a legitimate and difficult search practice. They are not this desk. Your desk begins when the molecule is in humans and it is weighted to Phase II and Phase III. If a client asks you for a Head of Discovery or a VP of Toxicology, that belongs to the colleague who owns that market, and handing it over cleanly is a professional act, not a loss. Know the vocabulary so nothing sounds alien on a call, then stop. Faking depth in preclinical science is how a promising conversation with a physician ends early; naming the boundary and steering back to development is how it keeps going.</p>" }
    ],
    checklist: [
      "Draw the line from CEO to Medical Director and say what the CMO owns that the CSO does not",
      "Name the seven functions around Clinical Development and who leads each one",
      "Separate Clinical Development from Clinical Operations in one sentence a physician would accept",
      "Explain burn, runway, and loss of exclusivity to a candidate asking whether a company is stable",
      "State both reasons physician executives are scarce and expensive without sounding defensive",
      "Compare large pharma, mid-cap, small biotech, and CRO on span, support, title, and equity"
    ]

  quiz: [

MODULES.push({
  id: "m02",
  title: "The Pipeline, Weighted to Two and Three",
  tagline: "Where drugs die, what it costs, and the two phases your desk actually lives in",

  learn: {
    sections: [
      { heading: "The IND: the gate into humans",
        point: "An IND clears by silence: thirty days pass without a clinical hold and dosing may begin, so never tell anyone the FDA approved a trial.",
        html: "<p>Nothing goes into a person in the United States until an <dfn>Investigational New Drug application</dfn> (IND) sits with the FDA. The IND is not permission to sell anything. It is a request for permission to test, and the agency's answer is either silence or a stop.</p>" +
        "<p>At headline level the IND carries three bodies of work. First, the nonclinical package: animal pharmacology and formal toxicology showing what the molecule does and at what exposure it damages something, which is where the proposed starting dose in humans comes from. Second, chemistry, manufacturing, and controls, universally shortened to <dfn>CMC</dfn>: evidence the company can make this drug consistently, purely, and stably. Third, the clinical plan: the protocol for the first study, the <dfn>investigator brochure</dfn> that tells investigators everything currently known about the compound, and the credentials of the people who will run it.</p>" +
        "<p>Then the clock. The FDA has <strong>30 days</strong> from receipt to object. If the agency does not place the application on <dfn>clinical hold</dfn> inside that window, the sponsor may begin dosing. There is no approval letter, no certificate, no ceremony. Companies often say they got a study may proceed letter, and the agency frequently does send one, but the operative fact is the expiration of the 30 days without a hold. A clinical hold stops everything until the specific concerns are answered, and a partial hold can stop one cohort or one dose while the rest continues.</p>" +
        "<p>Before any of this, competent sponsors request a <dfn>pre-IND meeting</dfn>: a formal conversation with the review division about whether the tox package is adequate, whether the starting dose is defensible, and whether the first protocol answers a question the agency respects. When a candidate lists pre-IND or IND work, they are telling you they sat on the sponsor side of a regulatory conversation rather than reading about one. Probe it: which division, what did the agency push back on, what changed afterward.</p>" },

      { heading: "Phase I, in brief",
        point: "Phase I asks what a human can tolerate rather than whether the drug works, and it ends by setting the dose your desk inherits.",
        html: "<p>Phase I is awareness for you, not depth, but you must be able to hold thirty credible seconds on it. This is <dfn>first-in-human</dfn>, the first time the molecule enters a person, and the question is not whether the drug works but what a human can tolerate. The design is <dfn>dose escalation</dfn>: a small cohort takes a low dose, the next cohort goes higher if nothing serious happens, and toxicity crossing a predefined line eventually fixes the <dfn>maximum tolerated dose</dfn> (MTD) and the <dfn>recommended Phase 2 dose</dfn>.</p>" +
        "<p>Who enrolls depends on the drug. Most compounds use healthy volunteers, who are paid and cannot benefit. In oncology and most cell and gene therapy the toxicity is too severe for that, so Phase I enrolls patients with advanced disease who have exhausted standard options, which is why an oncology Phase I physician talks about response rates in a study that officially exists to find a dose. Cohort by cohort, that physician decides whether an adverse event counts as dose-limiting and whether the next cohort escalates, holds, or backs down. Your desk lives one step later.</p>" },

      { heading: "Phase II, where drug development is decided",
        point: "Phase II proves concept, picks the dose, and kills most programs at roughly thirty percent success, which is why a dead Phase II is normal on a strong CV.",
        diagram: "<svg viewBox=\"0 0 520 150\" role=\"img\" aria-label=\"Timeline from preclinical through Phase four with the success rate at each gate\"><text x=\"14\" y=\"22\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8.5\" letter-spacing=\"1.4\" fill=\"#8a8172\">DISCOVERY TO APPROVAL, COMMONLY CITED AT 10 TO 15 YEARS</text><line x1=\"14\" y1=\"36\" x2=\"506\" y2=\"36\" stroke=\"rgba(42,38,32,0.22)\"/><rect x=\"14\" y=\"54\" width=\"88\" height=\"40\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"58\" y=\"72\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Preclinical</text><text x=\"58\" y=\"85\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">3 to 6 yrs</text><rect x=\"106\" y=\"54\" width=\"62\" height=\"40\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"137\" y=\"72\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Phase I</text><text x=\"137\" y=\"85\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">under 1 yr</text><rect x=\"172\" y=\"54\" width=\"78\" height=\"40\" rx=\"3\" fill=\"#f3e7db\" stroke=\"#8b4513\"/><text x=\"211\" y=\"72\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#8b4513\">Phase II</text><text x=\"211\" y=\"85\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">1 to 3 yrs</text><rect x=\"254\" y=\"54\" width=\"96\" height=\"40\" rx=\"3\" fill=\"#f3e7db\" stroke=\"#8b4513\"/><text x=\"302\" y=\"72\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#8b4513\">Phase III</text><text x=\"302\" y=\"85\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">2 to 4 yrs</text><rect x=\"354\" y=\"54\" width=\"70\" height=\"40\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"389\" y=\"72\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Review</text><text x=\"389\" y=\"85\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">6 to 12 mo</text><rect x=\"428\" y=\"54\" width=\"78\" height=\"40\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"467\" y=\"72\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Phase IV</text><text x=\"467\" y=\"85\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">ongoing</text><text x=\"137\" y=\"122\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8b4513\">100%</text><text x=\"211\" y=\"122\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8b4513\">60 to 70%</text><text x=\"302\" y=\"122\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8b4513\">about 30%</text><text x=\"389\" y=\"122\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8b4513\">55 to 60%</text><text x=\"14\" y=\"140\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8a8172\">Share of compounds still alive at each gate. Phase II is the worst one, and your desk lives in II and III.</text></svg><figcaption>The clock, and what survives each gate</figcaption>",
        html: "<p>Phase II has three jobs, and a strong candidate can tell you which one their study was really doing.</p>" +
        "<p>First, <dfn>proof of concept</dfn>: does this molecule do anything meaningful to this disease in these patients? This is the first honest test of the biological bet the company was founded on. Second, <dfn>dose finding</dfn>: which of two or three doses gives the best balance of effect and tolerability over months, rather than the weeks Phase I could observe. Getting this wrong is among the most common reasons a Phase III fails, and it is a mistake made here, not there. Third, signal seeking: which patients respond, defined by biomarker, disease stage, or prior therapy, and what endpoint the registrational trial should actually measure.</p>" +
        "<p>These trials are commonly randomized against placebo or standard of care, usually run a few dozen to a few hundred patients, and typically take one to three years. Many are built with a <dfn>futility analysis</dfn>: a prespecified look at partial data asking whether continuing could plausibly still succeed. If the answer is no, the trial stops early. Stopping for futility is a success of process, not a scandal, because the money and the patients go to something with a chance. Say that out loud to a candidate whose program was stopped and you sound like someone who has been around.</p>" +
        "<p>Then the <dfn>go/no-go</dfn> decision. Formally it belongs to senior leadership: the CMO with the CEO and the board, acting on the program team's recommendation. Practically, the physician who owns the program writes the medical case that decision rests on, which is precisely why these people are compensated the way they are. The decision is never only about the data. It is also about cost, the competitive landscape, and whether the company can finance the trial that would come next.</p>" +
        "<p>Most programs die here. Commonly cited industry figures put Phase II success near 30 percent, the worst gate in development, because Phase II is the first stage that asks a question the drug can genuinely fail. Phase I asks whether patients can tolerate it. Phase II asks whether the science is true.</p>" },

      { heading: "Phase III, where the money is",
        point: "Phase III puts the asset and the company at risk, and powering, comparator choice, and event driven timing decide whether it can succeed at all.",
        html: "<p>Phase III exists to support an approval, which is why you hear <dfn>registrational</dfn> and <dfn>pivotal</dfn>. Pivotal means the FDA is expected to rely on this trial in deciding whether the drug is approvable. Sponsors typically need two adequate and well-controlled trials, though a single very strong trial plus confirmatory evidence is accepted in some settings.</p>" +
        "<p><dfn>Powering</dfn>, in plain language: before anyone enrolls, biostatistics decides how many patients are needed to detect a difference of a specified size with high probability, assuming that difference is real. Assume a bigger benefit and the trial gets smaller, faster, cheaper, and more likely to miss. Assume a smaller one and it gets larger, slower, costlier, and more likely to succeed. That assumption comes straight out of Phase II. An underpowered trial can fail against a drug that genuinely works, and everyone signing the budget knows it.</p>" +
        "<p><dfn>Comparator</dfn> choice is strategic and political. Placebo is cleanest but frequently unethical where effective treatment exists. <dfn>Standard of care</dfn> as an active comparator is honest and much harder to beat, and standard of care can shift while your trial is running, which is a live risk in fast-moving areas. The choice reaches payers and non-US regulators too, so it runs through to the commercial forecast.</p>" +
        "<p>Readouts come in two shapes. <dfn>Time-driven</dfn>: everyone is treated and assessed over a fixed period, then the data are analyzed. <dfn>Event-driven</dfn>: analysis happens when a target number of events has accrued, meaning deaths, disease progressions, or cardiac events depending on the disease. Event-driven readouts slip, and they slip in a way nobody controls. If patients on both arms do better than the model assumed, events accumulate slowly and the date moves right. A physician telling you an event-driven trial is running long is not confessing failure, and treating it as one marks you as an outsider immediately.</p>" +
        "<p>Along the way come <dfn>interim analyses</dfn>: prespecified looks reviewed by an independent monitoring committee that can stop the trial for overwhelming benefit, for harm, or for futility. Nobody on the sponsor team sees unblinded results, and physicians take that firewall seriously.</p>" +
        "<p>Failure here is catastrophic in a way Phase II failure is not. A Phase III program can run several hundred to several thousand patients over two to four years at a cost commonly in the tens to hundreds of millions of dollars. For a single-asset company, missing the primary endpoint usually means the asset, the financing, and most of the staff go at once.</p>" },

      { heading: "Filing, review, and life after approval",
        point: "NDA versus BLA, the PDUFA clock, and the Complete Response Letter are vocabulary on every senior CV, and a CRL produces candidates within a month.",
        html: "<p>Awareness level only, but you need this vocabulary because it appears on every senior CV you will read.</p>" +
        "<p>What gets filed depends on what the drug is. A small molecule goes in a <dfn>New Drug Application</dfn> (NDA). A biologic, meaning an antibody, protein, cell therapy, or gene therapy, goes in a <dfn>Biologics License Application</dfn> (BLA). Both are enormous dossiers: every trial, every patient, the complete safety database, the manufacturing story, and proposed labeling. Regulatory Affairs assembles and files it. The physicians write and defend the clinical sections.</p>" +
        "<p>Review runs on a clock the agency sets under its user fee agreements. After a filing review of roughly 60 days, the goal is about 10 months for <dfn>standard review</dfn> and about 6 months for <dfn>priority review</dfn>, which is granted when a drug would be a significant improvement in a serious condition. The target decision date is the <dfn>PDUFA date</dfn>, and the whole company plans around it. Some applications go to an <dfn>advisory committee</dfn>, a public panel of outside experts whose vote is not binding but is heavily weighted and occasionally brutal.</p>" +
        "<p>Two outcomes matter to you. An approval letter means the drug can be marketed under a negotiated label. A <dfn>Complete Response Letter</dfn> (CRL) means no for now, with specific deficiencies named: sometimes a manufacturing problem at a plant the sponsor does not even own, sometimes a demand for another trial. A CRL rarely kills a compound outright, but it routinely kills that year's financing plan, and it produces candidates within a month.</p>" +
        "<p>The FDA is not the only agency in the room. Europe has the <dfn>EMA</dfn>, the European Medicines Agency, and other regions have their own. A physician who has run global programs sought EMA scientific advice much the way they sought an end of Phase 2 meeting, and the two agencies review on separate clocks, so a drug can be approved in one region and still pending in the other. You are not expected to speak to European procedure. You are expected to not be surprised when EMA appears three lines into a senior CV, and to ask which agency interactions the candidate personally sat in.</p>" +
        "<p>After approval comes <dfn>Phase IV</dfn>: studies in the marketed setting, some genuinely scientific and some commercially motivated. Distinct from those are <dfn>post-marketing requirements</dfn>, which the FDA imposes as a condition of approval, as against post-marketing commitments, which the sponsor volunteers. The sharpest case is <dfn>accelerated approval</dfn>, granted on a surrogate endpoint with a <dfn>confirmatory trial</dfn> owed afterward. If that confirmatory trial fails, the drug can be pulled from the market. Those confirmatory programs are late-phase work run by real physicians, so they land on your desk even though the word post-marketing makes them sound like somebody else's problem.</p>" },

      { heading: "The odds and the clock",
        point: "Roughly one in ten compounds entering Phase I ever reaches approval, so quote ranges as commonly cited and use them to explain both failure and scarcity.",
        html: "<p>You will be asked how risky a program is, directly by candidates and sideways by clients. Answer in ranges, attribute them as commonly cited, and never quote a decimal you cannot defend.</p>" +
        "<ul><li>Probability that a compound entering Phase I eventually reaches approval: commonly cited near 10 percent overall, and materially lower in oncology, often cited around 5 percent.</li>" +
        "<li>Phase I to Phase II: commonly cited around 60 to 70 percent. Tolerability is a lower bar than efficacy.</li>" +
        "<li>Phase II to Phase III: commonly cited near 30 percent, the worst gate in development.</li>" +
        "<li>Phase III to filing: commonly cited around 55 to 60 percent. Most of the money in the industry is spent behind that coin flip.</li>" +
        "<li>Filing to approval: commonly cited around 85 to 90 percent. By this point most of the scientific risk is already gone.</li></ul>" +
        "<p>Duration, roughly: Phase I several months to about a year, Phase II one to three years, Phase III two to four years, review six to twelve months after submission. First human dose to approval is commonly cited at six to eight years, and discovery to approval at ten to fifteen.</p>" +
        "<p>Two ways to use these on a call. With a candidate, the numbers explain why a dead program is not a referendum on them, and why nearly every physician you place has worked on something that failed. Ask what they learned from the one that died and you will get a better conversation than any question about strengths. With a client, the same numbers explain why the Phase III physician they want is scarce: most industry physicians never get to run one, because most programs never get there.</p>" }
    ],

MODULES.push({
  id: "m11",
  title: "Medical Affairs and the MSL",
  tagline: "Two Medical Director seats, the MSL map, and the contract model your firm actually sells",

  learn: {
    sections: [
      { heading: "Your firm's other desk: Inside MSL and the contract model",
        point: "A contract MSL is a full-time W2 employee of the staffing firm doing an identical day-to-day job, and a meaningful share of those assignments convert to permanent hires.",
        html: "<p>Michael Petrak leads the medical affairs recruiting practice at Kaye Bassman International, the same firm that runs your physician desk. He has recruited in the space since roughly 2007, and his team counts over a thousand MSL placements. Inside MSL is his platform, and by its own pitch it does two things at once: it trains the medical affairs community, through a membership video curriculum, monthly insider meetings, and one-on-one coaching that runs from breaking in through leading teams, and it builds field medical teams for client companies, on contract or direct hire. Know it cold. It is your firm's product line, and aspiring MSLs will land on your desk by mistake.</p>" +
        "<p>The contract mechanics: a <dfn>contract MSL</dfn> is a full-time W2 employee of the staffing company, not of the pharma company they support. The staffing firm is the party on contract, hired to find, train, and deploy the person on the client's program. Day to day the job is identical to a permanent MSL seat, same KOL engagement, same territory management, same scientific exchange; what differs is who signs the paycheck and that the engagement has a defined run. Some engagements cover a launch or fill a gap; others run a year or more, and a meaningful share convert into permanent direct hires, which the course calls <dfn>internalization</dfn> and labels one of the most underappreciated parts of the model.</p>" +
        "<p>Why each side buys. Companies use contract teams to hold risk: build the field team before the pivotal readout, and if the readout fails the team is cut, but a permanent team would have been cut too. Candidates use it to cure the experience gap, because a contract assignment is real MSL experience on a resume, which no amount of networking replicates. Your desk angle: route aspiring MSLs and med affairs professionals to the medical affairs practice as warm referrals, and note that a client comfortable with contract field staffing often thinks about development hiring risk the same way.</p>" },

      { heading: "Medical affairs in one page",
        point: "Medical affairs is walled off from commercial, and the MSL runs scientific exchange with KOLs: scientific not commercial, reactive not promotional, documented not informal.",
        html: "<p>An <dfn>MSL</dfn>, medical science liaison, is a doctoral-level scientific expert, most commonly a PharmD, employed by a pharma, biotech, device, or diagnostics company to run peer-to-peer scientific exchange with <dfn>KOLs</dfn>, the physicians and researchers whose opinions move other doctors. The MSL sits in medical affairs, not commercial: no sales quota, no pay tied to prescriptions, and off-label discussion only in response to unsolicited questions, always with fair balance. The role is field-based, covering a multi-state territory from a home office. It was born at Upjohn in the 1960s for conversations too nuanced for sales forces, and hardened into a real profession in the early 2000s when off-label settlements forced companies to wall medical off from commercial. The course sees medical affairs headed toward a third co-equal pillar beside R&amp;D and commercial. The whole function runs on one boundary mantra: scientific not commercial, reactive not promotional, documented not informal.</p>" +
        "<p>The neighbors, one line each:</p>" +
        "<ul><li><strong>Sales rep</strong>: drives prescriptions, on-label only, steps out when the conversation goes off-label; the MSL steps out when it turns to pricing.</li>" +
        "<li><strong>TLL</strong>, thought leader liaison: commercial seat that recruits physicians for speaker bureaus.</li>" +
        "<li><strong>CTL</strong>: supports trial sites and enrollment; small early-phase biotechs sometimes merge it with the MSL.</li>" +
        "<li><strong>CRA</strong>: monitors trial conduct, protocol adherence, consent, data, GCP.</li>" +
        "<li><strong>CNE</strong>: teaches nurses, staff, and patients safe administration.</li>" +
        "<li><strong>MCL and HSL</strong>: economic-value conversations with payers, PBMs, and health systems.</li>" +
        "<li><strong>Field HEOR</strong>: outcomes and total-cost-of-care evidence for formulary and value analysis committees.</li></ul>" +
        "<p>Field medical is a pyramid: VP of Medical Affairs on top, a national MSL director, regional directors as the first people-leadership rung, then the MSLs. The individual contributor ladder runs MSL, Senior MSL, Principal MSL, with Principal the highest IC and a voice in strategy. Around the field team sit the headquarters functions: <dfn>MedCom</dfn> writes the proactive content, core decks, posters, congress materials; <dfn>medical information</dfn> is the reactive twin, largely pharmacist-staffed, answering HCP questions from standard response documents and routing adverse events into pharmacovigilance, often to a Drug Safety Physician, a seat your desk places; publication planning sequences studies into journals on a multi-year plan timed around congresses, under GPP rules that ban ghostwriting and burying unfavorable data; Medical Excellence is the KPI and process layer that proves the department's value; medical training runs the onboarding boot camp that takes a new hire to field-ready; HEOR builds the economic case, cost-effectiveness models, real-world evidence, payer dossiers. Carry this map and you can follow any med affairs conversation without slowing it down.</p>" },

      { heading: "Two Medical Directors, one title",
        point: "Read the CV for what the person owned: protocols, sites, and readouts mean development, while promo sign-off, narrative, and ad boards mean medical affairs.",
        html: "<p>The course says it plainly: there are Medical Directors in clinical development and Medical Directors in medical affairs, and rarely does one person work both sides. The seat you place is the development one: owns protocol design and study conduct, drives Phase II and III programs toward readouts, and climbs the ladder from Medical Director to Senior MD to Executive MD to VP of Clinical Development, with Therapeutic Area Head as the parallel seat. The medical affairs Medical Director is a different animal. They own the medical strategy and narrative for an approved product or therapeutic area; they approve promotional materials for medical accuracy so marketing claims do not outrun the science; they carry final sign-off in MLR review; they typically run the advisory boards MSLs help assemble; they partner with development on trial design from the medical affairs side; and they report to the VP of Medical Affairs as the therapeutic expert, based at headquarters with modest travel. The seat usually goes to a physician; held by a PharmD or PhD, the title becomes <dfn>scientific director</dfn>.</p>" +
        "<ul><li>Read CVs for what the person owned, not the title. Protocols, sites, and readouts mean development. Promo sign-off, narrative, and ad boards mean medical affairs.</li>" +
        "<li>The MSL growth path points at the medical affairs director seat, not yours. MD-degreed MSLs get pulled toward it, which is one reason MDs are rare in field medical and read as short-term hires there.</li>" +
        "<li>Crossing is close to one-way. Development physicians who move to medical affairs rarely come back, and a medical affairs director rarely converts into a program seat. Submitting one on a Phase II or III program search is a real desk error, and the client will read it as one.</li>" +
        "<li>The scientific director corner: the course warns that a non-MD promoted into the role can end up under-degreed for other medical director seats and overqualified for MSL seats. That trapped feeling is a motivation lever you will meet in the wild.</li></ul>" },

      { heading: "How the market screens, and when it pays",
        point: "MSL hiring gates on five things at once, terminal degree, one deep therapeutic area, the right center, live KOL relationships, and metro geography, with preferred experience meaning required.",
        html: "<p>The course scores an aspiring MSL like a slot machine that needs five cherries. One, a terminal degree: PharmD is by a wide margin the most common and reads safest to a hiring manager; PhD is preferred in mechanism-heavy spaces like gene therapy; DNP is respected; NP and PA are the fastest-growing entrants; MD is rare in the field because MDs get pulled toward director seats. Two, one deep therapeutic area: the course teaches that saying I can learn it announces you are not qualified, and claiming several areas means owning none. The bar is narrower than outsiders believe: solid tumor and malignant heme are different universes, and a leukemia specialist struggles to land a lymphoma seat. Three, the right employer now, because a company hires you out of a KOL center, trains you, and puts you back to harvest your relationships. Four, live KOL relationships: hired for who you know. Five, geography: a primary metro near an airport with direct flights, because a standard national team is only around a dozen territories.</p>" +
        "<p>On top of the cherries sits experience, where preferred means required: the role is autonomy in front of the company's most prized physicians, prior experience is the cleanest risk signal, and it wins ties almost automatically against fields of hundreds of applicants. Who takes the inexperienced bet splits by client size. Big pharma does: training infrastructure, a brand that opens doors without the candidate's network, and tolerance for a mishire. A three-MSL biotech cannot, because one mishire is a third of the team, so it pays up for experience and networks. And relocation: offering to relocate does nothing up front, since recruiter searches filter on location and the client is buying your current relationships, but late in a process, once they have seen you present, it can win a thin territory.</p>" +
        "<p>The clock matters too. The course teaches Q4 as the best break-in quarter: MSL bonuses commonly pay out around the end of Q1, so poaching an employed MSL in Q4 takes a hefty sign-on to offset the forfeited bonus, which suddenly makes candidates without that price tag attractive. The MSL offer itself: base, a discretionary target bonus commonly around 15 percent, a car benefit as fleet vehicle or allowance, and sign-on money that exists to offset forfeitures, so a lateral base is still a real raise. Travel: postings state the ceiling, not the average; day trips count toward the percentage; overnights cluster in planned conference season; and the course calls travel the number one reason new MSLs quit, so qualify lived travel, not posted travel. Your physician desk runs on the same physics: small pools, risk-priced experience, hard geography gates, and closes timed against the bonus calendar.</p>" },

      { heading: "Rules of the game: the PhRMA code and the Sunshine Act",
        point: "The PhRMA code bans entertainment and gifts outright, and the Sunshine Act puts physician payments in Open Payments, which you should read before every first call.",
        html: "<p>The <dfn>PhRMA code</dfn> is the industry trade association's rulebook for interacting with healthcare professionals, and medical affairs lives inside it. Meals: modest, and only alongside a substantive scientific or educational discussion in a setting that supports one. Entertainment: banned outright, no golf, concerts, sporting events, theater, or spa days, even when business is discussed at the event. Gifts: reminder items like pens, mugs, and branded notepads went out long ago; the only acceptable gift is modest and directly benefits patient care, a medical textbook being the classic example. Speaker programs: must serve a genuine educational need, no inviting an HCP to hear the same topic again just to collect another benefit, and no alcohol. Consulting: legitimate, but at fair market value, documented, for real work the company actually needs. You cannot pay a KOL because you like them.</p>" +
        "<p>The <dfn>Sunshine Act</dfn> is the federal law that makes those relationships public: pharmaceutical and device companies must report payments and transfers of value to physicians and teaching hospitals, consulting fees, speaker fees, meals, travel, research funding, and it all lands in the searchable public <dfn>Open Payments</dfn> database. The course frames it for candidates as personal responsibility. For you it is a desk tool: your candidates are physicians, so look one up before the first call. Advisory work, speaker fees, and research money tell you the physician is industry-fluent and warm to the conversation you are about to start. Two more handles: OIG, the federal watchdog behind most compliance anxiety, and MLR, the internal medical-legal-regulatory committee that approves anything used in the field.</p>" +
        "<p>Pharma language also tells time. A company filing its first IND is years from needing MSLs, while a company approaching its PDUFA date, the FDA's target decision date, is building medical affairs now; a complete response letter pushes that buildout back. Your desk reads the same signals in reverse: early pipeline means development hiring, and that is you.</p>" },

      { heading: "The recruiter, seen from the other side",
        point: "Candidates are taught keyword-and-location profiles and one-ball-at-a-time follow-up, so invert it: write sourcing strings the same way and hold your client follow-ups to the tennis rule.",
        html: "<p>The course spends three videos teaching candidates how to deal with people like you. Invert every lesson. It splits recruiters into internal talent acquisition, who field applications and send keyword-driven LinkedIn messages and are nearly impossible to reach live, and external agency recruiters, paid by client companies to deliver a specific phenotype; then it splits external into generalists and specialists and tells candidates to find the specialist. Its bluntest frame: the client is the company, and the candidate is the product. Deliver the wrong product and the client doubts the service, which is why a recruiter cannot give every hopeful fifteen minutes. Own the framing without the cruelty: you cannot submit everyone, but the person wrong for this search belongs on the map for the next one.</p>" +
        "<p>The outreach message the course holds up as perfect: name, degree and certification, the center they work at, the specialty, the metro, then a single ask, how do I stay visible when you post something in my area, with no call demanded and the ball left in the recruiter's court. The smart re-approach: watch the recruiter's postings and come back only when therapeutic area and geography both match, adding that if no experienced candidate fits just right, keep me in mind. LinkedIn is taught as a keyword trap: recruiter searches run on keywords plus location, so set location to the nearest major metro, never the whole country; load the skills section with searchable clinical terms, nephrology beats Excel; make the headline concrete; treat the about and experience sections as search optimization, not autobiography.</p>" +
        "<p>Etiquette: never a blank connection request; one line on who you are and why; no job ask, call ask, or favor at the handshake; engage with a person's content before you need them; after silence, one follow-up about a month later with something new to say, because silence means not right now, not never. With hiring managers, the tennis rule: reach out at signal moments only, roughly a week of silence after applying or after interviewing; once a process starts, stay in email; hit one ball over the net and let silence answer, no or not yet; if they want you, they will drive. Now the desk inversions: your sourcing runs on the same keyword-and-location physics, so write search strings the way candidates are taught to bait profiles; your outreach competes with mass AI spam, and fewer, more specific messages always win; your posted searches are bait that serious candidates monitor; and hold your own client follow-ups to the tennis rule, because desperate reads the same in both directions.</p>" }

    sections: [
      { heading: "Why the handoff is worth money",
        point: "Referring a search you cannot fill is not losing it: it converts a dead lead into a split fee and buys you an account you could not have opened alone.",
        html: "<p>Every week something lands on your desk that is not a clinical development physician. A client you placed a Medical Director with asks whether you also do regulatory. A candidate you cannot use offers to introduce you to the person who runs manufacturing. A rookie treats these as noise, or worse, takes the search anyway and fails slowly in public.</p>" +
          "<p>The alternative is simple arithmetic. You cannot fill a <dfn>GMP</dfn> quality search. Somebody at your firm can. Handing it to them commonly pays you a share of the fee under whatever <dfn>split</dfn> policy your firm runs, and the exact share is a question for Jim, not for a guess in this app. Even at a fraction, a split on a search you were never going to fill is infinite return on the fifteen minutes it cost you.</p>" +
          "<p>The second payoff is larger and slower. A client who asks you for something outside your lane is testing whether you are a vendor or an adviser. Saying <em>that is not mine, but here is the person whose whole desk it is</em>, and then making the introduction properly, is the single cheapest way to become the person they call first about everything. The referral costs you nothing you had. The account is worth years.</p>" +
          "<p>So the goal of this module is not to make you competent in these functions. It is to make you fast at recognizing them, honest about the boundary, and useful at the handoff.</p>" },

      { heading: "The functions that are not yours",
        point: "Six neighboring practices surround your desk, and you need one honest sentence on each rather than any depth at all.",
        html: "<p>Your desk is clinical development physicians, with clinical operations as supporting knowledge. Here is what sits around it, one sentence each. One sentence is the correct amount.</p>" +
          "<ul>" +
          "<li><dfn>Regulatory Affairs</dfn>: owns the interface with health authorities, assembles and files the IND, NDA and BLA, runs meeting requests, and negotiates labeling. Sub-specialties include regulatory CMC, labeling, and regulatory operations, which is the publishing and submission machinery.</li>" +
          "<li><dfn>Biometrics</dfn>: the numbers organization. Biostatistics designs the analysis, statistical programming writes the code that produces the tables, and clinical data management owns the database and the path to lock.</li>" +
          "<li><dfn>CMC</dfn> and technical operations: chemistry, manufacturing and controls. Process development, analytical methods, scale up, tech transfer, supply chain, and the quality organization that runs under GMP. This is a large and well paid practice and it is nothing like yours.</li>" +
          "<li><dfn>Discovery and preclinical</dfn>: target identification, medicinal chemistry, biology, pharmacokinetics, and the GLP toxicology that supports an IND. Sits under the CSO, not the CMO.</li>" +
          "<li><dfn>Commercial</dfn>: marketing, sales, pricing, market access and payer strategy, commercial analytics, and launch. Led by a chief commercial officer.</li>" +
          "<li><dfn>Quality Assurance</dfn>: audits sites, vendors and processes against GCP or GMP and owns inspection readiness. Related to your world through GCP, but a distinct career and a distinct search.</li>" +
          "</ul>" +
          "<p>Two more sit close enough to confuse you. <dfn>Pharmacovigilance operations</dfn>, meaning case processing and safety systems, is not the drug safety physician seat you do place. And <dfn>HEOR</dfn>, health economics and outcomes research, builds the value case for payers and is usually counted as commercial or medical affairs rather than development.</p>" },

      { heading: "The tells, in ninety seconds",
        point: "Requisitions announce which practice they belong to through their vocabulary, so learn the trigger words and you can route a call before it ends.",
        html: "<p>You do not need to understand these functions to route them. You need to hear one word and know where it lives. Treat this as a lookup you run while the client is still talking.</p>" +
          "<ul>" +
          "<li>Batch, lot, scale up, tech transfer, validation, fill finish, drug substance, drug product, GMP: <strong>CMC and technical operations.</strong></li>" +
          "<li>Submission, dossier, module 3, eCTD, health authority meeting, labeling negotiation, agency correspondence: <strong>regulatory affairs.</strong></li>" +
          "<li>SAS, R, SDTM, ADaM, define file, statistical programming, table shells: <strong>biometrics.</strong></li>" +
          "<li>Query resolution, database build, EDC configuration, data cleaning: <strong>clinical data management</strong>, which is biometrics rather than yours, though you will meet it constantly.</li>" +
          "<li>Case intake, ICSR, literature screening, safety database, MedDRA coding at volume: <strong>pharmacovigilance operations</strong>, not the drug safety physician.</li>" +
          "<li>Audit, CAPA, inspection readiness, SOP, deviation management as a career rather than an event: <strong>quality assurance.</strong></li>" +
          "<li>Brand, launch, share of voice, payer, formulary, gross to net, field force: <strong>commercial.</strong></li>" +
          "<li>Target validation, hit to lead, medicinal chemistry, DMPK, GLP tox: <strong>discovery and preclinical.</strong></li>" +
          "</ul>" +
          "<p>The habit worth building is asking one clarifying question rather than assuming. <em>When you say safety, do you mean the physician who assesses causality, or the team that processes the cases?</em> That single question separates your desk from someone else's, and clients notice that you knew to ask it.</p>" },

      { heading: "Medical affairs, the boundary that will catch you",
        point: "A Medical Director in medical affairs and a Medical Director in clinical development share a title and almost nothing else, so always establish which one a client means.",
        html: "<p>This is the confusion that will embarrass you first, because the titles collide exactly. Both organizations have Medical Directors. They are different jobs, different candidates, and sometimes different practices inside your firm.</p>" +
          "<p>A <strong>clinical development</strong> Medical Director owns a protocol and the medical data inside a study. Trials, endpoints, eligibility, causality, the CRO. That is your desk.</p>" +
          "<p>A <strong>medical affairs</strong> Medical Director works on the approved or nearly approved product: field medical strategy, scientific exchange, publications, advisory boards, medical information, and the MSL team. Post-approval facing, non-promotional, and structurally separated from commercial by compliance rules rather than by preference.</p>" +
          "<p>You have a whole module on medical affairs already, because a physician search desk touches it constantly and because the recruiting craft transfers. The point here is narrower: <strong>never accept the phrase Medical Director on an intake call without establishing which organization it sits in.</strong> Ask what the person's first six months look like. If the answer is protocols and data, it is yours. If the answer is congresses, KOLs and publications, it is medical affairs, and you should know whether that is your search to run or a colleague's before you promise anything.</p>" },

      { heading: "How to hand it off without losing the relationship",
        point: "A referral is only worth something if you make the introduction yourself, stay on the thread, and agree the split before the work starts, not after it succeeds.",
        html: "<p>The bad handoff is a name and an email address thrown over a wall. It helps nobody, the client never hears from anyone, and you get no credit. The good one is short and deliberate.</p>" +
          "<p>Say the true thing first. <em>That is not my desk. I place clinical development physicians, and a quality search is genuinely a different market. I would be guessing, and you would feel it in the shortlist.</em> Clients rarely punish this. They have all been burned by a recruiter who pretended.</p>" +
          "<p>Then own the connection rather than pointing at it. Get the name of the colleague whose practice it is, agree the split with them before anything moves, and make the introduction yourself on a live call or an email you write. Stay on the thread. Ask how it went two weeks later. The account stays yours in the client's mind even while somebody else does the work.</p>" +
          "<p>Do the same thing in the other direction with candidates. A regulatory director you cannot place is still a person who knows which companies are hiring physicians, who just lost a CMO, and which programs are in trouble. A referral out is also an intelligence source in.</p>" },

      { heading: "The line you will be tempted to cross",
        point: "Taking a search outside your market to look useful costs you the client slowly and publicly, which is worse than the ten seconds of saying no.",
        html: "<p>The temptation is real, especially in month three when the board is thin. A client offers you a regulatory search. Taking it feels like activity. It is not.</p>" +
          "<p>Here is what actually happens. You do not know the market, so you cannot build a credible map. You do not know the vocabulary, so your screens are shallow and your submittals are wrong. The client works through your shortlist, finds nobody, and concludes not that you were outside your lane but that you are not very good. You then lose the physician searches you could have filled. A failed search out of market is more expensive than no search, because it spends the credibility you were going to use on the work you can actually do.</p>" +
          "<p>The self-check is one question, asked honestly. <strong>Can I name five people who would be a genuine shortlist for this, or a way to find them by Friday?</strong> If yes, it may be workable with support. If no, it is a referral, and the fastest route to a fee is to hand it to the person who can name fifteen.</p>" +
          "<p>Specialisation is not a limitation you apologise for. It is the entire reason a client pays a retained fee instead of posting an advertisement. Say what you do, say it plainly, and route the rest.</p>" }
    ],

    '<div class="mathbox"><span class="eyebrow">The desk math</span>' +
    "<p>Your candidates run clinical programs. This week one of them is at a data readout, an investigator meeting, or a safety review that started at six in the morning. Physician silence is usually a calendar problem, not a verdict. On a physician desk, a real answer inside two weeks is normal cadence, and a meaningful share of eventual placements went quiet at least once during the process.</p></div>" +
    "<p>What is in your control: the quality of the nudge and the depth of your bench. What is not: their inbox.</p>" +
    "<p>The next hour:</p>" +
    "<ul><li>Send one short nudge with a reason attached: a concrete update about the search, not a check-in. A message that gives information gets answered; a message that asks for reassurance does not.</li>" +
    "<li>Set a date fourteen days out. If nothing by then, one phone call, then they move to the long list and you stop paying rent on them mentally.</li>" +
    "<li>Add one new name to the map for this search. Silence from one candidate costs nothing if the bench is deep.</li></ul>",
  rep: { label: "Run the full screen scenario", href: "#/scenario/sc04" }
});

    "<p>Somewhere in the call you used a term loosely, or asked a question they considered beneath them, and the temperature dropped. It stings because part of you agrees: they have an MD and twenty years, you have a desk and ten days of study.</p>" +
    '<div class="mathbox"><span class="eyebrow">The desk math</span>' +
    "<p>You are not selling them science. You are selling market knowledge they do not have: who is hiring, what programs pay, which companies burn physicians out, what their profile is worth right now. Nobody at their company will tell them that. The science you owe this desk is a finite, countable list: ten modules and 65 glossary entries in this app. The recruiters who last learn exactly that much to ask sharp questions, and zero recruiters win by pretending to be clinicians.</p></div>" +
    "<p>Condescension also carries signal: candidates who need to establish rank on a first call often behave the same way in client interviews. Note it. It belongs in your assessment.</p>" +
    "<p>The next hour:</p>" +
    "<ul><li>Write down the exact term or moment where the call turned. That is data about a gap, and gaps close.</li>" +
    "<li>Drill the module that covers it until the term is yours.</li>" +
    "<li>Do not drop the candidate for bruising your ego. Drop them only if the arrogance is a placement risk.</li></ul>",
  rep: { label: "Open the modules and close the gap", href: "#/modules" }
});

ROUGHDAYS.push({
  id: "zero-month",
  trigger: "Months in, zero placements",
  sub: "The ramp",
  body:
    "<p>Other people at the firm are billing and you are not. Before you decide you are failing, check the arithmetic of the desk you are actually on.</p>" +
    '<div class="mathbox"><span class="eyebrow">The desk math</span>' +
    "<p>A retained physician search commonly runs roughly four to six months from kickoff to a signed offer, and roughly six to eight months to a start date once a notice period is counted. A rookie's first placement commonly lands six to twelve months in, because the first quarter is spent building maps and relationships that produce nothing visible. Zero placements at month four is not off the curve; it is the curve. What would actually be off the curve: no growth in conversations, submittals, and interviews from month to month.</p></div>" +
    "<p>So audit the funnel, not the feeling. Conversations, submittals, interviews, offers: which stage is thin? Thin at the top means an activity problem, and activity is fully in your control. Conversions failing in the middle mean a screening or positioning problem, which is coachable. Offers dying at the end usually means the search itself was sick.</p>" +
    "<p>The next hour:</p>" +
    "<ul><li>Pull your four funnel numbers for the last eight weeks. Write them down where you can see them.</li>" +
    "<li>Name the one thinnest stage and one process change aimed at it. One.</li>" +
    "<li>Book the conversation with your manager before they book it with you. Numbers first, plan attached.</li></ul>",
  rep: { label: "Write the month-four brief", href: "#/scenario/sc08" }
});

ROUGHDAYS.push({
  id: "botched-call",
  trigger: "You fumbled the science",
  sub: "Wrong term, wrong moment",
  body:
    "<p>You said progression free survival when you meant overall survival, or blanked on what a medical monitor actually signs off on, and you heard yourself doing it in real time.</p>" +
    '<div class="mathbox"><span class="eyebrow">The reality</span>' +
    "<p>Candidates do not remember single slips; they remember trend lines. A recruiter who is visibly learning week over week reads as serious. A recruiter who bluffs reads as dangerous, because physicians spend their careers detecting overconfident wrongness. The recovery line is one sentence: that is outside what I know today, I will check and come back to you. Said plainly, it raises your credibility rather than lowering it.</p></div>" +
    "<p>Never bluff a clinical term. The candidate will let it slide on the call and quietly downgrade everything else you said.</p>" +
    "<p>The next hour:</p>" +
    "<ul><li>Log the exact term you missed and what you should have said.</li>" +
    "<li>Drill the module it came from until you could explain it to a client without notes.</li>" +
    "<li>If the slip was material, use it: a short follow-up correcting yourself precisely is a second touch that most recruiters never earn.</li></ul>",
  rep: { label: "Fill-in drill: oncology vocabulary", href: "#/fillin/m08" }
});

ROUGHDAYS.push({
  id: "fee-lost",
  trigger: "The fall-off",
  sub: "A placement came apart",
  body:
    "<p>They accepted, they resigned, and then they called you to undo it, or worse, they just started going quiet with the client. The fee is clawed back or a free replacement search is owed, and everyone at the firm knows.</p>" +
    '<div class="mathbox"><span class="eyebrow">The desk math</span>' +
    "<p>Fall-offs cluster around two causes, and both are preventable earlier than they happen: a resignation the candidate never rehearsed, and a counteroffer nobody inoculated against. The pattern recruiters live by is that counteroffer acceptors resurface in the market within months, because the raise fixed the symptom and left every reason they were leaving intact. Your guarantee terms define the cost; your process defines the frequency.</p></div>" +
    "<p>The autopsy questions: when did you last talk about why they were leaving, in their own words? Did they rehearse the resignation with you? Did you name the counteroffer before the employer made it? Was there silence during the notice period? Whichever answer embarrasses you is the process fix.</p>" +
    "<p>The next hour:</p>" +
    "<ul><li>Write the four-line autopsy while it is fresh.</li>" +
    "<li>Call the client with a plan, not an apology tour: replacement search terms, timeline, what changes.</li>" +
    "<li>Move the fallen candidate to a six-month follow-up. A meaningful share come back, and you want the relationship intact when they do.</li></ul>",
  rep: { label: "Run the counteroffer scenario", href: "#/scenario/sc07" }
});

ROUGHDAYS.push({
  id: "overwhelmed",
  trigger: "Drowning in the science",
  sub: "Too much to know",
  body:
    "<p>Every call surfaces three more terms you have never heard. The reading list grows faster than you can read it, and the gap between you and credible feels permanent.</p>" +
    '<div class="mathbox"><span class="eyebrow">The desk math</span>' +
    "<p>The bar is recruiting-grade fluency, not medical knowledge, and they are different products. Recruiting-grade means you know the ladder, the phases, the endpoint names, and what each role actually owns, well enough to ask one sharp question and hear the shape of the answer. The scope is finite and countable: ten modules and 65 glossary entries, and that is the whole requirement. The physician brings the medicine and you bring the market, and reading past that list does not move the line between the two.</p></div>" +
    "<p>The eighty-twenty on this desk is brutally short: the ladder and what each rung owns, Phase II versus Phase III, the oncology endpoints, and the difference between a medical monitor and a drug safety physician. Own those four and you can navigate ninety percent of first calls.</p>" +
    "<p>The next hour:</p>" +
    "<ul><li>Stop adding inputs. No new videos, no new lists.</li>" +
    "<li>Reread one module, the one closest to tomorrow's calls.</li>" +
    "<li>Say the honest line out loud once so it is available under pressure: I am not a clinician, and I will not pretend to be one; here is what I do know.</li></ul>",
  rep: { label: "Reread The Ladder", href: "#/learn/m05" }
});

ROUGHDAYS.push({
  id: "plateau",
  trigger: "Flat and unmotivated",
  sub: "The drills feel pointless",
  body:
    "<p>Week one adrenaline is gone, the app scores stopped moving, and the whole project feels theoretical. You would rather scroll. That is in fact why this tab exists.</p>" +
    '<div class="mathbox"><span class="eyebrow">The desk math</span>' +
    "<p>Scores flatten when the drills stop being hard, and the early gains were cheap because you knew nothing. Recognizing a term inside four options and producing it from a blank are different tests, and this app runs both: 100 quiz items and 80 fill-ins across ten modules. High quiz mastery next to a weak fill-in score on the same module means the vocabulary is recognized and not yet owned, and only the owned version survives a live call with a CMO. The Progress screen carries both numbers, module by module.</p></div>" +
    "<p>Two process rules cover the flat stretch. Stop redrilling modules you already pass, because a module sitting near the top measures nothing new; sort by your lowest score and work that one. And change format before you change modules: quiz to fill-in, fill-in to short answer, because the format change is what converts recognition into recall.</p>" +
    "<p>The next hour:</p>" +
    "<ul><li>One rep, smallest available: a single quiz on today's module. Not the whole day plan. One rep.</li>" +
    "<li>Check Progress after, not before, and read the fill-in column rather than the mastery column.</li>" +
    "<li>If you truly cannot drill, do desk work instead: ten minutes on the intake bank in the Guide, which is the list you will actually read from on a live client call.</li></ul>",
  rep: { label: "Go to today's plan", href: "#/home" }
});
/* Field guide: searchable glossary, the ladder, the intake bank, CV signals.
   Tags must be one of: acronym, trials, roles, desk. */
GUIDE.entries.push(
  /* ---------- acronyms ---------- */
  { term: "IND", tag: "acronym", def: "Investigational New Drug application. The filing that lets a sponsor start testing a drug in humans. FDA has 30 days to object; silence means the study may proceed." },
  { term: "NDA", tag: "acronym", def: "New Drug Application. The marketing application for a small molecule drug." },
  { term: "BLA", tag: "acronym", def: "Biologics License Application. The marketing application for a biologic such as an antibody, a cell therapy, or a vaccine. Probe any candidate who claims BLA experience: authoring the clinical sections is very different from attending one meeting." },
  { term: "CRO", tag: "acronym", def: "Contract Research Organization. The vendor that runs trial operations for a sponsor. Heavy CRO time on a CV is not a negative, but it changes what the person has actually owned." },
  { term: "CRA", tag: "acronym", def: "Clinical Research Associate. The monitor who visits sites, verifies data against source records, and catches protocol deviations." },
  { term: "SAE", tag: "acronym", def: "Serious Adverse Event. An adverse event that is fatal, life threatening, requires hospitalization or prolongs an existing hospitalization, causes persistent disability or a birth defect, or is otherwise medically important. Seriousness is a regulatory category, not a measure of severity." },
  { term: "AE", tag: "acronym", def: "Adverse Event. Any untoward medical occurrence in a trial participant, whether or not the drug caused it." },
  { term: "SUSAR", tag: "acronym", def: "Suspected Unexpected Serious Adverse Reaction. A serious event that is possibly drug related and not already described in the safety reference document. These drive expedited reporting clocks." },
  { term: "DSMB", tag: "acronym", def: "Data Safety Monitoring Board, also called a DMC or Data Monitoring Committee. An independent group that reviews unblinded safety and sometimes efficacy data during a trial and can recommend continuing, modifying, or stopping." },
  { term: "SAP", tag: "acronym", def: "Statistical Analysis Plan. The prespecified document that fixes how the data will be analyzed, finalized before unblinding so nobody can fish for a result afterward." },
  { term: "CSR", tag: "acronym", def: "Clinical Study Report. The formal report of a completed trial that feeds the marketing application." },
  { term: "IRB", tag: "acronym", def: "Institutional Review Board, called an ethics committee outside the United States. Approves the protocol and consent documents before a site can enroll." },
  { term: "PI", tag: "acronym", def: "Principal Investigator. The physician who holds responsibility for the conduct of the trial at a given site." },
  { term: "EDC", tag: "acronym", def: "Electronic Data Capture. The system sites use to enter trial data." },
  { term: "GCP", tag: "acronym", def: "Good Clinical Practice. The international standard governing how a trial is designed, run, recorded, and reported, covering consent, investigator responsibility, safety reporting, and data integrity. Everyone on a study invokes it constantly, so treat it as the floor rather than as a credential: a candidate saying they know GCP has told you nothing until they say what they decided under it." },
  { term: "GxP", tag: "acronym", def: "The family of good practice standards. GCP covers clinical trials and is the one that touches this desk. GLP covers preclinical laboratory work and GMP covers manufacturing, both of which belong to other practices. Recognize the words; do not claim the ground." },
  { term: "PV", tag: "acronym", def: "Pharmacovigilance. The discipline that watches a drug's harms across its whole life rather than inside one study: case processing, signal detection, benefit-risk assessment, aggregate reports, and the safety language in the label. Where the drug safety physician lives." },
  { term: "EMA", tag: "acronym", def: "European Medicines Agency, the European counterpart to FDA. A physician who has run global programs will have sought EMA scientific advice much the way they sought an end of Phase 2 meeting, and the two agencies approve on separate clocks. Awareness level for this desk, but the name belongs in your vocabulary because it sits on senior CVs." },
  { term: "SOC", tag: "acronym", def: "Standard of care. Whatever the treating physician would normally give for that disease today. It is the benchmark a new drug has to beat, the usual comparator arm once withholding treatment would be unethical, and it moves, which is exactly what makes a long registration trial risky." },
  { term: "CMO", tag: "acronym", def: "Chief Medical Officer. The physician executive who owns medical strategy for the company and answers to the board." },
  { term: "MD/PhD", tag: "acronym", def: "A physician who also holds a research doctorate. Common in translational and early-phase development, and a strong signal for programs built on mechanism." },
  { term: "MSL", tag: "acronym", def: "Medical Science Liaison. The field-based scientific face of medical affairs: builds peer relationships with practicing experts, exchanges data non-promotionally, and gathers field insight. Not a sales role, and the separation is a compliance wall, not a nicety." },
  { term: "KOL", tag: "acronym", def: "Key Opinion Leader, increasingly called an external expert. The influential physicians who run steering committees, advisory boards, and guidelines. MSLs manage these relationships; TA Heads know them by first name." },
  { term: "HEOR", tag: "acronym", def: "Health Economics and Outcomes Research. Builds the value and cost-effectiveness case for a drug for payers. Field HEOR carries that story to formulary decision makers, a separate track from the MSL." },

  /* ---------- trials ---------- */
  { term: "Phase I", tag: "trials", def: "First in human. Safety, tolerability, and dose finding. Healthy volunteers in most areas, patients in oncology because the drugs are too toxic for volunteers." },
  { term: "Phase II", tag: "trials", def: "Proof of concept and dose selection. Does the drug do anything in patients who have the disease? Most programs die here, which makes Phase II experience valuable and Phase II failures common on good CVs." },
  { term: "Phase III", tag: "trials", def: "The registration trial. Large, controlled, powered to prove the effect regulators will approve on. Failure at this stage is financially catastrophic and often ends companies." },
  { term: "Phase IV", tag: "trials", def: "Studies run after approval in the marketed setting, some genuinely scientific and some commercially motivated. Separate from these are post-marketing requirements, which FDA imposes as a condition of approval, and post-marketing commitments, which the sponsor volunteers and is not compelled to run." },
  { term: "Protocol", tag: "trials", def: "The document that defines the trial: objectives, endpoints, population, treatment, assessments, and statistics. The Medical Director usually owns it." },
  { term: "Protocol amendment", tag: "trials", def: "A formal change to the protocol after it is final. Expensive and slow, because sites must be retrained and ethics committees re-approve. Amendments also come from agency requests, new safety information, a moving standard of care, and events nobody controls, so a high count is worth diagnosing rather than condemning: read what each amendment actually changed." },
  { term: "Primary endpoint", tag: "trials", def: "The single prespecified measure the trial is designed and powered to prove. Everything else is supporting evidence." },
  { term: "Secondary endpoint", tag: "trials", def: "Prespecified additional measures. A hit on a secondary after a missed primary is a lead, not an approval." },
  { term: "Surrogate endpoint", tag: "trials", def: "A measure that stands in for clinical benefit and reads out sooner, such as tumor shrinkage instead of survival. Regulators accept some surrogates in some settings, often with a confirmatory trial required." },
  { term: "Randomization", tag: "trials", def: "Assigning patients to arms by chance so the groups are comparable and the comparison means something." },
  { term: "Stratification", tag: "trials", def: "Randomizing within defined subgroups so that important prognostic factors end up balanced across arms." },
  { term: "Double blind", tag: "trials", def: "Neither the patient nor the treating team knows the assignment. Unblinding before the planned time is a serious event with real consequences for the trial." },
  { term: "Open label", tag: "trials", def: "Everyone knows what the patient is receiving. Common in early phase and in some oncology settings." },
  { term: "Placebo control", tag: "trials", def: "A comparison arm receiving inactive treatment. Ethically constrained when an effective therapy exists, which is why active comparator or standard of care arms are common." },
  { term: "Active comparator", tag: "trials", def: "A control arm receiving an existing effective therapy rather than placebo." },
  { term: "Inclusion and exclusion criteria", tag: "trials", def: "The rules defining who may enroll. Tight criteria produce a clean population and a trial that cannot recruit; loose criteria recruit fast and can dilute the effect." },
  { term: "Screen failure", tag: "trials", def: "A patient who consents but does not meet criteria. High screen failure rates predict enrollment trouble." },
  { term: "First patient in", tag: "trials", def: "The date the first participant is dosed. One of the milestones a program is judged on." },
  { term: "Database lock", tag: "trials", def: "The point where trial data has been cleaned and is then frozen and no longer editable, immediately before unblinding and analysis. Cleaning happens first; at lock the data are already clean." },
  { term: "Interim analysis", tag: "trials", def: "A prespecified look at accumulating data, usually by an independent committee, that can stop a trial early for efficacy, futility, or safety." },
  { term: "Adaptive design", tag: "trials", def: "A trial with prespecified rules allowing modification, such as dropping a dose arm, based on accumulating data." },
  { term: "Basket trial", tag: "trials", def: "One targeted therapy tested across multiple tumor types that share a molecular target." },
  { term: "Umbrella trial", tag: "trials", def: "Multiple therapies tested within one tumor type, with patients assigned by biomarker." },
  { term: "ORR", tag: "trials", def: "Objective response rate, also called overall response rate. The share of patients with a complete or partial response: the tumor is gone, or it shrank past a defined threshold. Reads out early, which is why it supports accelerated approvals." },
  { term: "PFS", tag: "trials", def: "Progression free survival. Time from randomization until the disease worsens or the patient dies. Faster than overall survival and heavily used in oncology." },
  { term: "OS", tag: "trials", def: "Overall survival. Time from randomization until death from any cause. The endpoint regulators trust most and the slowest to read out." },
  { term: "RECIST", tag: "trials", def: "The standardized criteria for measuring tumor response on imaging in solid tumor trials." },

  /* ---------- roles ---------- */
  { term: "Medical Director", tag: "roles", def: "The workhorse physician rung and the most common search on this desk. Owns the protocol and the medical data for one or more studies, manages investigators and the CRO, and supports submissions." },
  { term: "Senior Medical Director", tag: "roles", def: "Broader scope and more autonomy, often mentoring and cross-functional leadership. Sometimes genuine expansion, sometimes just tenure. Probe for scope evidence." },
  { term: "Executive Medical Director", tag: "roles", def: "Program or franchise level responsibility, real strategy input, usually people leadership." },
  { term: "VP Clinical Development", tag: "roles", def: "Owns a therapeutic area or portfolio, including budget, headcount, the FDA relationship, and the go or no-go recommendation." },
  { term: "Therapeutic Area Head", tag: "roles", def: "The disease-area authority. Sets which patients, which endpoints, which competitors and biomarkers matter." },
  { term: "Medical Monitor", tag: "roles", def: "The physician responsible for medical oversight of an ongoing trial: eligibility questions, adverse event review, causality assessment, dose decisions, and the investigator hotline. Sponsor-side and CRO-provided monitors are different jobs on a CV." },
  { term: "Drug Safety Physician", tag: "roles", def: "Sits in pharmacovigilance and works across a product's lifecycle rather than one study: signal detection, benefit-risk assessment, aggregate reports, label changes." },
  { term: "Clinical Scientist", tag: "roles", def: "A non-physician scientific role closest in daily work to a Medical Director. Constantly miscategorized by recruiters who do not know the difference." },
  { term: "Clinical Trial Manager", tag: "roles", def: "Operations owner for a study: timelines, sites, vendors, and enrollment against plan." },
  { term: "Biostatistician", tag: "roles", def: "Owns the statistical analysis plan and the answer to whether the drug actually worked. A physician cannot interpret a readout alone, which is why this partnership matters." },

  /* ---------- desk ---------- */
  { term: "Retained search", tag: "desk", def: "The client pays for the search itself, commonly in thirds, and works with one firm exclusively. The norm for senior, confidential, or genuinely scarce physician searches." },
  { term: "Engaged search", tag: "desk", def: "Also called a container. A smaller upfront deposit is credited against the final fee and buys exclusivity and priority." },
  { term: "Contingency search", tag: "desk", def: "The firm is paid only if the client hires its candidate, usually alongside competing firms. Fine for plentiful roles, wrong for scarce ones." },
  { term: "Intake call", tag: "desk", def: "The conversation where the search is defined and, in practice, won or lost. A vague intake costs weeks." },
  { term: "Submittal", tag: "desk", def: "Formally presenting a candidate to the client: the CV plus your written assessment." },
  { term: "Placement", tag: "desk", def: "Accepted offer, candidate starts, invoice goes out." },
  { term: "Fall-off", tag: "desk", def: "A placement that comes apart before or shortly after the start date. Usually traceable to an unrehearsed resignation or an unaddressed counteroffer." },
  { term: "Guarantee period", tag: "desk", def: "The window attached to the fee, commonly around 90 days on senior roles. Most agreements owe a replacement search rather than a cash refund. Read the agreement." },
  { term: "MPC", tag: "desk", def: "Most placeable candidate. A standout you market proactively to companies that never asked. Business development dressed as a candidate presentation." },
  { term: "Split", tag: "desk", def: "One consultant owns the client, another owns the candidate, and the fee divides." },
  { term: "Counteroffer", tag: "desk", def: "The retention package the current employer produces after a resignation. Defense starts at the first screen, never at offer stage." },
  { term: "Market map", tag: "desk", def: "The systematic picture of who sits where in a therapeutic area. The asset that survives a dead search and compounds across years." },
  { term: "PhRMA Code", tag: "desk", def: "The industry's voluntary rules on interactions between drug companies and healthcare professionals: what can be paid for, hosted, or given. The reason MSL and sales activities are walled apart, and vocabulary a med-affairs candidate expects you to recognize." },
  { term: "Sunshine Act", tag: "desk", def: "Federal law requiring companies to report payments and transfers of value to physicians, published in the Open Payments database. Why every dinner, honorarium, and consulting fee is tracked, and why candidates care how a company runs compliance." },
  { term: "Contract MSL", tag: "desk", def: "An MSL employed through a staffing partner rather than the sponsor, deployed for launches, gaps, or coverage. KBIC runs this business through Inside MSL, so know the model cold: it is both a placement product and a source of candidates." },
  { term: "Medical information", tag: "roles", def: "The medical affairs function that answers unsolicited clinical questions about a product with approved, referenced responses. Desk-based, heavily process-driven, distinct from the field MSL role." },
  { term: "Publication planning", tag: "roles", def: "The medical affairs function that sequences a product's papers, abstracts, and congress presentations. Where physicians who love writing land, and a common adjacent background on med-affairs CVs." }
);

SCENARIOS.push({
  id: "sc01",
  moduleId: "m10",
  title: "The intake call where the spec fights itself",
  setup: "<p>Jim forwards you a fresh intake: Averline Bio, a clinical-stage oncology company of roughly seventy people with a lead asset in Phase II for metastatic colorectal cancer. On the call are Dana Whitmore, head of talent, and Dr. Gerald Fisk, the Chief Medical Officer. They want a Medical Director, and Dana reads you the spec:</p>" +
    "<ul><li>MD with board certification in oncology</li>" +
    "<li>Fifteen or more years of industry experience in clinical development</li>" +
    "<li>Must have owned a BLA submission through approval</li>" +
    "<li>Will serve as medical monitor for the Phase II study and design the Phase III protocol</li>" +
    "<li>Base salary at a Medical Director band, roughly the high two hundreds</li>" +
    "<li>Onsite five days a week at headquarters in South San Francisco</li></ul>" +
    "<p>Dr. Fisk adds that they were burned by a bad medical hire last year, and this time they want someone who has, in his words, seen the whole movie. Dana wants your commitment before the call ends that you can deliver a slate inside a month.</p>",
  prompt: "Name the contradictions in this spec, one sentence each. Then script the questions you would ask on this call to resolve them, in the order you would ask them, with one sentence each on why that question. End with the exact sentence you give Dana about the one month slate.",
  model: "Here is what I heard fighting itself. Fifteen years and a BLA owned through approval is not a Medical Director profile, it is a Senior or Executive Medical Director on any org chart in this industry, so the title and band cap this seat roughly two levels below the record they are demanding. The band repeats the problem in dollars: a boarded oncologist who has genuinely carried a biologic through approval typically earns well north of the high two hundreds, which means anyone who fits this spec at this number should worry me, not excite me. Five days onsite in South San Francisco stacks a third filter on top, because the pool collapses to physicians already in the Bay Area; nobody relocates for a step down in title and band. And the actual work, medical monitoring a Phase II and designing the Phase III, needs end-of-Phase-II experience, not an approval trophy, so the BLA line looks like scar tissue from the bad hire rather than a requirement of the seat. My questions, in order. One: what will this person spend their first eighteen months actually doing, because if the honest answer is the Phase II and the pivotal design, then the BLA line is insurance and I want to trade it for hands-on end-of-Phase-II meeting and pivotal design experience. Two: tell me about the hire that burned you, specifically what that person could not do, because this spec reads like a bandage over that wound and I want to treat the injury, not over-buy against the memory of it. Three: which line bends first, the fifteen years and the BLA, or the title and the band, because the market will not sell you both and I would rather Dr. Fisk choose now than after six weeks of polite refusals. Four: is five days onsite a conviction or a policy, and what happens when the perfect candidate lives in Boston and asks for a hybrid arrangement. Five: if the record stays, will you post this as Senior Medical Director at the matching band, because that single change makes the search fillable. And my sentence to Dana: I will commit to a dated calibration slate the moment the spec stops fighting itself, and not before, because a fast slate against this version would be a paper exercise all three of us pay for.",
  rubric: [

e already burned. If those answers hang together, this is a fillable search after a spec rewrite; if they do not, I decline it now rather than own a stale, confused search three months from now.",

SCENARIOS.push({

    "<p>The pipeline shows two candidates in process. Dr. Susan Carver interviewed with the client CMO four weeks ago; no debrief was ever logged, and nobody has told her anything since. Her last email in the thread reads, in full: any word. Dr. David Lin completed a screen, was told he would be submitted, and never was; his entire candidate note reads: strong, submit. Behind them sits a market map of roughly forty names whose newest status is over a month old.</p>" +

  model: "Day one, morning: I read everything before I touch anyone, walking the email threads against the pipeline, logging what actually happened as dated activities, and pulling the search agreement to see exactly what Corvel was promised and when. Day one, afternoon: I call Martin Hale, client before candidates, because I cannot repair Dr. Carver or Dr. Lin with nothing true to tell them; every fact I owe them lives on the client side of this mess. Day two: candidate repair, Carver first because her wound is four weeks old: she gets a real person on the phone, the honest reason for the silence, and a date by which she will have her debrief; Lin gets a straight answer about whether the submittal is happening, and if the answer is yes it goes out the same day. Day three: I triage the forty-name map into active, dead, and unknown, so by Friday I know what this search actually has in the tank rather than what the system pretends it has. Days four and five: the re-qualification meeting with Martin, then a written status with a date on every next step, and a fixed weekly update slot from here forward. Now the opening, when Martin picks up. Martin, this is Haley Patel at Kaye/Bassman, and I have taken over your search as of Monday. Before anything else, you are owed a straight status, so here it is: Dr. Carver interviewed four weeks ago and has never had a debrief, Dr. Lin was promised a submittal that never went out, and you have not had a written update in five weeks. That is on our firm, not on you, and I am not going to spend this call apologizing; I am going to spend it fixing it. I need thirty minutes with you this week to re-qualify the search, and I need you to tell me honestly whether anything moved on your side during the silence: the program, the funding, an internal candidate, anything. From here you will have a written status every Thursday, and if one is ever missing, you call Jim and he will find me.",

SCENARIOS.push({
  id: "sc04",
  moduleId: "m05",
  title: "The full screen: a Senior Medical Director whose program just died",
  setup: "<p>Your live search: Medical Director at a clinical-stage oncology biotech, Phase II lead asset in gastric cancer, base commonly cited in the mid three hundreds, which sits above the usual Medical Director band because a hot oncology biotech is paying up for a physician who can also own the Phase III plan, plus meaningful early equity, medical monitor duties on the lead study plus ownership of Phase III planning, hybrid with roughly one week a month onsite.</p>" +
    "<p>Tonight you screen Dr. Paul Whitfield, Senior Medical Director at Meridex Therapeutics, a mid-cap of roughly eight hundred people. Six years there, promoted twice. Two weeks ago Meridex deprioritized his lead program, a Phase II antibody-drug conjugate, in a portfolio review. He answered your outreach within a day, which tells you the window is open and also that the wound is fresh. On paper your seat is a step down in title, roughly lateral on cash, and up on scope and equity.</p>" +
    "<p>Your risk is specific: physicians whose programs get cut are exactly the people mid-caps re-slot onto another asset a month later, with a retention bump attached. If his motivation is two weeks of anger, the fall-off is already scheduled.</p>",
  prompt: "Write the screen: your questions in the order you would ask them, with one line under each on what you are listening for. Then name the two tests you run to find out whether the deprioritization is a reason or an excuse, and write your closing commitment question word for word.",
  model: "I open honestly: who I am, that this is a Medical Director seat at a Phase II oncology company where the physician owns the study and the Phase III plan, and that my job tonight is to find out whether this is worth his time, not to sell him. Then the story, walked at the molecule level: which studies at Meridex were his as medical monitor, what he personally decided on dose escalations and safety calls versus what a committee decided, whether he sat in the end-of-Phase-II meeting or read the minutes afterward; I am listening for the word I versus the word we, and for whether the details arrive fast and specific or slow and rounded. Next, the two weeks: tell me exactly what the portfolio review changed for you, day to day; I am listening for whether the loss is concrete, my study is gone and my calendar is now governance meetings, or abstract and mostly pride. Then the motivator question, and I write the answer down verbatim because it is my counteroffer defense in eight weeks: before the review, were you looking, and what was already wrong at Meridex six months ago that is still wrong today. Then logistics with nothing skipped: current base, bonus, unvested equity and what he walks away from, notice period, the title step-down named out loud so I can watch how he takes it, location and whether one week a month onsite is real for his family, and any other processes in flight. Now the two tests. Test one is the re-slot test: if Meridex called next month and moved you onto their Phase III immunology asset, same title, same pay, would you stay; if he hesitates or says probably, the motivation is the program, not the place, and Meridex can cure that faster than I can. Test two is the behavior test: what have you actually done in the two weeks since the review, updated the CV, told your manager you want a program or an exit, taken other calls; movement is evidence, and a physician who has done nothing but feel bad is not a candidate yet, he is a bruise. And my close, word for word: Paul, if this process ends in an offer at roughly your current cash with real equity, a Medical Director title, and the Phase III in your hands, is there any version of Meridex keeping you, and if the answer is yes, tell me tonight, because I would rather hear it now than the week after you resign.",
  rubric: [
    "Opens with the seat in one honest sentence and no selling",

    "Separates the two-week wound from what was already wrong months ago",
    "Runs the re-slot test: same title and pay on a different program, do you stay",

  title: "CV decode: the oncology Medical Director with a BLA on the resume",
  setup: "<p>Your search is a Medical Director, Clinical Development at a Phase II oncology biotech: the seat owns medical monitoring on the lead study and the end-of-Phase-II preparation. A colleague forwards this CV with a note that reads: looks great, has BLA experience. You read it properly before anyone repeats that sentence to the client.</p>" +

    "<li>2019 to 2024: Medical Director, mid-size oncology company; medical lead and medical monitor for two Phase II studies in non small cell lung cancer, including a first-in-human dose expansion; core team member on the BLA for the lead asset; participated in the end-of-Phase-II meeting with FDA</li>" +
    "<li>2024 to present: Senior Medical Director, thirty-person biotech; medical monitor for a Phase I/II basket study; one of two physicians in the company</li>" +

  model: "What she has genuinely owned is Phase II: medical lead and medical monitor on two lung cancer studies is ownership language, the first-in-human dose expansion adds real early-phase depth, and the current basket study extends the same pattern. One line inside that bullet is mislabeled and I will not repeat it to a client: a first-in-human dose expansion is Phase I or Phase Ib work, not Phase II, so an early-phase study is sitting inside a Phase II claim, and I want to know which of the two lung studies she actually means before anyone counts it twice. Phase III she has touched but not owned: supported as associate medical monitor means someone senior made the calls and she executed, and the CV says so plainly if you read the verbs. The BLA line is the one my colleague misread: core team member and contributed clinical sections establish that she has lived inside a submission and knows what one costs, and they establish nothing about ownership; participated in the end-of-Phase-II meeting is the same verb problem, because participated is not presented and it is certainly not led. That distinction decides how I submit her, because if I write BLA experience in the submittal and the client CMO probes it in the first interview, her credibility and mine burn together. Honest seniority: she is a strong, real Medical Director, and the current Senior Medical Director title is what a thirty-person company pays in title when it cannot pay in structure; I would present her as exactly what this seat needs, a Phase II owner with genuine submission exposure, and never as an approval veteran. Therapeutic depth is real and wide for her years: fellowship-trained, lymphoma in academia, lung cancer in industry, now a basket study, so she has credibility in both heme and solid tumors. My three questions. One, aimed at the Phase III line: walk me through a safety call you escalated as associate medical monitor, who made the final decision, and what you were trusted to decide alone, because that tells me the true ceiling of her late-phase experience. Two, aimed at the BLA line: which sections did you own, what would the regulatory lead say your contribution was, and who presented at the FDA meeting, because I want her account of those verbs before a client asks for it. Three, aimed at the current role: what does Senior Medical Director mean with two physicians in the building, what do you own now that you did not own in 2023, and why is this chapter ending after roughly two years, because a short tenure is a question I ask, not a verdict I assume.",

    "<li>Certificates in pharmacovigilance; no publications; no FDA meeting attendance anywhere on the document</li></ul>",
  prompt: "Write your read: what this career actually is, the three CV lines that prove it, the exact trap a careless recruiter falls into here, which seats on your desk this physician genuinely fits and which he does not, and the two or three sentences you would say, word for word, to a client who asks whether this is a clinical development candidate.",
  model: "This is a safety and medical monitoring career wearing clinical development vocabulary, and it is a good one, which is exactly why it is dangerous to mis-sell. Three lines prove it. First, the decade splits as five years of pure pharmacovigilance and then five years of CRO medical monitoring, so both the foundation and the arc are safety, and nothing on the page shows protocol strategy, endpoint design, or program ownership. Second, oversaw Phase II and Phase III studies means service coverage, because six to nine concurrent trials across three therapeutic areas is eligibility calls and SAE review at scale, and no human being does development strategy for nine programs at once; the number is the confession. Third, led clinical development activities at the current company is contradicted by its own sub-bullets, which are all safety governance, and the tell is sits on the protocol team, because physicians who own protocols do not describe themselves as sitting on the team. The trap for a careless recruiter is title arithmetic: Medical Monitor plus the words clinical development plus Phase III equals a Medical Director submittal, and that submittal dies in the first interview the moment the client CMO asks which endpoints he has ever chosen and why. Add the depth markers that are missing: no fellowship, no single therapeutic area held longer than a service assignment, no FDA meeting, no publications, and an oncology development seat wants at least some of those. What he genuinely fits on my desk: a sponsor-side Medical Monitor seat, where CRO-trained breadth is a strength, a Drug Safety Physician seat, or head of safety at a small biotech, which he already is; what he does not fit is the Medical Director seat that owns strategy and endpoints, because he has never done that job for a single day, and his own duty lines say so. And to the client, word for word: Dr. Reyes is not a clinical development candidate, and I will not dress him up as one; he is a genuinely strong safety and medical monitoring physician, and if you open the Medical Monitor seat we discussed last quarter, I would submit him there today with full confidence.",

SCENARIOS.push({

  moduleId: "m10",
  title: "The counteroffer: eighty thousand dollars and the title they never gave her",
  setup: "<p>Two months ago you ran a clean process and Dr. Rachel Duarte accepted your client's Medical Director offer: Ostara Bio, Phase II immunology, a seat where she owns the protocol and the medical monitoring. She resigned from her mid-size pharma employer on Tuesday. It is Thursday evening and she calls your cell.</p>" +
    "<p>Her employer came back this afternoon: eighty thousand dollars more in base, promotion to Senior Medical Director effective immediately, and a seat on a new program. She says she did not expect it, that her head is spinning, and that she feels she owes them real consideration after seven years.</p>" +
    "<p>What you have that most recruiters would not: your first screen notes, logged verbatim in February. Three lines in her own words. I have not owned a protocol in two years. I present other people's data at governance and go home. I was told the Senior title was coming in two straight reviews, and it went to someone else both times.</p>" +
    "<p>Her start date at Ostara is four weeks out. The client CMO, Dr. Marion Wells, checks in with you weekly.</p>",
  prompt: "Write the call, in your voice, as the words you would actually say to Rachel: how you open, what you ask first, how you use the February notes, how you handle the promotion specifically, the commitment question you ask, and the concrete next step you set before hanging up.",
  model: "Rachel, first: nothing is wrong, and nothing about this call surprises me, so take a breath and let us walk through it slowly. Start by telling me exactly what happened: who made the offer, what precisely is in it, and what they said when they put it in front of you, because the words they chose matter as much as the number. Now I want to read you three sentences, and they are yours, from our first call in February, before Ostara existed for you: I have not owned a protocol in two years; I present other people's data at governance and go home; I was told the Senior title was coming in two straight reviews and watched it go to someone else both times. The offer on your desk tonight is that same title, released two days after your resignation letter, and I want you to sit with what that timing admits: the title was available the whole time, and it took you leaving to shake it loose. The eighty thousand is real money and I will not pretend otherwise, but tell me which of your three February sentences it changes, because on Monday you would carry a bigger paycheck back to the same desk, the same governance slides, and the same people who passed you over twice. And there is a cost nobody in that room this afternoon mentioned: from today you are the person who resigned, and companies commonly remember who resigned when the next review, the next reorganization, or the next program cut comes around. I am not going to tell you what to decide, because a placement I talked you into is just a fall-off with a delay on it, and I would genuinely rather you turn Ostara down tomorrow than quit it in month three. But I will ask you the same commitment question I asked before we ever submitted you, and I want tonight's answer: the protocol ownership you told me you wanted is sitting at Ostara in four weeks, so what, specifically, does staying fix? Here is the next step: I am going to ask Dr. Wells to call you tomorrow, not to pressure you, but so the person who chose you can walk you through the program you would own, because you deserve to weigh a real future against a reactive raise. And I want your final answer by Friday evening, to them and to me, one way and once, because a half-decision is the only outcome here that hurts everyone.",

SCENARIOS.push({
  id: "sc08",
  moduleId: "m10",
  title: "Month four, zero placements: the brief you bring to Jim",
  setup: "<p>It is the Friday before your month-four one-on-one with Jim, and the placement column on your desk reads zero. You pull your own numbers first, before anyone else does. At this firm, senior physician searches commonly run roughly four to six months from kickoff to a signed offer.</p>" +
    "<p>Sixteen weeks of activity:</p>" +
    "<ul><li>Roughly 320 outreach touches: calls, emails, messages</li>" +
    "<li>63 first conversations with physicians</li>" +
    "<li>22 completed full screens</li>" +
    "<li>12 submittals across four open searches</li>" +
    "<li>3 first interviews, 1 second interview, 0 offers</li></ul>" +
    "<p>The four searches:</p>" +
    "<ul><li>Search A: engaged Medical Director search, Phase II oncology; 4 submittals, 3 interviews, 1 second interview scheduled for next week; debriefs on time, client responsive</li>" +
    "<li>Search B: VP Clinical Development, shopped to two other firms, no deposit; 5 submittals, zero feedback in six weeks</li>" +
    "<li>Search C: Medical Monitor; 2 submittals, both rejected on paper for thin oncology depth</li>" +
    "<li>Search D: Medical Director, accepted three weeks ago with the intake never finished; 1 submittal, no response; you still do not have the comp band or the interview process</li></ul>",
  prompt: "Write the brief you bring to Jim: the funnel stage by stage and the conversion that looks broken, the segmentation by search that shows where it is actually broken, three process changes for next week with days attached, and the one thing you are not going to panic about, with the arithmetic reason.",

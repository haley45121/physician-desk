MODULES.push({
  id: "m03",
  title: "Trial Design",
  tagline: "Endpoints, randomization, control arms, and the criteria that strangle enrollment",

  learn: {
    sections: [
      { heading: "The protocol, and who writes which part",
        point: "Everything in a trial derives from the protocol, and the Medical Director owns the medical content while a writer assembles the document, so find out which half your candidate wrote.",
        html: "<p>The <dfn>protocol</dfn> is the document that defines a trial: the question, the population, the treatment, the measurements, and the arithmetic that decides whether the drug worked. Everything else is derived from it. The budget, the case report forms, the site contracts, the label the company hopes to win, all of it traces back to a protocol somebody wrote and defended.</p>" +
        "<p>The standard anatomy, roughly in order:</p>" +
        "<ul><li><dfn>Synopsis</dfn>: two to four pages summarizing the whole study. Ask a candidate to walk you through hers, because anyone who owned the trial can do it from memory.</li>" +
        "<li><dfn>Background and rationale</dfn>: why this drug, this disease, this dose. Built from preclinical work, earlier phases, and competitor data.</li>" +
        "<li><dfn>Objectives and endpoints</dfn>: what the study is trying to establish, and exactly what gets measured to establish it.</li>" +
        "<li><dfn>Study design</dfn>: phase, randomization, blinding, control arm, patient numbers, duration.</li>" +
        "<li><dfn>Population</dfn>: the inclusion and exclusion criteria.</li>" +
        "<li><dfn>Treatment plan</dfn>: dose, route, schedule, permitted concomitant medications, dose modification and discontinuation rules.</li>" +
        "<li><dfn>Schedule of assessments</dfn>: the grid of every visit and every procedure performed at it. Also called the schedule of activities.</li>" +
        "<li><dfn>Statistical considerations</dfn>: sample size, power, analysis populations, interim analyses, and how multiplicity is controlled.</li></ul>" +
        "<p>Authorship matters more than the table of contents. The <dfn>clinical lead</dfn>, usually a Medical Director, owns the medical content: rationale, objectives, endpoints, eligibility, dosing rules, safety language. The <dfn>biostatistician</dfn> owns sample size and the statistics section, and writes the separate <dfn>statistical analysis plan</dfn> (SAP) that has to be final before anyone is unblinded. Clinical operations pressure-tests the schedule of assessments for whether a real site can execute it. Regulatory checks it against agency feedback. Data management turns the schedule into case report forms. A medical writer assembles the document. That last fact is worth holding onto, because a candidate who says she wrote the protocol may mean she authored the science, or may mean she reviewed a draft.</p>" },

      { heading: "Endpoints: the hierarchy that decides everything",
        point: "One primary endpoint powers and judges the trial, and a key secondary only counts if it sat in the prespecified hierarchy behind a primary that hit.",
        html: "<p>An <dfn>endpoint</dfn> is the specific measurement that answers the study question. Get this vocabulary right and most of a clinical development conversation opens up.</p>" +
        "<ul><li><dfn>Primary endpoint</dfn>: the single measure the trial is powered on and judged by. It drives the sample size and it is what the sponsor committed to with regulators before the first patient was dosed. One trial, one primary, in nearly every case. If it misses, the trial failed.</li>" +
        "<li><dfn>Secondary endpoints</dfn>: prespecified measures that support and extend the primary. The important ones are <dfn>key secondaries</dfn>, tested in a fixed order inside the trial statistical error budget so they can support label claims.</li>" +
        "<li><dfn>Exploratory endpoints</dfn>: everything measured for learning rather than proof. No statistical protection, no label claims, useful for designing the next trial.</li></ul>" +
        "<p>The mechanism separating a key secondary from an exploratory one is <dfn>alpha</dfn>, the trial allowance for a false positive, conventionally five percent. Test enough things and you will find something by chance, so statisticians spend that allowance through a prespecified <dfn>testing hierarchy</dfn>: primary first, then key secondaries in a written order, and the moment one test fails the rest are no longer formally significant. This is why the sentence you will hear constantly, we missed the primary but hit a key secondary, is far weaker than it sounds. If the primary failed, the hierarchy stopped there and the secondary p value is <dfn>nominal</dfn> only. Regulators approve on that almost never.</p>" +
        "<p>Endpoints are indication-specific, and a physician endpoint experience is a searchable credential. Oncology runs on <dfn>overall survival</dfn> (OS), <dfn>progression-free survival</dfn> (PFS), and <dfn>overall response rate</dfn> (ORR). Cardiovascular runs on composite event rates. Immunology and dermatology use response scores such as ACR20 or PASI 75. Neurology uses functional rating scales. A Medical Director who has run an OS-powered registration trial in lung cancer is a different candidate from one who has only run single-arm ORR studies, and clients pay differently for the two. Ask every physician three things: what was the primary endpoint, did it hit, and did you choose it or inherit it.</p>" },

      { heading: "Surrogates, composites, and patient-reported outcomes",
        point: "Every shortcut endpoint hides a question: what links the surrogate to real benefit, which component of the composite moved, and was the patient instrument validated.",
        html: "<p>A <dfn>surrogate endpoint</dfn> is a measurement that stands in for how a patient feels, functions, or survives rather than measuring it directly. Trials use them because waiting for deaths or strokes takes years and thousands of patients, while blood pressure or viral load reads out in months.</p>" +
        "<p>Regulators accept a surrogate when there is strong evidence that moving it moves the outcome that actually matters. LDL cholesterol, blood pressure, HbA1c, and HIV viral load are accepted because decades of outcome trials established the link. Others are accepted only as reasonably likely to predict benefit, which is the basis of <dfn>accelerated approval</dfn>: the drug reaches the market on a surrogate, usually tumor response rate, and the company owes a confirmatory trial proving real clinical benefit. If that trial fails or never finishes, the approval can be withdrawn, which has happened repeatedly in oncology.</p>" +
        "<p>The standing warning is the CAST trial, where antiarrhythmic drugs suppressed the surrogate, abnormal heartbeats after a heart attack, and increased deaths. A surrogate can move the right way while patients do worse. When a candidate leans on a surrogate result, the intelligent question is what evidence links that marker to outcome, not whether the p value was small.</p>" +
        "<p>A <dfn>composite endpoint</dfn> bundles several events into one count, most famously <dfn>MACE</dfn>: cardiovascular death, heart attack, and stroke, with the four-point version adding hospitalization for unstable angina. Bundling raises the event rate, which cuts sample size and time. The catch is that the softest and most frequent component usually drives the result, so a four-point MACE win carried by unstable angina hospitalizations rather than by deaths is weaker than the headline implies. Ask which component moved.</p>" +
        "<p><dfn>Patient-reported outcomes</dfn> (PROs) are data reported by the patient with no clinician filtering: symptom severity, physical function, quality of life. For a PRO to support a label claim it has to be a validated instrument with demonstrated content validity in that population, collected on a fixed schedule, and placed inside the testing hierarchy. Payers care about them more every year, so PRO and quality-of-life experience on a physician CV is worth flagging to any client trying to differentiate against an entrenched competitor.</p>" },

      { heading: "Randomization, stratification, and blinding",
        point: "Randomization, stratification, and blinding exist to keep bias out, and the sponsor team stays blinded until database lock because early unblinding is a data integrity event.",
        html: "<p><dfn>Randomization</dfn> assigns patients to arms by chance so the arms differ only in what they receive. It removes an investigator ability to steer healthier patients toward the drug, and it balances confounders nobody thought to measure. Without it you have an observational study with a trial budget.</p>" +
        "<ul><li><dfn>Block randomization</dfn>: assignments are made in small blocks, say six patients with three to each arm, so the arms stay balanced as enrollment proceeds instead of drifting apart. Block sizes are varied and hidden from the site so nobody can guess the next assignment.</li>" +
        "<li><dfn>Stratified randomization</dfn>: separate randomization lists run within levels of a few strong prognostic factors such as disease stage, prior lines of therapy, region, or biomarker status. This forces balance on the variables most likely to explain away a result, and those factors usually become the prespecified subgroup analyses. Keep the list short: too many <dfn>strata</dfn> creates cells holding two patients and defeats the purpose.</li>" +
        "<li><dfn>Adaptive randomization</dfn>: prespecified rules shift the allocation ratio as data accumulate, sending more patients toward the better performing arm. Ethically attractive, used in platform trials, and complicated enough statistically that many sponsors avoid it.</li></ul>" +
        "<p>Allocation is executed centrally through an <dfn>IRT</dfn>, the interactive response technology that also manages drug supply at each site. A 1 to 1 ratio is standard. A 2 to 1 ratio favoring active treatment makes the trial more attractive to patients and gathers more safety exposure, at a cost in statistical efficiency.</p>" +
        "<p><dfn>Blinding</dfn> keeps knowledge of assignment away from anyone who could bias the result. <dfn>Open label</dfn> means everyone knows. <dfn>Single blind</dfn> usually means the patient does not know. <dfn>Double blind</dfn> means neither patient nor treating investigator knows, and it is the standard for anything subjective. When formulations differ, a <dfn>double dummy</dfn> design gives every patient both a tablet and an injection, one of which is inert.</p>" +
        "<p>Some people are unblinded on purpose: the site pharmacist who prepares doses, an unblinded monitor doing drug accountability, and the independent statistician who prepares reports for the data monitoring committee. The sponsor study team is not, until database lock. A site can break the blind for a medical emergency through the IRT, and that gets documented and reviewed. Sponsor-side unblinding before lock is a data integrity event regulators take seriously, which is also why open-label oncology trials add <dfn>blinded independent central review</dfn> of scans to keep the endpoint honest.</p>" },

      { heading: "Control arms, placebo ethics, and who gets in",
        point: "Control arm choice is strategy and ethics at once, and every eligibility criterion you add cleans the data while deleting real patients from every site list.",
        html: "<p>The <dfn>control arm</dfn> is what the drug gets compared against, and choosing it is a strategy decision, not a technicality.</p>" +
        "<ul><li><dfn>Placebo</dfn>: an inert treatment identical in appearance. The cleanest comparison, defensible only when withholding treatment does not harm the patient.</li>" +
        "<li><dfn>Active comparator</dfn>: an approved drug at its approved dose. Used when effective therapy exists. Run for <dfn>superiority</dfn>, or for <dfn>non-inferiority</dfn>, where the sponsor argues the new drug is not meaningfully worse and the fight with regulators is over the <dfn>margin</dfn> that defines meaningfully.</li>" +
        "<li><dfn>Standard of care</dfn>: whatever the treating physician would normally give, sometimes written as investigator choice from a defined list. Realistic and messy.</li>" +
        "<li><dfn>Historical or external control</dfn>: outcomes from prior trials or registry data instead of a concurrent arm. Used in rare disease and in single-arm oncology with high unmet need. Regulators stay skeptical because patient selection and supportive care drift over time.</li></ul>" +
        "<p>Placebo when effective therapy exists is the ethical flashpoint. The working answer in most therapeutic areas is the <dfn>add-on design</dfn>: every patient receives standard of care, then is randomized to drug or placebo on top of it. Nobody is denied treatment and the comparison stays clean. Pure placebo control is defensible when no proven therapy exists, or when the condition is mild and brief and the risk of delay is low. An ethics committee will refuse a design that withholds effective therapy in a serious disease, and it should.</p>" +
        "<p>The population is set by <dfn>inclusion criteria</dfn>, which say who qualifies, and <dfn>exclusion criteria</dfn>, which remove patients for safety or to keep the data interpretable. The medical lead drafts them, statistics argues for a homogeneous population, operations argues for a feasible one, and that argument is the whole game. Every criterion added makes the population cleaner and the drug effect easier to detect, and every criterion added also deletes real patients from every site list. The diagnostic number is the <dfn>screen failure rate</dfn>, and it only means something once you know the population. In an all-comers trial, thirty to fifty percent is ordinary, and a rate sustained well above that points at the eligibility criteria rather than the sites. In a biomarker-selected population the arithmetic inverts: screening a hundred patients to find the fifteen who carry the alteration is the design working as intended, and seventy to ninety percent screen failure is expected in enriched oncology trials. Ask what the enrichment strategy is before you read the number as a protocol problem. The other cost arrives later: a trial run in a narrow population earns a narrow indication, and the commercial team discovers that too late to fix it.</p>" },

      { heading: "Amendments, and the designs that break the mold",
        point: "Amendments are a free diagnostic on a program in trouble, and basket, umbrella, adaptive, and seamless are shorthand physicians will assume you already know.",
        html: "<p>A <dfn>protocol amendment</dfn> is a formal change to a finalized protocol. Substantial ones go back to every ethics committee, may force re-consent of patients already enrolled, and require retraining, updated case report forms, and IRT changes. Commonly cited industry benchmarks put a substantial Phase III amendment in the mid six figures and add weeks to months of delay, and most protocols pick up at least one.</p>" +
        "<p>Amendments are a free diagnostic. Amendments before the first patient is dosed mean the protocol was written without feasibility input. Amendments that loosen eligibility mean enrollment is failing. Amendments that add safety monitoring mean something showed up. Amendments that change the primary endpoint late are a flag regulators notice. A high count on one program tells you the program is in trouble, and trouble is what creates searches.</p>" +
        "<p>The design menu has widened well past the two-arm trial. Learn these cold, because physicians use them as shorthand and will assume you know them.</p>" +
        "<ul><li><dfn>Adaptive design</dfn>: prespecified rules in the protocol and SAP let the trial change based on accumulating data, for example re-estimating sample size, dropping a dose arm, stopping early for futility, or narrowing to the population that is responding. The point is that every adaptation is written down in advance. Changing a trial after looking at the data is not adaptive design, it is a problem.</li>" +
        "<li><dfn>Basket trial</dfn>: one targeted therapy tested across several tumor types that share a molecular alteration. This is how tissue-agnostic approvals happen, as with NTRK fusions.</li>" +
        "<li><dfn>Umbrella trial</dfn>: one disease, several drugs, patients assigned to a sub-study by their biomarker.</li>" +
        "<li><dfn>Seamless design</dfn>: two phases run under a single protocol with no gap, most often a dose-finding stage flowing into large expansion cohorts, or a Phase II stage continuing into Phase III at the selected dose.</li></ul>" +
        "<p>A <dfn>master protocol</dfn> or platform trial takes this further: standing infrastructure with a shared control arm where new drugs enter and leave over time. Physicians who have run one have handled independent statistical committees and interim decisions most of their peers never see, which makes them scarce and worth flagging to a client. When a client says they want adaptive experience, this is usually what they mean, and it is usually what they cannot find.</p>" }
    ],
    checklist: [
      "Ask every physician candidate what the primary endpoint was, whether it hit, and who chose it",
      "Name the sections of a protocol and say which ones a Medical Director owns personally",
      "Separate a prespecified key secondary from an exploratory endpoint when a candidate blurs the two",
      "Challenge a surrogate endpoint claim by asking what evidence links that marker to clinical benefit",
      "Diagnose an enrollment problem from screen failure rate and eligibility-loosening amendments",
      "Define basket, umbrella, adaptive, and seamless designs in one sentence each on a live call"
    ]
  },

    { id: "m03s01",
      prompt: "Say it as you would out loud. A Medical Director candidate says her Phase III missed its primary endpoint but hit a key secondary. Ask the three questions that matter, in your own words.",

MODULES.push({
  id: "m04",
  title: "Trial Execution",
  tagline: "CROs, sites, timelines, monitoring, safety oversight, and the failures that create searches",

  learn: {
    sections: [
      { heading: "Sponsor, CRO, and what actually gets outsourced",
        point: "The CRO runs execution while the sponsor keeps the decisions, so a CRO career gives you enormous breadth and almost no ownership.",
        html: "<p>The <dfn>sponsor</dfn> is the company that owns the drug and holds legal responsibility for the trial. Almost no sponsor runs a trial alone. The <dfn>CRO</dfn>, contract research organization, supplies the people and systems, and the shape of that relationship tells you most of what a candidate actually did.</p>" +
        "<ul><li><dfn>Full service outsourcing</dfn>: the CRO runs the study. Startup and regulatory submissions, site contracts, monitoring, data management, biostatistics, medical writing, sometimes safety case processing. The sponsor keeps a small team whose job is managing the CRO. Standard for a fifteen-person biotech with one asset.</li>" +
        "<li><dfn>FSP</dfn>, functional service provider: the sponsor rents a function or a set of badged staff, for example all of data management or ten monitors, and keeps its own processes, systems, and oversight. Standard at large pharma with permanent infrastructure and variable demand.</li>" +
        "<li>Hybrid: full service on some studies, FSP on others. Where most mid-size companies actually live.</li></ul>" +
        "<p>Behind the CRO sits a vendor stack: central labs, imaging core labs, IRT and electronic data capture providers, electronic outcome assessment vendors, drug depots and couriers, and patient recruitment firms. Names worth recognizing on a CV include IQVIA, ICON, Parexel, Fortrea, Thermo Fisher PPD, Syneos, and Medpace, the last of which appears constantly on small-biotech programs.</p>" +
        "<p>Physicians complain about CROs for consistent reasons: monitor turnover that forces the site to be retrained three times a year, junior staff learning on an expensive program, escalation routed through a project manager instead of reaching whoever can decide, a change order for every scope adjustment, and a CRO medical monitor covering four indications at once. The incentives genuinely differ. The CRO is paid for units of activity; the sponsor needs speed and a clean answer.</p>" +
        "<p>What a CRO-heavy background means on a CV: enormous breadth, real GCP and process discipline, and exposure to more protocols in three years than a sponsor-side physician sees in ten. What it usually lacks is ownership. A CRO medical monitor rarely chose an endpoint, rarely held program budget, and never made a go or no-go call. The move from CRO medical monitor to sponsor Medical Director is real, common, and one of the most reliable placements on this desk, because the comp step is genuine and the candidate is usually reachable.</p>" },

      { heading: "Sites, investigators, and the investigator meeting",
        point: "Sites live or die on the study coordinator, and a physician who was a real investigator brings site empathy plus a live network you can sell.",
        html: "<p>Trials happen at <dfn>sites</dfn>, and sites are where the plan meets reality.</p>" +
        "<ul><li><dfn>Principal investigator</dfn> (PI): the physician legally responsible for the study at one site. Signs the FDA Form 1572, holds the delegation log, and is accountable for consent, eligibility, dosing, and safety reporting.</li>" +
        "<li><dfn>Sub-investigator</dfn>: other physicians listed on the 1572 who may perform delegated study duties.</li>" +
        "<li><dfn>Study coordinator</dfn>: usually a nurse, and the person who actually runs the study day to day. When a Medical Director says a site is good, she generally means the coordinator is good.</li></ul>" +
        "<p>Startup runs in a fixed order: a <dfn>feasibility</dfn> questionnaire asking how many eligible patients the site sees, a qualification visit, contract and budget negotiation, ethics submission, then a <dfn>site initiation visit</dfn> after which the site is <dfn>activated</dfn> and may enroll. Contracts and ethics review are the usual delay.</p>" +
        "<p>Site types behave differently. <dfn>Academic medical centers</dfn> bring complex patients, opinion-leader investigators, and publication interest, alongside slow contracting, local ethics committees, competing trials chasing the same patients, and a PI carrying an enormous clinical and academic load. <dfn>Community sites</dfn> and dedicated research clinics start faster and enroll common diseases better, but may not support complex procedures. <dfn>Site networks</dfn> sell one contract, one central ethics review, and standardized staff across many locations, which sponsors buy for predictability rather than for depth.</p>" +
        "<p>The <dfn>investigator meeting</dfn> gathers PIs and coordinators for protocol training before enrollment opens. It is also where the sponsor discovers what the protocol got wrong, because forty investigators will say so out loud. A Medical Director who has stood in that room and defended her eligibility criteria has a skill worth probing: ask how the room reacted and you learn quickly whether she was on stage or in the audience.</p>" +
        "<p>One more angle for your desk. A physician who was a PI before moving into industry brings site empathy and a live investigator network, which sponsors value for feasibility and for opinion-leader relationships. Ask how many patients she personally enrolled. That answer separates a real investigator from a name on a 1572.</p>" },

      { heading: "The timeline, and what actually slips",
        point: "Activation, enrollment, and the stretch to database lock are where timelines slip, so ask every candidate for enrollment rate per site per month.",
        html: "<p>Learn the milestone sequence and you can place any program conversation on a timeline inside thirty seconds.</p>" +
        "<ul><li><dfn>Protocol final</dfn> and the statistical analysis plan agreed, with the IND in effect.</li>" +
        "<li>Health authority clearance and <dfn>IRB</dfn> or ethics committee approval. US commercial sites usually use a central IRB; academic centers often insist on their own.</li>" +
        "<li>Contracts executed, then <dfn>site activation</dfn>, one site at a time.</li>" +
        "<li><dfn>First patient in</dfn> (FPI), the milestone every board deck features.</li>" +
        "<li>The enrollment period, closing at <dfn>last patient in</dfn>.</li>" +
        "<li>Treatment and follow-up, closing at <dfn>last patient last visit</dfn> (LPLV).</li>" +
        "<li>Query resolution and <dfn>database lock</dfn>, then <dfn>unblinding</dfn> of the study team.</li>" +
        "<li>The prespecified analysis, then <dfn>topline results</dfn>, usually a few weeks after lock.</li>" +
        "<li>The <dfn>clinical study report</dfn> (CSR), the full formal document, typically months later, then filing and publication.</li></ul>" +
        "<p>Three places slip predictably. First, activation: contracts and ethics review push first patient in by months, and a common planning figure for a global Phase III is eight to twelve months from protocol final to FPI. Second, enrollment, always. Sites enroll a fraction of what they promised on the feasibility questionnaire, and a meaningful share of activated sites never enroll a single patient. Third, the stretch between last patient last visit and database lock, which is pure data cleaning, and where an under-resourced data management group turns six weeks into five months.</p>" +
        "<p>The numbers people actually quote are time to first patient in, enrollment rate per site per month, and screen failure rate. When a candidate describes a trial, ask for those three. A Medical Director who knows her enrollment rate per site per month has been in the operational meetings. One who does not has been reading summaries.</p>" +
        "<p>Public companies publish a distorted version of this timeline as guidance for topline data. When guidance moves from the first half to the second half of a year, something in the sequence broke, and it is usually enrollment.</p>" },

      { heading: "Monitoring, deviations, and the road to a clean database",
        point: "GCP is the floor everyone works under, not a credential; what matters is the deviations a candidate caught and what she decided about them.",
        html: "<p>All of this runs under <dfn>GCP</dfn>, good clinical practice, the international standard for how a trial is designed, run, recorded, and reported. It is where consent, investigator responsibility, safety reporting, and data integrity are written down, and it is the thing an inspector measures a site against. Two warnings. It is the floor, not a credential: everyone in the industry works under GCP, so a candidate who offers it as a strength has told you nothing until he says what he decided under it. And it is only the clinical member of a family: GLP governs preclinical laboratory work and GMP governs manufacturing, both of which are other people's practices. Know the words, do not claim the ground.</p>" +
        "<p>The <dfn>CRA</dfn>, clinical research associate or monitor, is the sponsor or CRO person at the site. She verifies that consent was obtained before any study procedure, that enrolled patients met eligibility, that drug was accounted for, that adverse events were reported, and that what sits in the database matches the medical record. That last activity is <dfn>source data verification</dfn>.</p>" +
        "<p>The industry used to verify one hundred percent of fields against the chart. It was the largest line in a monitoring budget and it caught very little. <dfn>Risk based monitoring</dfn> replaced it: centralized statistical review of data patterns across sites, targeted verification of the fields that matter (consent, eligibility, primary endpoint, serious adverse events), key risk indicators that trigger a visit, and fewer routine visits to sites behaving well. Anyone hired into clinical operations in the last decade should be able to talk about it fluently.</p>" +
        "<p>A <dfn>protocol deviation</dfn> is any departure from the protocol. Minor ones, such as a visit outside its window, get logged. <dfn>Important deviations</dfn>, such as enrolling an ineligible patient, dosing incorrectly, missing a primary endpoint assessment, or consenting after a procedure, get reported to ethics committees and listed in the clinical study report. A pattern escalates: a for-cause monitoring visit, then a sponsor quality audit, then in bad cases an FDA inspection of the site, findings on a Form 483, exclusion of that site data from the analysis, or termination of the site. Losing a high-enrolling site late can cost a trial its statistical power, which is the kind of event that ends careers and starts searches.</p>" +
        "<p>The data path: the <dfn>source document</dfn> is the medical record, the coordinator enters data into an <dfn>eCRF</dfn> inside an <dfn>EDC</dfn> system, automated edit checks and manual review generate <dfn>queries</dfn>, the site answers them, adverse events are coded to <dfn>MedDRA</dfn> and medications to WHODrug, and external data from central labs, imaging, and the safety database are reconciled against the EDC. When every query is closed, data management declares database lock. This is why data managers matter to a physician week: a Medical Director spends real hours reviewing safety listings and signing off on queries, and she cannot see a signal in a dirty database. Ask a candidate what the query burden looked like heading into lock and you will hear immediately whether she lived it.</p>" },

      { heading: "Safety oversight and the clock",
        point: "The DSMB sees unblinded data and the sponsor sees only a recommendation, so a candidate claiming she saw interim results is telling you something wrong.",
        html: "<p>Independent oversight exists because a sponsor cannot be trusted to judge its own drug, and everyone including the sponsor knows it.</p>" +
        "<p>The <dfn>DSMB</dfn>, data safety monitoring board, also called a data monitoring committee, is a small independent group of clinicians plus at least one statistician who review unblinded accumulating data at prespecified intervals. They work under a <dfn>charter</dfn> that fixes timing and stopping rules. An independent statistician, walled off from the study team, prepares the unblinded reports. Meetings have an open session with the sponsor present and a closed session without. The board can recommend continuing, continuing with modification, pausing enrollment, or stopping for safety, for <dfn>futility</dfn>, or occasionally for overwhelming efficacy against a prespecified boundary. The sponsor receives the recommendation and nothing else, which is the entire point, and which candidates sometimes forget when they claim they saw interim data.</p>" +
        "<p>An <dfn>adjudication committee</dfn>, often called a clinical events committee, is a separate blinded panel that decides whether a reported event meets the protocol definition of an endpoint. Was that death cardiovascular? Was that event a heart attack? Sites classify inconsistently, and adjudication makes the primary endpoint mean the same thing everywhere. Imaging endpoints get the same treatment through blinded independent central review.</p>" +
        "<p>Safety reporting runs on a clock. An investigator who learns of a <dfn>serious adverse event</dfn> (SAE) reports it to the sponsor, typically within twenty four hours under the protocol. The sponsor safety group assesses three things: is it serious, is it unexpected against the investigator brochure, and is it possibly related to the drug. If all three are yes it is a <dfn>SUSAR</dfn>, and it becomes an expedited <dfn>IND safety report</dfn> to FDA and to every participating investigator: seven calendar days for a fatal or life-threatening event, fifteen calendar days otherwise. Everything else aggregates into annual safety reports.</p>" +
        "<p>Where this hits your desk: the physicians who run this work carry titles like Drug Safety Physician, Safety Science Lead, and Head of Pharmacovigilance, and demand spikes the week something goes wrong. A company that just paused a trial is a company about to hire.</p>" },

      { heading: "What goes wrong, and the search it creates",
        point: "Every failure mode here is a hiring event, and sliding registry records and moved guidance dates show it weeks before anyone announces anything.",
        html: "<p>Every failure mode below is a hiring event if you see it early enough.</p>" +
        "<ul><li><dfn>Enrollment shortfall</dfn>: the most common failure in the industry. Rescue options, roughly in order of cost: add sites and countries, amend eligibility, raise the per-patient budget, bring in site networks and recruitment vendors, transfer the study to a new CRO, extend the timeline, or cut the sample size and accept less power. Hiring event: feasibility and clinical operations leadership first, then a new clinical lead once the protocol itself takes the blame.</li>" +
        "<li><dfn>Site closures and CRO transfer</dfn>: a <dfn>rescue study</dfn> moves an entire trial to a new vendor mid-flight and is brutal. It creates urgent demand for study directors, medical monitors, and contract clinical staff who have survived a transfer before. Interim and consultant placements come first, permanent roles follow.</li>" +
        "<li><dfn>Safety signal</dfn>: a DSMB pause or an FDA <dfn>clinical hold</dfn> stops dosing outright. Hiring event: drug safety physicians and pharmacovigilance leadership immediately, and if the response is mishandled, a new Chief Medical Officer inside a year.</li>" +
        "<li><dfn>A competitor reads out first</dfn>: a rival positive Phase III can make a program commercially pointless or force a redesign against a new standard of care. Hiring event: one program freezes while another surges, and the Medical Director whose program was just deprioritized is reachable for about six weeks before she runs her own process.</li>" +
        "<li><dfn>Funding runs out</dfn>: a clinical-stage company with two quarters of cash cuts sites, cuts headcount, or out-licenses the asset. Hiring event: an entire clinical team reaches the market at once. Map it before the announcement, because after the announcement every recruiter in the industry is calling them.</li>" +
        "<li><dfn>The trial simply fails</dfn>: missed primary, program dead, team gone. Candidates from failed trials are not damaged goods. A physician who can explain in three sentences why the trial failed and what she would have designed differently is more interesting than one who has only ridden winners.</li></ul>" +
        "<p>Nearly all of this is visible before anyone announces it. The public trial registry shows enrollment status, estimated completion dates that keep sliding, and sites quietly being added. Public companies disclose material events and revise data guidance. Conference abstracts tell you who read out and when. Reading those signals weekly is how you reach a VP Clinical Development in the week she starts thinking about leaving, rather than the month after she signed somewhere else.</p>" }
    ],
    checklist: [
      "Ask which parts of a trial the sponsor ran and which the CRO ran, then price the difference",
      "Place any program on the timeline from protocol final to clinical study report with one question",
      "Get three numbers from every candidate: time to first patient in, enrollment rate per site per month, screen failure rate",
      "Explain what a DSMB does and what the sponsor never sees, without overstating either",
      "Read a sliding registry record or a moved data guidance date as a hiring signal and call that week",
      "Translate a CRO medical monitor breadth into a sponsor-side Medical Director pitch a client will accept"
    ]
  },

\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"164\" y=\"102\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">VP Clinical Development</text><text x=\"164\" y=\"116\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">budget, headcount, the agency</text><line x1=\"164\" y1=\"80\" x2=\"164\" y2=\"88\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><rect x=\"14\" y=\"48\" width=\"300\" height=\"32\" rx=\"4\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\" stroke-width=\"1\"/><text x=\"164\" y=\"62\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Chief Medical Officer</text><text x=\"164\" y=\"76\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">board, portfolio, final risk</text><rect x=\"336\" y=\"88\" width=\"170\" height=\"34\" rx=\"4\" fill=\"#efe8da\" stroke=\"rgba(42,38,32,0.22)\" stroke-dasharray=\"3 3\"/><text x=\"421\" y=\"103\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">Therapeutic Area Head</text><text x=\"421\" y=\"115\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">a seat beside, not a rung above</text><line x1=\"314\" y1=\"105\" x2=\"336\" y2=\"105\" stroke=\"rgba(42,38,32,0.22)\" stroke-dasharray=\"3 3\"/><text x=\"14\" y=\"250\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8a8172\">Read up. Title inflation is real, so level a candidate on scope and autonomy, not the words.</text></svg><figcaption>The rungs, and the seat that sits beside them</figcaption>",
        html: "<p><dfn>Medical Director</dfn> is the most common search on a physician desk and the rung the rest of the ladder is measured against. This is a physician, almost always an MD, hired to own one or more studies or an early program. Own is specific: they write the <dfn>protocol</dfn> and defend every eligibility criterion in it, review the accumulating medical data (lab listings, adverse event tables, coding queries), serve as <dfn>medical monitor</dfn> for the study or supervise the one the CRO provides, hold the investigator relationships that keep sites engaged and enrolling, ride the CRO on quality and timelines, draft the clinical sections that feed FDA submissions, and support the publications that come out of the data. The calendar is standing CRO calls, data review meetings, site questions that will not wait, protocol amendments, and safety reviews.</p>" +
        "<p>FDA exposure is real but subordinate: a Medical Director writes and reviews submission sections and may sit in the room at an agency meeting, but rarely speaks and never owns the relationship. Span is one to three studies and typically zero to two direct reports, so the job runs on influence over people who do not report to them, above all at the CRO. Comp shape, and treat every figure in this module as approximate: base commonly cited at roughly 250,000 to 320,000 dollars at US sponsors, target bonus roughly 15 to 25 percent, and equity that means something at a biotech and is decorative at large pharma.</p>" +
        "<p>Promotion to Senior is earned three ways: running more than one study at a time, needing visibly less oversight to do it, and building enough cross-functional trust that regulatory and biostatistics stop double-checking the work. Years served alone earn nothing, though plenty of companies pretend otherwise, which is the next section.</p>" },

      { heading: "Senior and Executive: what genuinely changes",
        point: "Senior is often tenure dressed as scope, while Executive is a real shift to owning the development plan and the strategy calls inside it.",
        html: "<p><dfn>Senior Medical Director</dfn> done honestly means three things changed. Scope: several studies or an entire indication instead of one trial. Autonomy: their protocol goes to review and comes back without a rewrite, and management reads their data narratives instead of re-deriving them. Weight: they mentor junior Medical Directors and clinical scientists, and other functions treat their word as a decision, not an opinion. FDA exposure grows a notch: a Senior may present a section at an agency meeting rather than just prepare it.</p>" +
        "<p>Now the honest part: at many companies Senior Medical Director is a retention title, handed out at year four or five so a solid physician stops taking recruiter calls. Plenty of the Senior CVs you read are tenure dressed as scope. The test is simple: did the studies get bigger, more numerous, or more pivotal, or did they just get older? Ask what they run today that they could not have been trusted with three years ago. A real Senior answers in seconds.</p>" +
        "<p><dfn>Executive Medical Director</dfn> is a genuine level shift. The unit of work stops being the study and becomes the program or franchise: they own the <dfn>clinical development plan</dfn>, the multi-study roadmap that takes a molecule from Phase 2 through filing, and they make the strategy calls inside it: which indication goes first, what comparator, which endpoints the pivotal trial bets on. It is often the first rung with true people leadership, a small team of Medical Directors and clinical scientists, and Executives present and defend designs at FDA meetings rather than observing them. Comp shape: Senior base roughly 300,000 to 360,000 dollars, Executive roughly 340,000 to 420,000, bonuses drifting toward 25 or 30 percent, all approximate and all moved by company size and stage.</p>" },

      { heading: "VP Clinical Development and the Therapeutic Area Head",
        point: "The VP owns budget, headcount, the FDA relationship, and the go or no-go recommendation; the TA Head owns disease knowledge authority whatever title lands on the offer.",
        html: "<p><dfn>VP Clinical Development</dfn> owns a therapeutic area, or at a smaller company the whole clinical portfolio. Four possessions define the rung. The budget: they sign for the spend, and a pivotal program burns tens of millions a year. The headcount: they hire, promote, and remove the physicians and scientists under them, commonly five to thirty people. The FDA relationship: they set agency strategy and lead the meetings, especially the end of Phase 2 meeting where the pivotal design gets blessed or bloodied. And the <dfn>go/no-go</dfn> recommendation: when Phase 2 reads out, the VP stands up and recommends betting, or refusing to bet, the Phase 3 money. The calendar is governance committees, portfolio reviews, agency prep, hiring, and escalations; a VP still writing protocols is either heroic or badly under-resourced. Comp shape: base roughly 380,000 to 480,000 dollars, bonus roughly 30 to 40 percent, equity that finally matters, all approximate.</p>" +
        "<p>The <dfn>Therapeutic Area Head</dfn> is a different kind of authority, and the title floats: it can sit at VP, SVP, or above, and at large pharma a TA Head may outrank a plain VP. What defines the seat is disease-area command: the patients and the natural history, the endpoints regulators have actually accepted in that disease, every competitor molecule and when it reads out, the <dfn>biomarkers</dfn> that segment the patients, and the external expert network, the <dfn>KOL</dfn>s who run the steering committees and advisory boards, known by first name. When a client says they need someone who can pick the comparator and knows which endpoint the FDA will take, that is a TA Head ask, whatever title lands on the offer. Promotion beyond VP requires breadth: more than one disease area, or the general-management skill to run development as a business rather than a series of trials.</p>" },

      { heading: "Chief Medical Officer: where clinical risk stops",
        point: "The CMO carries board exposure, portfolio kill decisions, and final clinical risk, and the equity grant, not the base, is what the negotiation turns on.",
        html: "<p>The <dfn>Chief Medical Officer</dfn> owns medical strategy for the company, and three things separate the rung from everything below it. Board and investor exposure: the CMO presents the clinical story in financings and partnering diligence, and a biotech CMO can spend a quarter of their time with investors. Portfolio calls: which programs live, which die, which get partnered, decided across the whole pipeline rather than inside one area. And clinical risk: the buck stops here. Dose escalation sign-offs, responses to a clinical hold, whether an ambiguous safety signal pauses a study, these end on the CMO's desk with their name attached.</p>" +
        "<p>Company size rewrites the job completely. At a 40-person biotech the CMO is also the VP, the TA Head, and on a bad week the medical monitor, doing rung-two work with a rung-six title. At large pharma the top development job is often titled Chief Development Officer or Head of R&amp;D, and the person called CMO may run medical governance and safety instead of the pipeline. Read the org chart, not the acronym.</p>" +
        "<p>Comp shape, heavily hedged: biotech CMO base commonly cited at roughly 450,000 to 600,000 dollars, bonus often 40 to 50 percent of base, and the real variable is equity, commonly cited at roughly half a percent to one and a half percent of the company for a first CMO at a private clinical-stage biotech, materially less at a public one, and the single most negotiated line in the package. It can dwarf everything else or expire worthless. This is why CMO searches obsess over stage and runway: the cash is comparable across offers, the equity story is the negotiation. There is no rung above, so the moves that follow are a bigger company, a better pipeline, a public-company board seat, or venture work.</p>" },

      { heading: "Reading a title honestly",
        point: "Level a candidate by the largest thing she owned that worked and how much supervision it took, because scope plus autonomy is the level and title is marketing.",
        html: "<p>Titles inflate savagely as companies shrink. A VP of Clinical Development at a 30-person biotech may run one Phase 2 study with a rented CRO team and a fractional safety consultant: less real scope than a Medical Director at large pharma running three global trials. That does not make the small-company VP a fraud. Small companies pay in title because they cannot pay in cash, and a good operator at thirty people touches everything. It makes the title a currency, and your job is the exchange rate.</p>" +
        "<p>Six questions convert any title into actual size. Ask them conversationally, never as a checklist read aloud:</p>" +
        "<ul><li>How many active studies, in which phases, and which were yours end to end?</li>" +
        "<li>What did you write yourself: protocols, the development plan, or slides about them?</li>" +
        "<li>Who spoke at your last FDA meeting, and what was your part in the prep?</li>" +
        "<li>How many direct reports, and at what levels?</li>" +
        "<li>What budget did you sign for?</li>" +
        "<li>Who made the last go/no-go call, and what exactly was your input?</li></ul>" +
        "<p>Then level the candidate by the largest thing they owned that worked, and check how much supervision it took. <strong>Scope plus autonomy is the level. The title is marketing.</strong> The candidates worth placing will respect you more for asking scope questions than for flattering the business card.</p>" },

      { heading: "Neighbors and on-ramps",
        point: "Clinical scientists run real development science but cannot hold the physician seats, and clinicians with no trial exposure, discovery PhDs, and commercial people do not cross.",
        html: "<p>Two adjacent tracks will cross your desk constantly. The <dfn>clinical scientist</dfn> is usually a PhD or PharmD, sometimes a physician not licensed in the US, who runs the study science beside the Medical Director: data review, site scientific questions, protocol drafting. Strong ones function like Medical Directors without the medical license. The non-physician PhD development track is real and rises through Director to VP of Clinical Science, but it does not lead to the physician seats, because medical monitoring of record and the medical judgment signatures need a licensed physician behind them. When a req says MD required it usually means it; know which of your clients will bend for a spectacular PhD and which never will, and do not spend political capital finding out mid-search.</p>" +
        "<p>Routes into industry, ranked by traction. Academia to industry is the standard on-ramp and lands at Medical Director, occasionally Senior for a professor with a serious trial portfolio; the sell is impact and scale, the friction is autonomy and publication culture. CRO to sponsor is the cleanest lateral: the candidate already lives in protocols, sites, and sponsor calls, and simply changes sides of the table. Safety to development works, mostly early in a career, and calcifies with every additional safety-only year, a pattern Module 6 treats in detail.</p>" +
        "<p>The hard or closed transitions, so you never oversell one: a practicing clinician with no trial exposure cannot enter above the most junior rungs, no matter how impressive the clinical career. A preclinical or discovery PhD cannot cross to the physician ladder at all without the medical degree. Medical affairs into development is possible but must show interventional trial ownership, not advisory boards and publications. Commercial does not cross. Telling a candidate their jump is unrealistic, and showing them the one that is realistic, is how a new recruiter earns a physician's respect in one call.</p>" }
    ],
    checklist: [
      "Level any CV by scope and autonomy, not title, using the six exchange-rate questions",
      "Recite what a Medical Director owns and what fills their week, without notes",
      "Test whether a Senior title reflects grown scope or accumulated tenure in one question",
      "Quote each rung's comp shape as base, bonus, and equity with hedges, never a precise figure",
      "Route clinical scientist and PhD CVs correctly instead of forcing them at physician reqs",
      "Judge which industry on-ramp a candidate is standing on before pitching the jump"
    ]
  },

  short: [
    { id: "m05s01",
      prompt: "Say it out loud as the recruiter. A candidate is a Senior Medical Director at a 40-person biotech and wants a VP title at a large pharma. Tell her honestly how that will land.",
      model: "I want to be straight with you, because the leveling meeting will be. At a company that size, your title translates through scope: the studies you ran, the people you managed, the budget you signed, not the card. Right now that evidence reads as strong Senior or Executive Medical Director on their scale, and if I pitch you as a VP they will quietly downgrade you and we lose control of the story. What I can do is lead with the breadth you carried, because at forty people you touched everything, and target Executive Medical Director seats with a visible VP path. Land there, prove the scope on their scale, and you get the title with the scope attached to it.",
      rubric: [
        "Named title inflation and the leveling reality without insulting the candidate",
        "Reframed the pitch around scope evidence: studies, reports, budget, agency exposure",
        "Gave a concrete next step with a path to the desired title"
      ] },

    { id: "m05s02",
      prompt: "An associate professor running investigator-initiated oncology trials asks, a little offended, why you are calling her about a Medical Director role instead of something senior. Answer her out loud.",
      model: "That is a fair question, so here is the honest version. Industry will absolutely pay for your science, but Medical Director is where nearly every academic enters, including people with portfolios like yours, because the job it trains is different: running a global program through a CRO, inside a sponsor's quality system, with regulatory and biostatistics as daily partners. Those are muscles even excellent investigators have not used yet. The good news is that academics who make the jump move fast, and two strong years as a Medical Director is a shorter road to real program ownership than holding out for a VP title that will not come. If the science and the company are right, the entry rung is the least important part of this decision.",
      rubric: [
        "Respected her academic seniority instead of dismissing it",
        "Named the specific sponsor-side skills she has not yet exercised",
        "Framed Medical Director as the standard entry with fast upside, not a demotion",
        "Closed on the decision that actually matters: company and program quality"
      ] },

    { id: "m05s03",
      prompt: "A 25-person biotech CEO wants you to recruit a sitting VP of Clinical Development from a top-ten pharma as his first CMO, on a below-market base and mostly equity. Tell him out loud how to fix the search before you take it.",
      model: "I can run that search, but I would be taking your money to disappoint you, so let me recalibrate it first. A sitting big-pharma VP has a machine around them: regulatory, safety, operations, all on staff. At twenty-five people they lose the machine, take a pay cut, and inherit three jobs, and the few who would say yes are often running from something. The candidate who says yes for the right reasons is the Executive Medical Director, or the VP at a small or mid-size company, who is ready for a first CMO seat, wants the title, and prices your equity like an owner instead of a courtesy. Same capability you are asking for, better motivation, and your comp structure actually works for them. Let me build you that slate.",
      rubric: [
        "Told the client the target pool is wrong without dismissing the goal",
        "Explained concretely why the big-pharma VP rarely moves and struggles without infrastructure",
        "Proposed the step-up profile as the realistic slate",

MODULES.push({
  id: "m06",
  title: "Medical Monitor and Drug Safety Physician",
  tagline: "The most misunderstood job on the desk, and the safety physician it gets confused with",

  learn: {
    sections: [
      { heading: "What a medical monitor actually does all day",
        point: "The medical monitor is the physician of record for a running trial, and at sponsors it is usually a hat the Medical Director wears.",
        html: "<p>The <dfn>medical monitor</dfn> is the physician of record for a running trial: the doctor a site calls when the protocol meets a real patient and the two disagree. The day is a stream of judgment calls. A coordinator calls about <dfn>eligibility</dfn>: the patient fits every criterion except a platelet count a shade below the cutoff, and the investigator wants her in. A site needs a protocol clarification: does day 28 mean calendar days or a visit window? Safety data arrives continuously, lab listings and adverse event reports, and the monitor reads it looking for the thing that does not belong. When an adverse event comes in, the monitor makes the <dfn>causality assessment</dfn>: is this the drug or the disease, the question the entire safety system hangs on. They apply the protocol's <dfn>dose modification</dfn> rules, deciding when a patient's dose is interrupted, reduced, or stopped, and they watch the <dfn>stopping rules</dfn>, the pre-specified lines that pause a cohort or the whole study.</p>" +
        "<p>Two fixtures complete the picture. The investigator hotline: the medical monitor is reachable around the clock for site emergencies, because a patient in trouble at 2 a.m. cannot wait for business hours. And escalation to the <dfn>DSMB</dfn>, the independent data and safety monitoring board that reviews unblinded data: when events cross a threshold, the monitor's world feeds the committee that can stop the trial.</p>" +
        "<p>Two facts most recruiters miss. First, the answer to most eligibility pleas is no: enrolling outside criteria is a protocol deviation, and modern sponsors do not grant waivers, so much of the job is holding the line politely. Second, at sponsors the medical monitor is usually not a separate person: it is a hat the Medical Director wears for their own study. A dedicated medical monitor title is more common at CROs and very large sponsors. That single fact untangles half the confused CVs on this desk.</p>" },

      { heading: "Sponsor-side, CRO-side, and the rent-a-monitor market",
        point: "Sponsor monitors own one molecule and CRO monitors carry volume, so ask about a call nobody reviewed to learn which one is in front of you.",
        html: "<p>The same title means two different jobs depending on the employer, and sorting that out is the first move on any CV. The sponsor-side medical monitor owns one drug and the consequences: their causality calls and dose decisions bind the company, and they carry the program's history in their head. The CRO-provided medical monitor covers volume: often several studies across different clients, taking first-line site calls, resolving what the monitoring plan lets them resolve, and escalating the consequential calls to the sponsor. Neither is lesser; they are different assets. CRO monitors bring breadth, process fluency, and calm under volume. Sponsor monitors bring ownership and depth on one molecule.</p>" +
        "<p>On a CV: medical monitor for fourteen studies across six sponsors in four years is a CRO profile, and the screening question is which decisions were actually theirs versus escalated. Medical monitor for our pivotal Phase 3, at a sponsor, means the decisions stopped with them. One question sorts any of these CVs: tell me about a call you made that nobody reviewed.</p>" +
        "<p>Part-time and contract medical monitoring is a real market, not a gig-economy oddity. A small biotech with one study cannot justify a full-time monitor, so it rents a fraction of an experienced physician through a consultancy or an independent, sometimes 0.2 of a person spread across five clients. For the desk this cuts two ways: fractional monitors can be excellent full-time candidates when a client wants someone who has seen many programs, and a client who cannot fund a full-time seat can sometimes be sold a search for a fractional one. A CV of only short fractional gigs, though, raises the same ownership question as the CRO profile: probe what they decided, not what they watched.</p>" },

      { heading: "The drug safety physician",
        point: "The drug safety physician watches the whole molecule across every patient exposed, running signal detection and the aggregate reports behind every benefit-risk judgment.",
        html: "<p>The <dfn>drug safety physician</dfn> sits in <dfn>pharmacovigilance</dfn>, the discipline that watches a drug's harms, and works across the product's whole life rather than inside one study. Where the medical monitor's unit of concern is this trial, this patient, this week, the safety physician's unit is the molecule: every patient exposed, in every study and every market, for as long as the drug sells.</p>" +
        "<p>The work: reviewing individual cases as they arrive, each one a small causality judgment. <dfn>Signal detection</dfn>: watching across all of it, trial data, spontaneous post-market reports, literature, for a pattern, say six liver cases in eight months that no single study would have flagged alone. Signal evaluation: deciding whether the pattern is real, drug-related, and actionable. Writing and defending the aggregate safety reports: the <dfn>DSUR</dfn>, the annual development safety update report, while the drug is in trials; the <dfn>PSUR</dfn> or its modern successor the <dfn>PBRER</dfn>, periodic benefit-risk reports, once it is on the market. You need those acronyms at recognition level; nobody expects you to have read one. Behind the reports sits the real product: the <dfn>benefit-risk assessment</dfn>, the running judgment of whether the drug's good outweighs its harm in each population, which drives <dfn>risk management plans</dfn>, label changes when a new adverse reaction is confirmed, and the safety governance committees where a company formally decides what it believes about its own molecule.</p>" +
        "<p>Career shape matters for your screens: safety physicians often arrive from clinical practice or from development, the work is desk-based and frequently remote-friendly, and demand is constant because every marketed product must be surveilled for as long as it sells. That stability is the appeal, and, as the last section covers, sometimes the trap.</p>" },

      { heading: "The boundary, and the handoff",
        point: "The monitor is trial-facing and prospective inside one study; the safety physician is product-facing across the lifecycle, and that two-sentence answer wins intake calls.",
        html: "<p>Clients will test you on this, sometimes deliberately. Here is the line, and it fits in two sentences. <strong>The medical monitor is trial-facing and prospective within one study: they protect the patients in that trial and the integrity of that protocol, in real time. The drug safety physician is product-facing across the lifecycle: they protect the benefit-risk of the molecule across every patient exposed, in trials and on the market.</strong></p>" +
        "<p>The overlap is real, which is why people blur them. Both assess causality, both sit in safety review meetings, both stare at the same serious events. The handoff runs like this: a site reports a serious adverse event into the medical monitor's world, typically within 24 hours; the case is entered into the safety database, where pharmacovigilance owns it; the safety physician runs company causality, expectedness, regulatory reporting, and folds the case into the aggregate picture. The monitor keeps running the trial. The safety physician keeps watching the product.</p>" +
        "<p>At a 30-person biotech one physician wears both hats, which is exactly why CVs blur, and why your screening questions matter most on small-company candidates. At large pharma they are separate departments, clinical development on one side and patient safety on the other, with a formal agreement dividing the work. When a client asks whether you know the difference, the two-sentence version above, delivered without hesitation, is worth more than an hour of vocabulary.</p>" },

      { heading: "The adverse event vocabulary",
        point: "Severity is intensity and seriousness is a regulatory category defined by outcome, and getting those backwards in front of a physician costs you the call.",
        html: "<p>An <dfn>AE</dfn>, adverse event, is any untoward medical occurrence in a trial participant, related to the drug or not: a headache, a car accident, a heart attack. An <dfn>SAE</dfn>, serious adverse event, is an AE that meets one of the seriousness criteria: death, a life-threatening event, hospitalization or prolongation of a hospitalization, persistent or significant disability, a congenital anomaly, or another medically important event in the judgment of the physician. Memorize that list. It is short, and it is the law of this vocabulary.</p>" +
        "<p>The classic confusion, and the fastest way to sound like you belong: <strong>severity is not seriousness</strong>. Severity is intensity: mild, moderate, severe, or a numbered grade in oncology. Seriousness is the regulatory category defined by outcome. A severe grade 3 headache that resolves at home is not serious. A mild rash that leads to an overnight admission for observation is serious, because hospitalization is a criterion. Physicians hear recruiters get this backwards every week; do not be one of them.</p>" +
        "<p><dfn>Expectedness</dfn>: is the event already described in the reference document, the Investigator's Brochure before approval, the label after? An event that is serious, unexpected, and judged possibly related to the drug is a <dfn>SUSAR</dfn>, a suspected unexpected serious adverse reaction, and SUSARs run on clocks: an initial report to regulators within 7 calendar days if fatal or life-threatening, 15 days for the rest. Hold those numbers at recognition level, not practitioner level. Finally, <dfn>treatment emergent</dfn>: an event that begins or worsens after the first dose, which is the population every safety table in every readout actually counts. TEAE tables are what candidates mean when they say they reviewed safety data.</p>" },

      { heading: "Reading these CVs, and holding the line",
        point: "Say plainly when a candidate passes your depth, and probe a safety-only CV pitched as development for protocols written, dose decisions owned, and programs designed.",
        html: "<p>Recruiting-grade fluency means you can define every term in this module, place each activity with the right role, and ask a scope question a practitioner respects. It does not mean you can evaluate a signal detection methodology, and pretending otherwise is the fastest way to lose a physician's respect. When a candidate goes past your depth, and the good ones will, use the honest line: that is past the level I can evaluate, and my client will be glad it is there. Then get the headline: give me the one-sentence version of what you just described so I represent it exactly right. You keep credibility, they feel heard, and the client gets accurate paper.</p>" +
        "<p>Who crosses between these roles: development physicians already do medical monitoring as part of the Medical Director job, so development into monitoring is trivial, and the road runs the other way while the candidate is still trial-facing: a CRO or sponsor medical monitor moving into a development seat is a standard, workable move. Development into safety also happens, often for lifestyle: remote work, no site emergencies, no 2 a.m. hotline.</p>" +
        "<p>Who does not cross cleanly: a physician who has spent eight or ten years entirely in pharmacovigilance, case review and aggregate reports, pitching themselves as a clinical development candidate. That CV is a red flag to probe, not because safety work is lesser, but because development buys protocol authorship, dose decisions, and trial strategy, and a safety-only career contains none of them. Probe with three questions: what protocols have you written, what dose decisions have you owned, what development program have you helped design? Real crossover evidence sometimes surfaces, early trial years, a secondment, a small-company stretch wearing both hats, and then the pitch is honest. If the answers are all case narratives and DSURs, it is a safety career, there are excellent searches for it, and the kindest, most profitable thing you can do is place them where they will actually win.</p>" }
    ],
    checklist: [
      "Walk a medical monitor's day from eligibility calls to DSMB escalation, without notes",
      "Sort sponsor-side from CRO-side monitoring with one question: which calls were actually yours",
      "State the trial-facing versus product-facing boundary in two sentences on demand",
      "Recite the SAE seriousness criteria and keep severity and seriousness straight under pressure",
      "Recognize SUSAR and the 7 and 15 day clocks without claiming practitioner depth",
      "Probe a safety-only CV pitched as development with the three ownership questions"
    ]
  },

  short: [
    { id: "m06s01",
      prompt: "Say it out loud as the recruiter. Mid-screen, a drug safety physician starts explaining disproportionality scoring in signal detection and you are lost. Handle the moment without faking it.",
      model: "Doctor Hargrove, I am going to stop you there and be straight with you: you have just gone past the level I can evaluate, and honestly, that depth is what my client is paying to find. What I want is to carry it to them accurately. Give me the one-sentence headline, what this let you catch and what happened because you caught it, and I will make sure the people who can appreciate the methodology hear it exactly right. Now, back to the parts I can evaluate: walk me through who acted on that signal and what your role was in the decision.",

      prompt: "A Chief Medical Officer on an intake call says, tired: 'The last three recruiters sent us pharmacovigilance people for our medical monitor search.' Prove in thirty seconds that it will not happen with you.",

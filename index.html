/* ============================================================
   SECTION 2: STORE
   ============================================================ */
const STORE_KEY = "pdesk.v1";
let storageOk = true;

function defaultRD(){
  return {
    learn:{}, quiz:{}, fillin:{}, short:{}, scenario:{},
    test:{ history:[] },
    plan:{ day:1 },
    streak:{ lastDay:null, count:0, best:0 },
    dev:false
  };
}

function loadRD(){
  let raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
    const probe = STORE_KEY + ".probe";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
  } catch (e) {
    storageOk = false;
    return defaultRD();
  }
  if (!raw) return defaultRD();
  try {
    const obj = JSON.parse(raw);
    const base = Object.assign(defaultRD(), obj);
    if (!base.plan || typeof base.plan.day !== "number") base.plan = { day: 1 };
    return base;
  } catch (e) {
    if (typeof confirm === "function" && confirm("Saved progress could not be read. Reset it and start clean?")) {
      try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
      return defaultRD();
    }
    storageOk = false;
    return defaultRD();
  }
}

let RD = loadRD();
let saveTimer = null;
function saveRD(){
  if (!storageOk) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushRD, 250);
}
function flushRD(){
  if (!storageOk) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(RD)); }
  catch (e) { storageOk = false; }
}
window.addEventListener("beforeunload", flushRD);

function pad2(n){ return String(n).padStart(2, "0"); }
function dayStr(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function todayStr(){ return dayStr(new Date()); }
function yesterdayStr(){ return dayStr(new Date(Date.now() - 86400000)); }

function gradedEvent(){
  const s = RD.streak;
  const t = todayStr();
  if (s.lastDay !== t) {
    s.count = (s.lastDay === yesterdayStr()) ? (s.count || 0) + 1 : 1;
    s.lastDay = t;
    s.best = Math.max(s.best || 0, s.count);
  }
  saveRD();
  const box = document.getElementById("streakbox");
  if (box) box.innerHTML = streakHTML();
}

/* per-module store accessors */
function quizRec(mid){ if (!RD.quiz[mid]) RD.quiz[mid] = { best:0, last:0, attempts:0, missed:{} }; return RD.quiz[mid]; }
function fillinRec(mid){ if (!RD.fillin[mid]) RD.fillin[mid] = { items:{} }; return RD.fillin[mid]; }
function fillinItemRec(mid, fid){ const r = fillinRec(mid); if (!r.items[fid]) r.items[fid] = { right:0, wrong:0 }; return r.items[fid]; }
function shortRec(mid){ if (!RD.short[mid]) RD.short[mid] = {}; return RD.short[mid]; }

/* ============================================================
   SECTION 3: MATCHER
   ============================================================ */
const NUM_WORDS = { zero:"0", one:"1", two:"2", three:"3", four:"4", five:"5", six:"6", seven:"7", eight:"8", nine:"9", ten:"10" };

function norm(s){
  let t = String(s == null ? "" : s).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  t = t.replace(/&/g, " and ");
  t = t.replace(/[^a-z0-9]+/g, " ").trim();
  if (!t) return "";
  let toks = t.split(/\s+/);
  /* acronym collapse first: "i n d" must become "ind" before the
     article rule can eat the leading "i"-style token */
  if (toks.length > 1 && toks.every(k => k.length === 1)) return toks.join("");
  if (toks.length > 1 && (toks[0] === "a" || toks[0] === "an" || toks[0] === "the")) toks.shift();
  toks = toks.map(k => NUM_WORDS[k] !== undefined ? NUM_WORDS[k] : k);
  toks = toks.map(k => (k.length >= 4 && k.endsWith("s") && !k.endsWith("ss")) ? k.slice(0, -1) : k);
  if (toks.length > 1 && toks.every(k => k.length === 1)) return toks.join("");
  return toks.join(" ");
}

function compact(s){ return norm(s).replace(/ /g, ""); }

function lev(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = new Array(n + 1);
  let cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(
        prev[j] + 1,
        cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    const tmp = prev; prev = cur; cur = tmp;
  }
  return prev[n];
}

function fillinMatch(input, item){
  const cands = [item.answer].concat(item.accept || []);
  const nU = norm(input);
  if (!nU) return false;
  const cU = compact(input);
  for (const cand of cands) {
    const nc = norm(cand);
    if (nU === nc) return true;
    const cc = compact(cand);
    if (cU === cc) return true;
    const len = cc.length;
    if (len >= 6) {
      const maxd = len < 10 ? 1 : 2;
      if (lev(cU, cc) <= maxd) return true;
    }
  }
  return false;
}

/* ============================================================
   SECTION 4: ENGINE
   ============================================================ */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function modById(mid){ return MODULES.find(m => m.id === mid) || null; }
function modIndex(mid){ return MODULES.findIndex(m => m.id === mid); }
function pct(x){ return Math.round((x || 0) * 100) + "%"; }
function setEq(aSet, bArr){
  if (aSet.size !== bArr.length) return false;
  for (const v of bArr) if (!aSet.has(v)) return false;
  return true;
}

let state = { route: { screen: "home", arg: null }, session: null, guideQ: "", guideTag: "all",
  /* which section of which module the paged reader is showing, and whether it is
     in fast-read mode. Reset whenever a different module is opened. */
  learn: null };

function parseHash(){
  const h = (location.hash || "#/home").replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  return { screen: parts[0] || "home", arg: parts[1] || null };
}

function go(hash){ if (location.hash === hash) { onRoute(); } else { location.hash = hash; } }

function onRoute(){
  state.route = parseHash();
  state.session = null;
  const r = state.route;
  if (r.screen === "quiz" && modById(r.arg)) startQuiz(r.arg, null);
  else if (r.screen === "fillin" && modById(r.arg)) startFillin(r.arg);
  else if (r.screen === "test") startTest();
  else if (r.screen === "scenario" && r.arg) {
    const sc = SCENARIOS.find(s => s.id === r.arg);
    if (sc) state.session = { mode: "scenario", scenarioId: sc.id, phase: "write", text: "", checks: sc.rubric.map(() => false) };
  }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", onRoute);

/* ---------- session starters ---------- */
function prepItem(it){
  const p = { item: it };
  if (it.type === "single" || it.type === "multi") p.disp = shuffle(it.options.map((_, i) => i));
  else if (it.type === "match") p.rdisp = shuffle(it.pairs.map((_, i) => i));
  else if (it.type === "cat") p.idisp = shuffle(it.items.map((_, i) => i));
  else if (it.type === "order") p.pdisp = shuffle(it.steps.map((_, i) => i));
  return p;
}

function freshDraft(it){
  if (it.type === "single") return { sel: null };
  if (it.type === "multi") return { sel: [] };
  if (it.type === "match") return { pairs: {}, active: null };
  if (it.type === "cat") return { assign: it.items.map(() => null) };
  if (it.type === "order") return { placed: [] };
  return {};
}

function startQuiz(mid, subsetIds){
  const m = modById(mid);
  let bank = m.quiz;
  const full = !subsetIds;
  if (subsetIds) bank = bank.filter(q => subsetIds.indexOf(q.id) >= 0);
  const items = shuffle(bank).map(prepItem);
  state.session = { mode: "quiz", moduleId: mid, full: full, items: items, idx: 0,
    phase: "answer", responses: [], draft: freshDraft(items[0].item) };
}

function startFillin(mid){
  const m = modById(mid);
  const items = shuffle(m.fillin).map(it => ({ item: it }));
  state.session = { mode: "fillin", moduleId: mid, items: items, idx: 0,
    phase: "answer", responses: [], draft: {} };
}

function startTest(){
  const pool = [];
  for (const m of MODULES) {
    const picks = shuffle(m.quiz).slice(0, 2);
    for (const q of picks) pool.push(Object.assign({ _mid: m.id }, prepItem(q)));
  }
  const items = shuffle(pool);
  state.session = { mode: "test", items: items, idx: 0,
    phase: "answer", responses: [], draft: items.length ? freshDraft(items[0].item) : {} };
}

/* ---------- grading ---------- */
function gradeItem(p, draft){
  const it = p.item;
  if (it.type === "single") return { correct: draft.sel === it.answer };
  if (it.type === "multi") return { correct: setEq(new Set(draft.sel), it.answers) };
  if (it.type === "match") {
    let ok = true;
    for (let i = 0; i < it.pairs.length; i++) if (draft.pairs[i] !== i) ok = false;
    return { correct: ok };
  }
  if (it.type === "cat") {
    let ok = true;
    it.items.forEach((row, i) => { if (draft.assign[i] !== row[1]) ok = false; });
    return { correct: ok };
  }
  if (it.type === "order") {
    const n = it.steps.length;
    let ok = draft.placed.length === n;
    if (ok) for (let i = 0; i < n; i++) if (draft.placed[i] !== i) ok = false;
    return { correct: ok };
  }
  return { correct: false };
}

function draftComplete(p, draft){
  const it = p.item;
  if (it.type === "single") return draft.sel !== null;
  if (it.type === "multi") return draft.sel.length > 0;
  if (it.type === "match") return Object.keys(draft.pairs).length === it.pairs.length;
  if (it.type === "cat") return draft.assign.every(v => v !== null);
  if (it.type === "order") return draft.placed.length === it.steps.length;
  return false;
}

function streakHTML(){

function render(){

  else if (r.screen === "fillin") inner = sessionScreen();
  else if (r.screen === "short") inner = shortScreen(r.arg);
  else if (r.screen === "scenario") inner = r.arg ? scenarioDetail() : scenarioList();
  else if (r.screen === "rough") inner = r.arg ? roughDetail(r.arg) : roughScreen();
  else if (r.screen === "guide") inner = guideScreen();
  else if (r.screen === "progress") inner = progressScreen();
  else if (r.screen === "selftest") inner = selftestScreen();

  const af = document.querySelector("[data-autofocus]");

/* ---------- stats ---------- */
function modStats(m){
  const read = RD.learn[m.id] && RD.learn[m.id].doneAt ? 1 : 0;
  const q = RD.quiz[m.id];
  const quizBest = q ? (q.best || 0) : 0;
  const f = RD.fillin[m.id];
  let right = 0, wrong = 0, attempted = 0;
  if (f) for (const fid in f.items) {
    const rec = f.items[fid];
    if ((rec.right || 0) + (rec.wrong || 0) > 0) attempted++;
    right += rec.right || 0; wrong += rec.wrong || 0;
  }
  const fillAcc = (right + wrong) > 0 ? right / (right + wrong) : 0;
  const sh = RD.short[m.id] || {};
  let shSum = 0, shN = 0;
  for (const pid in sh) { shSum += (sh[pid].best || 0) / (sh[pid].max || 1); shN++; }
  const shortAvg = shN ? shSum / shN : 0;
  const mastery = 0.15 * read + 0.40 * quizBest + 0.25 * fillAcc + 0.20 * shortAvg;
  return { read: read, quizBest: quizBest, fillAcc: fillAcc, fillAttempted: attempted,
    fillBank: m.fillin.length, shortAvg: shortAvg, shortN: shN, mastery: mastery };
}

/* ---------- plan helpers ---------- */
function planForDay(d){ return PLAN.find(p => p.day === d) || null; }

function planItemState(it){
  if (it.kind === "learn") {
    const done = !!(RD.learn[it.ref] && RD.learn[it.ref].doneAt);
    return { done: done, score: done ? "read" : "" };
  }
  if (it.kind === "quiz") {
    const rec = RD.quiz[it.ref];
    const done = !!(rec && rec.attempts > 0);
    return { done: done, score: done ? pct(rec.best) : "" };
  }
  if (it.kind === "fillin") {
    const m = modById(it.ref);
    const f = RD.fillin[it.ref];
    let attempted = 0;
    if (f) for (const fid in f.items) if ((f.items[fid].right || 0) + (f.items[fid].wrong || 0) > 0) attempted++;
    const bank = m ? m.fillin.length : 0;
    return { done: bank > 0 && attempted >= bank, score: attempted ? attempted + "/" + bank : "" };
  }
  if (it.kind === "short") {
    const m = modById(it.ref);
    const sh = RD.short[it.ref] || {};
    const n = Object.keys(sh).length;
    const total = m ? m.short.length : 0;
    return { done: total > 0 && n >= total, score: n ? n + "/" + total : "" };
  }
  if (it.kind === "scenario") {
    const rec = RD.scenario[it.ref];
    return { done: !!rec, score: rec ? rec.best + "/" + rec.max : "" };
  }
  if (it.kind === "test") {
    const h = RD.test.history || [];
    const done = h.length > 0;
    const last = done ? h[h.length - 1] : null;
    return { done: done, score: last ? last.score + "/" + last.total : "" };
  }
  return { done: false, score: "" };
}

function planItemHref(it){
  if (it.kind === "learn") return "#/learn/" + it.ref;
  if (it.kind === "quiz") return "#/quiz/" + it.ref;
  if (it.kind === "fillin") return "#/fillin/" + it.ref;
  if (it.kind === "short") return "#/short/" + it.ref;
  if (it.kind === "scenario") return "#/scenario/" + it.ref;
  if (it.kind === "test") return "#/test";
  return "#/home";
}

const KIND_LABEL = { learn: "Read", quiz: "Quiz", fillin: "Fill-in", short: "Short answers", scenario: "Scenario", test: "Cross-module test" };

/* A day usually stacks several reps on one module, so the bold line carries the
   action (Read, Quiz, Fill-in) and the line beneath carries what it is on.
   Scenarios invert that, because a scenario's title is the interesting part.
   When a day spans two modules the same action appears twice, so the module
   name joins the bold line to keep every row distinct. */
function planItemTitle(it, dayItems){
  if (it.kind === "test") return "Cross-module test";
  if (it.kind === "scenario") {
    const sc = SCENARIOS.find(s => s.id === it.ref);
    return sc ? sc.title : "Scenario";
  }
  const base = KIND_LABEL[it.kind] || it.kind;
  const dup = (dayItems || []).filter(x => x.kind === it.kind).length > 1;
  if (dup) {
    const m = modById(it.ref);
    if (m) return base + ": " + m.title;
  }
  return base;
}

function planItemContext(it){
  if (it.kind === "test") return "Two questions from every module";
  if (it.kind === "scenario") return "Scenario";
  const m = modById(it.ref);
  return m ? m.title : "";
}

/* ---------- screens ---------- */
function todayScreen(){

  const plan = planForDay(day);
  let chips = "";
  PLAN.forEach(p => {

      (st.score ? '<span class="taskscore">' + esc(st.score) + "</span>" : "") +

  });
  const nQuiz = MODULES.reduce((n, m) => n + (m.quiz || []).length, 0);

       hardcoded number quietly goes stale the next time it is rebalanced. */
    '<p class="tagline">' + PLAN.length + " days from new desk to credible, at about an hour a day. " +
      "Pick your day, do the reps in order, and use Rough Day when the desk wins one.</p>" +

    '<div class="daystrip">' + chips + "</div>" +
    (plan
      ? '<div class="eyebrow">Day ' + plan.day + " / " + esc(plan.title) + '</div>' +
        '<p class="focusline">' + esc(plan.focus) + "</p>" +
        '<ul class="tasklist">' + items + "</ul>"
      : '<p class="notep">No plan data loaded.</p>') +
    '<div class="btnrow"><a class="btn" href="#/test">Cross-module test</a><a class="btn" href="#/progress">Progress</a></div>' +
    '<p class="kbdhint">' + MODULES.length + " modules / " + nQuiz + " quiz items / " + nFill + " fill-ins / " + nShort + " short answers / " + SCENARIOS.length + " scenarios</p>";
}

/* A percentage is a number you have to read. A ring is a shape you can see from
   across the room, which is what makes a list of twelve modules scannable. */
function ring(frac){
  const r = 13, c = 2 * Math.PI * r;
  const f = Math.max(0, Math.min(1, frac || 0));
  const on = f * c;
  return '<svg class="ring" viewBox="0 0 32 32" aria-hidden="true">' +
    '<circle class="ringbg" cx="16" cy="16" r="' + r + '"></circle>' +
    /* A rounded cap on a zero-length arc still paints a dot, which reads as
       progress that has not happened. Draw nothing at all instead. */
    (f > 0
      ? '<circle class="ringfg" cx="16" cy="16" r="' + r + '" stroke-dasharray="' + on.toFixed(1) + " " + c.toFixed(1) + '"></circle>'
      : "") +
    "</svg>";
}

function modulesScreen(){
  let rows = "";
  MODULES.forEach((m, i) => {
    const st = modStats(m);
    rows += '<li><a class="modrow" href="#/learn/' + m.id + '">' +
      '<span class="modnum">' + pad2(i + 1) + "</span>" +
      '<span class="modmain"><b>' + esc(m.title) + '</b><span class="sub">' + esc(m.tagline) + "</span></span>" +
      '<span class="modring">' + ring(st.mastery) + '<span class="modpct">' + pct(st.mastery) + "</span></span></a></li>";
  });
  return '<div class="hd"><div class="eyebrow">The curriculum</div><h1>Modules</h1>' +
    '<p class="tagline">Read first, then drill: quiz, fill-in, short answer. Mastery blends all four.</p></div>' +
    '<ul class="modlist">' + rows + "</ul>";
}

function subnav(mid, active){
  const mk = (href, label, on) => '<a class="btn' + (on ? " primary" : "") + '" href="' + href + '">' + label + "</a>";
  return '<div class="subnav">' +
    mk("#/learn/" + mid, "Learn", active === "learn") +
    mk("#/quiz/" + mid, "Quiz", active === "quiz") +
    mk("#/fillin/" + mid, "Fill-in", active === "fillin") +
    mk("#/short/" + mid, "Short answer", active === "short") +
    "</div>";
}

function moduleHd(m, active){
  const i = modIndex(m.id);
  return '<div class="hd"><a class="backlink" href="#/modules">&lt; All modules</a>' +
    '<div class="eyebrow" style="margin-top:14px">Module ' + pad2(i + 1) + "</div>" +
    "<h1>" + esc(m.title) + "</h1>" +
    '<p class="tagline">' + esc(m.tagline) + "</p>" + subnav(m.id, active) + "</div>";
}

/* ---------- learn: one section per screen ----------
   A module is two thousand words. Delivered as one scroll it reads as a wall and
   gets abandoned; delivered one section at a time it is six short reads with
   obvious places to stop, which is what makes an hour a day survivable. The last
   page is the checklist, so finishing the reading and marking it complete are the
   same gesture rather than a hunt back up the page. */

/* Pull the vocabulary a section marks up, so it can be surfaced as lookup chips
   instead of staying buried mid-paragraph. */
function dfnTerms(html){
  const out = [], seen = {};
  const re = /<dfn>([\s\S]*?)<\/dfn>/g;
  let m;
  while ((m = re.exec(html || null || "")) !== null) {
    const t = String(m[1]).replace(/<[^>]+>/g, "").trim();
    const k = t.toLowerCase();
    if (t && !seen[k]) { seen[k] = 1; out.push(t); }
  }
  return out;
}

function guideHas(term){
  const k = String(term).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  return GUIDE.entries.some(e => String(e.term).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() === k);
}

function learnPos(mid){
  if (!state.learn || state.learn.mid !== mid) state.learn = { mid: mid, idx: 0, fast: false };
  return state.learn;
}

function termChips(sec){
  const terms = dfnTerms(sec.html);
  if (!terms.length) return "";
  const chips = terms.map(t => guideHas(t)
    ? '<button class="tchip look" data-action="term" data-arg="' + esc(t) + '">' + esc(t) + "</button>"
    : '<span class="tchip">' + esc(t) + "</span>").join("");
  return '<div class="terms"><div class="eyebrow">Key terms in this section</div>' +
    '<div class="chips">' + chips + "</div>" +
    '<p class="notep">Tap a term with a underline to look it up in the Guide.</p></div>';
}

function fastReadHTML(m){
  const rows = m.learn.sections.map((sec, i) =>
    '<button class="fastrow" data-action="learn-jump" data-arg="' + i + '">' +
      '<span class="fastnum mono">' + pad2(i + 1) + "</span>" +
      '<span class="fastmain"><b>' + esc(sec.heading) + "</b>" +
        '<span class="sub">' + esc(sec.point) + "</span></span>" +
    "</button>").join("");
  return '<div class="fastwrap"><p class="notep">The whole module in one pass. Tap any line to read it properly.</p>' +
    '<div class="fastlist">' + rows + "</div></div>";
}

function learnScreen(mid){
  const m = modById(mid);
  if (!m) return modulesScreen();
  const pos = learnPos(mid);
  const secs = m.learn.sections;
  const last = secs.length;              /* the checklist page sits after the sections */
  if (pos.idx > last) pos.idx = last;
  if (pos.idx < 0) pos.idx = 0;
  const done = RD.learn[mid] && RD.learn[mid].doneAt;

  const toggle = '<button class="btn tiny' + (pos.fast ? " primary" : "") + '" data-action="learn-fast">' +
    (pos.fast ? "Full read" : "Fast read") + "</button>";

  if (pos.fast) {
    return moduleHd(m, "learn") +
      '<div class="readbar"><div class="readmeta"><span class="mono">Fast read</span>' + toggle + "</div></div>" +
      fastReadHTML(m);
  }

  const step = pos.idx + 1;
  const pctDone = Math.round((pos.idx / last) * 100);
  const bar = '<div class="readbar">' +
    '<div class="readprog"><span style="width:' + pctDone + '%"></span></div>' +
    '<div class="readmeta"><span class="mono">' +
      (pos.idx === last ? "Wrap up" : "Section " + step + " of " + last) +
    "</span>" + toggle + "</div></div>";

  let body;
  if (pos.idx === last) {
    body = '<section class="learnsec"><h2>What you should be able to do now</h2>' +
      '<ul class="checklist">' + m.learn.checklist.map(c => "<li>" + esc(c) + "</li>").join("") + "</ul></section>" +
      '<div class="btnrow">' +
        '<button class="btn" data-action="learn-prev">Back</button>' +
        (done
          ? '<span class="mono" style="font-size:12px;color:var(--accent)">COMPLETED ' + esc(String(done).slice(0, 10)) + "</span>"
          : '<button class="btn primary" data-action="learn-done" data-arg="' + mid + '" data-primary>Mark module complete</button>') +
        '<a class="btn" href="#/quiz/' + mid + '">Go to quiz</a>' +
      "</div>";
  } else {
    const sec = secs[pos.idx];
    body = '<section class="learnsec">' +
        "<h2>" + esc(sec.heading) + "</h2>" +
        '<p class="point">' + esc(sec.point) + "</p>" +
        (sec.diagram ? '<figure class="diagram">' + sec.diagram + "</figure>" : "") +
        sec.html +
        termChips(sec) +
      "</section>" +
      '<div class="btnrow">' +
        (pos.idx > 0 ? '<button class="btn" data-action="learn-prev">Back</button>' : "") +
        '<button class="btn primary" data-action="learn-next" data-primary>' +
          (pos.idx === last - 1 ? "Finish" : "Next") + "</button>" +
      "</div>";
  }
  return moduleHd(m, "learn") + bar + body;
}

/* ---------- quiz / test / fillin shared session screen ---------- */
function sessionScreen(){
  const s = state.session;
  if (!s || !s.items || !s.items.length) return todayScreen();
  if (s.phase === "summary") return summaryScreen();
  const p = s.items[s.idx];
  const isTest = s.mode === "test";
  let head;
  if (isTest) {
    head = '<div class="hd"><div class="eyebrow">Cross-module test</div><h1>Test</h1></div>';
  } else {
    const m = modById(s.moduleId);
    head = moduleHd(m, s.mode);
  }
  const meta = '<div class="quizmeta"><span>' + (s.mode === "fillin" ? "Fill-in" : (isTest ? "Test / no feedback until the end" : "Quiz")) +
    "</span><span>" + (s.idx + 1) + " / " + s.items.length + "</span></div>";
  let body = "";
  if (s.mode === "fillin") body = fillinBody(p, s);
  else body = quizBody(p, s);
  return head + meta + body;
}

function optionRows(p, s, feedback){
  const it = p.item;
  const multi = it.type === "multi";
  let html = "";
  p.disp.forEach((oi, di) => {
    const picked = multi ? s.draft.sel.indexOf(oi) >= 0 : s.draft.sel === oi;
    let cls = "opt", mark = "";
    if (feedback) {
      const isAns = multi ? it.answers.indexOf(oi) >= 0 : it.answer === oi;
      if (isAns) { cls += " correct"; mark = '<span class="mark ok">✓</span>'; }
      if (picked && !isAns) { cls += " wrongpick"; mark = '<span class="mark bad">✕ your pick</span>'; }
      if (picked && isAns) mark = '<span class="mark ok">✓ your pick</span>';
      html += '<div class="' + cls + '"><span class="key">' + (di + 1) + '</span><span class="optbody">' + esc(it.options[oi]) + "</span>" + mark + "</div>";
    } else {
      if (picked) cls += " sel";
      html += '<button class="' + cls + '" data-action="opt" data-arg="' + oi + '"><span class="key">' + (di + 1) + '</span><span class="optbody">' + esc(it.options[oi]) + "</span></button>";
    }
  });
  return html;
}

function matchBody(p, s, feedback){
  const it = p.item;
  if (feedback) {
    let rows = "";
    it.pairs.forEach((pair, i) => {
      const chosen = s.draft.pairs[i];
      const ok = chosen === i;
      rows += "<tr><td><strong>" + esc(pair[0]) + "</strong></td>" +
        "<td>" + esc(it.pairs[chosen] ? it.pairs[chosen][1] : "") + (ok ? "" : "<br><span class=\"sub\">Correct: " + esc(pair[1]) + "</span>") + "</td>" +
        '<td class="num">' + (ok ? '<span class="mark ok">✓</span>' : '<span class="mark bad">✕</span>') + "</td></tr>";
    });
    return '<div class="scrollx"><table><thead><tr><th>Term</th><th>Your match</th><th class="num"></th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }
  const used = {};
  for (const k in s.draft.pairs) used[s.draft.pairs[k]] = parseInt(k, 10);
  let left = "", right = "";
  it.pairs.forEach((pair, i) => {
    const lockedTo = s.draft.pairs[i];
    const isActive = s.draft.active === i;
    const badge = lockedTo !== undefined ? (Object.keys(s.draft.pairs).indexOf(String(i)) + 1) : "·";
    left += '<button class="mitem' + (isActive ? " sel" : "") + (lockedTo !== undefined ? " locked" : "") +
      '" data-action="match-left" data-arg="' + i + '"><span class="mbadge">' + badge + "</span><span>" + esc(pair[0]) + "</span></button>";
  });
  p.rdisp.forEach(ri => {
    const owner = used[ri];
    const badge = owner !== undefined ? (Object.keys(s.draft.pairs).indexOf(String(owner)) + 1) : "·";
    right += '<button class="mitem' + (owner !== undefined ? " locked" : "") +
      '" data-action="match-right" data-arg="' + ri + '"><span class="mbadge">' + badge + "</span><span>" + esc(it.pairs[ri][1]) + "</span></button>";
  });
  return '<p class="kbdhint">Tap a term, then tap its description. Tap a locked pair to unlock it.</p>' +
    '<div class="matchcols"><div class="mcol">' + left + '</div><div class="mcol">' + right + "</div></div>";
}

function catBody(p, s, feedback){
  const it = p.item;
  let rows = "";
  p.idisp.forEach(ii => {
    const row = it.items[ii];
    if (feedback) {
      const ok = s.draft.assign[ii] === row[1];
      rows += '<div class="catfb"><span class="grow">' + esc(row[0]) +
        '<span class="sub">Your bucket: ' + esc(it.categories[s.draft.assign[ii]] || "") +
        (ok ? "" : " / Correct: " + esc(it.categories[row[1]])) + "</span></span>" +
        (ok ? '<span class="mark ok">✓</span>' : '<span class="mark bad">✕</span>') + "</div>";
    } else {
      let btns = "";
      it.categories.forEach((c, ci) => {
        btns += '<button class="catbtn' + (s.draft.assign[ii] === ci ? " sel" : "") +
          '" data-action="cat" data-arg="' + ii + ":" + ci + '">' + esc(c) + "</button>";
      });
      rows += '<div class="catrow"><div class="cattext">' + esc(row[0]) + '</div><div class="catbtns">' + btns + "</div></div>";
    }
  });
  return rows;
}

function orderBody(p, s, feedback){
  const it = p.item;
  if (feedback) {
    let rows = "";
    it.steps.forEach((step, i) => {
      const user = s.draft.placed[i];
      const ok = user === i;
      rows += "<tr><td class=\"num\">" + (i + 1) + "</td><td>" + esc(it.steps[user] !== undefined ? it.steps[user] : "") +
        (ok ? "" : "<br><span class=\"sub\">Correct: " + esc(step) + "</span>") + "</td>" +
        '<td class="num">' + (ok ? '<span class="mark ok">✓</span>' : '<span class="mark bad">✕</span>') + "</td></tr>";
    });
    return '<div class="scrollx"><table><thead><tr><th class="num">#</th><th>Your order</th><th class="num"></th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }
  let pool = "", placed = "";
  p.pdisp.forEach(si => {
    if (s.draft.placed.indexOf(si) >= 0) return;
    pool += '<button class="step" data-action="order-add" data-arg="' + si + '"><span class="mbadge">·</span><span>' + esc(it.steps[si]) + "</span></button>";
  });
  s.draft.placed.forEach((si, k) => {
    placed += '<button class="step" data-action="order-remove" data-arg="' + si + '"><span class="mbadge">' + (k + 1) + "</span><span>" + esc(it.steps[si]) + "</span></button>";
  });
  return '<p class="kbdhint">Tap steps in order. Tap a placed step to send it back.</p>' +
    '<div class="orderwrap"><div><div class="ocolhd">Pool</div>' + (pool || "<p class=\"notep\">Empty.</p>") + "</div>" +
    '<div><div class="ocolhd">Your order</div>' + (placed || "<p class=\"notep\">Nothing placed yet.</p>") + "</div></div>";
}

function quizBody(p, s){
  const it = p.item;
  const feedback = s.phase === "feedback";
  let inputs = "";
  if (it.type === "single" || it.type === "multi") inputs = optionRows(p, s, feedback);
  else if (it.type === "match") inputs = matchBody(p, s, feedback);
  else if (it.type === "cat") inputs = catBody(p, s, feedback);
  else if (it.type === "order") inputs = orderBody(p, s, feedback);
  let html = '<p class="stem">' + esc(it.stem) + "</p>" +
    (it.type === "multi" && !feedback ? '<p class="kbdhint">Select all that apply.</p>' : "") + inputs;
  if (feedback) {
    const ok = s.responses[s.idx].correct;
    html += '<div class="verdict ' + (ok ? "ok" : "bad") + '">' + (ok ? "✓ Correct" : "✕ Not quite") + "</div>" +
      '<div class="explain"><span class="eyebrow">Why</span>' + esc(it.explain) + "</div>" +
      '<div class="btnrow"><button class="btn primary" data-action="next" data-primary>' +
      (s.idx + 1 < s.items.length ? "Next" : "Finish") + "</button></div>";
  } else {
    html += '<div class="btnrow"><button class="btn primary" data-action="submit" data-primary' +
      (draftComplete(p, s.draft) ? "" : " disabled") + ">Submit</button></div>";
  }
  return html;
}

function fillinBody(p, s){
  const it = p.item;
  if (s.phase === "feedback") {
    const resp = s.responses[s.idx];
    return '<p class="stem">' + esc(it.prompt) + "</p>" +
      '<div class="verdict ' + (resp.correct ? "ok" : "bad") + '">' + (resp.correct ? "✓ Correct" : "✕ Not it") + "</div>" +
      '<p class="notep">You wrote: <span class="mono">' + esc(resp.given || "(blank)") + "</span></p>" +
      '<div class="canonical">' + esc(it.answer) + "</div>" +
      (it.note ? '<p class="notep">' + esc(it.note) + "</p>" : "") +
      '<div class="btnrow"><button class="btn primary" data-action="next" data-primary>' +
      (s.idx + 1 < s.items.length ? "Next" : "Finish") + "</button>" +
      (!resp.correct && !resp.overridden ? '<button class="linkbtn" data-action="fillin-override">Count my answer as correct</button>' : "") +
      (resp.overridden ? '<span class="mono" style="font-size:12px;color:var(--accent)">Counted as correct.</span>' : "") +
      "</div>";
  }
  return '<p class="stem">' + esc(it.prompt) + "</p>" +
    '<input class="textinput" type="text" data-input="fillin" data-autofocus autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Type the term">' +
    '<div class="btnrow"><button class="btn primary" data-action="submit" data-primary>Submit</button></div>' +
    '<p class="kbdhint">Close variants and abbreviations count.</p>';
}

/* ---------- summary ---------- */
function summaryScreen(){
  const s = state.session;
  const right = s.responses.filter(r => r.correct || r.overridden).length;
  const total = s.items.length;
  let head, extra = "";
  if (s.mode === "test") {
    head = '<div class="hd"><div class="eyebrow">Cross-module test</div><h1>Test result</h1></div>';
    const by = {};
    s.items.forEach((p, i) => {
      const mid = p._mid;
      if (!by[mid]) by[mid] = { right: 0, total: 0 };
      by[mid].total++;
      if (s.responses[i].correct) by[mid].right++;
    });
    let rows = "";
    MODULES.forEach((m, i) => {
      if (!by[m.id]) return;
      rows += "<tr><td class=\"num\">" + pad2(i + 1) + "</td><td>" + esc(m.title) + '</td><td class="num">' + by[m.id].right + " / " + by[m.id].total + "</td></tr>";
    });
    extra = "<h2>By module</h2><div class=\"scrollx\"><table><thead><tr><th class=\"num\">#</th><th>Module</th><th class=\"num\">Score</th></tr></thead><tbody>" + rows + "</tbody></table></div>";
  } else {
    const m = modById(s.moduleId);
    head = moduleHd(m, s.mode);
  }
  let missed = "";
  s.items.forEach((p, i) => {
    const r = s.responses[i];
    if (r.correct || r.overridden) return;
    const it = p.item;
    missed += '<div class="missitem"><p class="stem">' + esc(it.stem || it.prompt) + "</p>" +
      (it.explain ? '<div class="explain"><span class="eyebrow">Why</span>' + esc(it.explain) + "</div>"
        : '<div class="canonical">' + esc(it.answer) + "</div>" + (it.note ? '<p class="notep">' + esc(it.note) + "</p>" : "")) +
      "</div>";
  });
  const missedIds = s.items.filter((p, i) => !s.responses[i].correct && !s.responses[i].overridden).map(p => p.item.id);
  let buttons = '<div class="btnrow">';
  if (s.mode === "quiz") {
    if (missedIds.length) buttons += '<button class="btn primary" data-action="retry-missed" data-primary>Retry missed only</button>';
    buttons += '<button class="btn" data-action="restart">Run the full quiz again</button><a class="btn" href="#/home">Today</a>';
  } else if (s.mode === "fillin") {
    buttons += '<button class="btn" data-action="restart">Run fill-in again</button><a class="btn" href="#/home">Today</a>';
  } else {
    buttons += '<button class="btn" data-action="restart">Take another test</button><a class="btn" href="#/progress">Progress</a>';
  }
  buttons += "</div>";
  return head +
    '<div class="scorebig">' + right + " / " + total + ' <span>(' + pct(total ? right / total : 0) + ")</span></div>" +
    buttons +
    (missed ? "<h2>Missed</h2><div class=\"misslist\">" + missed + "</div>" : "<p class=\"notep\">Nothing missed. Clean run.</p>") +
    extra;
}

/* ---------- short answer ---------- */
function shortScreen(mid){
  const m = modById(mid);
  if (!m) return modulesScreen();
  const s = state.session;
  if (s && s.mode === "short" && s.moduleId === mid) return selfGradeBody(m, m.short.find(x => x.id === s.promptId), "short");
  const rec = shortRec(mid);
  let rows = "";
  m.short.forEach((sp, i) => {
    const r = rec[sp.id];
    rows += "<tr><td class=\"num\">" + (i + 1) + "</td><td>" + esc(sp.prompt) + "</td>" +
      '<td class="num">' + (r ? (r.best + " / " + r.max) : "·") + "</td>" +
      '<td class="num"><button class="btn small" data-action="short-open" data-arg="' + sp.id + '">' + (r ? "Retry" : "Write") + "</button></td></tr>";
  });
  return moduleHd(m, "short") +
    '<div class="scrollx"><table><thead><tr><th class="num">#</th><th>Prompt</th><th class="num">Best</th><th class="num"></th></tr></thead><tbody>' +
    rows + "</tbody></table></div>";
}

function selfGradeBody(m, sp, kind){
  const s = state.session;
  const backHref = kind === "short" ? "#/short/" + m.id : "#/scenario";
  const head = kind === "short"
    ? moduleHd(m, "short")
    : '<div class="hd"><a class="backlink" href="#/scenario">&lt; All scenarios</a>' +
      '<div class="eyebrow" style="margin-top:14px">Scenario / ' + esc(m ? m.title : "") + "</div>" +
      "<h1>" + esc(sp.title || "Scenario") + "</h1></div>";
  const setup = sp.setup ? '<div class="setup">' + sp.setup + "</div>" : "";
  if (s.phase === "write") {
    return head + setup + '<p class="stem">' + esc(sp.prompt) + "</p>" +
      '<textarea class="textinput" data-input="grade-text" data-autofocus placeholder="Write it as you would say it on the desk."></textarea>' +
      '<div class="counter"><span id="charcount">0</span> chars</div>' +
      '<p class="kbdhint">Write first. You grade yourself against the rubric next.</p>' +
      '<div class="btnrow"><button class="btn primary" data-action="grade-reveal" id="revealbtn" disabled>Reveal model answer</button>' +
      '<a class="btn" href="' + backHref + '">Back</a></div>';
  }
  if (s.phase === "grade") {
    const score = s.checks.filter(Boolean).length;
    return head +
      '<div class="panelbox"><span class="eyebrow">Your response</span><div class="respbox">' + esc(s.text) + "</div></div>" +
      '<div class="panelbox"><span class="eyebrow">Model</span><div class="respbox">' + esc(sp.model) + "</div></div>" +
      "<h2>Grade yourself</h2><ul class=\"rubric\">" +
      sp.rubric.map((rp, i) =>
        "<li><label><input type=\"checkbox\" data-action-change=\"rubric\" data-arg=\"" + i + "\"" + (s.checks[i] ? " checked" : "") + ">" +
        "<span>" + esc(rp) + "</span></label></li>").join("") + "</ul>" +
      '<div class="scorebig" id="rubricscore">' + score + " / " + sp.rubric.length + "</div>" +
      '<div class="btnrow"><button class="btn primary" data-action="grade-save" data-primary>Save score</button></div>';
  }
  /* saved */
  const rec = kind === "short" ? shortRec(m.id)[sp.id] : RD.scenario[sp.id];
  return head +
    '<div class="verdict ok">✓ Saved</div>' +
    '<div class="scorebig">' + rec.last + " / " + rec.max + ' <span>best ' + rec.best + "</span></div>" +
    '<div class="btnrow">' +
    (kind === "short"
      ? '<button class="btn primary" data-action="short-back" data-primary>Back to prompts</button>'
      : '<a class="btn primary" href="#/scenario">All scenarios</a>') +
    "</div>";
}

/* ---------- scenarios ---------- */
function scenarioList(){
  let rows = "";
  SCENARIOS.forEach((sc, i) => {
    const m = modById(sc.moduleId);
    const rec = RD.scenario[sc.id];
    rows += '<li><a class="taskrow' + (rec ? " done" : "") + '" href="#/scenario/' + sc.id + '">' +
      '<span class="taskbox">' + (rec ? "✓" : "") + "</span>" +
      '<span class="taskmain"><b>' + esc(sc.title) + '</b><span class="taskkind">' + esc(m ? m.title : "") + "</span></span>" +
      (rec ? '<span class="taskscore">' + rec.best + "/" + rec.max + "</span>" : "") +
      "</a></li>";
  });
  return '<div class="hd"><div class="eyebrow">Long-form desk simulations</div><h1>Scenarios</h1>' +
    '<p class="tagline">Full situations: intake calls, screens, CVs with problems buried in them. Write your response, then grade yourself against the rubric.</p></div>' +

/* ============================================================
   ACTIONS
   ============================================================ */
function submitCurrent(){
  const s = state.session;
  const p = s.items[s.idx];
  if (s.mode === "fillin") {
    const inp = document.querySelector('[data-input="fillin"]');
    const given = inp ? inp.value : "";
    const ok = fillinMatch(given, p.item);
    s.responses[s.idx] = { correct: ok, given: given, overridden: false };
    const rec = fillinItemRec(s.moduleId, p.item.id);
    if (ok) rec.right++; else rec.wrong++;
    gradedEvent();
    s.phase = "feedback";
    render();
    return;
  }
  if (!draftComplete(p, s.draft)) return;
  const g = gradeItem(p, s.draft);
  s.responses[s.idx] = { correct: g.correct };
  if (s.mode === "quiz") {
    if (!g.correct) {
      const rec = quizRec(s.moduleId);
      rec.missed[p.item.id] = (rec.missed[p.item.id] || 0) + 1;
    }
    gradedEvent();
    s.phase = "feedback";
  } else { /* test: no feedback, advance */
    gradedEvent();
    advance();
    return;
  }
  render();
}

function advance(){
  const s = state.session;
  if (s.idx + 1 < s.items.length) {
    s.idx++;
    s.phase = "answer";
    s.draft = freshDraft(s.items[s.idx].item);
  } else {
    finishSession();
  }
  render();
  window.scrollTo(0, 0);
}

function finishSession(){
  const s = state.session;
  s.phase = "summary";
  const right = s.responses.filter(r => r.correct || r.overridden).length;
  const total = s.items.length;
  if (s.mode === "quiz" && s.full) {
    const rec = quizRec(s.moduleId);
    const score = total ? right / total : 0;
    rec.attempts++;
    rec.last = score;
    rec.best = Math.max(rec.best || 0, score);
    saveRD();
  }
  if (s.mode === "test") {
    const by = {};
    const missedIds = [];
    s.items.forEach((p, i) => {
      if (!by[p._mid]) by[p._mid] = { right: 0, total: 0 };
      by[p._mid].total++;
      if (s.responses[i].correct) by[p._mid].right++;
      else missedIds.push(p.item.id);
    });
    RD.test.history.push({ at: new Date().toISOString(), score: right, total: total, byModule: by, missedIds: missedIds });
    RD.test.history = RD.test.history.slice(-20);
    saveRD();
  }
}

const ACTIONS = {
  "learn-done": function(mid){
    RD.learn[mid] = { doneAt: new Date().toISOString() };
    gradedEvent();
    render();
  },
  /* Paging the reader scrolls back to the top, because landing halfway down the
     next section is disorienting on a phone. */
  "learn-next": function(){
    const p = state.learn; if (!p) return;
    const m = modById(p.mid); if (!m) return;
    if (p.idx < m.learn.sections.length) p.idx++;
    render(); window.scrollTo(0, 0);
  },
  "learn-prev": function(){
    const p = state.learn; if (!p) return;
    if (p.idx > 0) p.idx--;
    render(); window.scrollTo(0, 0);
  },
  "learn-jump": function(arg){
    const p = state.learn; if (!p) return;
    p.idx = parseInt(arg, 10) || 0;
    p.fast = false;
    render(); window.scrollTo(0, 0);
  },
  "learn-fast": function(){
    const p = state.learn; if (!p) return;
    p.fast = !p.fast;
    render(); window.scrollTo(0, 0);
  },
  /* A key term chip is a lookup, so send her to the Guide with the search
     already filled in rather than making her retype it. */
  "term": function(arg){
    state.guideQ = arg || "";
    state.guideTag = "all";
    go("#/guide");
  },
  "set-day": function(arg){
    RD.plan.day = parseInt(arg, 10) || 1;
    saveRD();
    render();
  },
  "guide-tag": function(arg){
    state.guideTag = arg || "all";
    render();
  },
  "opt": function(arg){
    const s = state.session;
    const p = s.items[s.idx];
    const oi = parseInt(arg, 10);
    if (p.item.type === "single") s.draft.sel = oi;
    else {
      const k = s.draft.sel.indexOf(oi);
      if (k >= 0) s.draft.sel.splice(k, 1); else s.draft.sel.push(oi);
    }
    render();
  },
  "match-left": function(arg){
    const s = state.session;
    const i = parseInt(arg, 10);
    if (s.draft.pairs[i] !== undefined) { delete s.draft.pairs[i]; s.draft.active = null; }
    else s.draft.active = (s.draft.active === i) ? null : i;
    render();
  },
  "match-right": function(arg){
    const s = state.session;
    const ri = parseInt(arg, 10);
    for (const k in s.draft.pairs) if (s.draft.pairs[k] === ri) { delete s.draft.pairs[k]; s.draft.active = null; render(); return; }
    if (s.draft.active === null) return;
    s.draft.pairs[s.draft.active] = ri;
    s.draft.active = null;
    render();
  },
  "cat": function(arg){
    const s = state.session;
    const bits = arg.split(":");
    s.draft.assign[parseInt(bits[0], 10)] = parseInt(bits[1], 10);
    render();
  },
  "order-add": function(arg){
    const s = state.session;
    s.draft.placed.push(parseInt(arg, 10));
    render();
  },
  "order-remove": function(arg){
    const s = state.session;
    const si = parseInt(arg, 10);
    const k = s.draft.placed.indexOf(si);
    if (k >= 0) s.draft.placed.splice(k, 1);
    render();
  },
  "submit": function(){ submitCurrent(); },
  "next": function(){ advance(); },
  "fillin-override": function(){
    const s = state.session;
    const p = s.items[s.idx];
    const resp = s.responses[s.idx];
    if (resp.correct || resp.overridden) return;
    resp.overridden = true;
    const rec = fillinItemRec(s.moduleId, p.item.id);
    rec.wrong = Math.max(0, rec.wrong - 1);
    rec.right++;
    saveRD();
    render();
  },
  "retry-missed": function(){
    const s = state.session;
    const missedIds = s.items.filter((p, i) => !s.responses[i].correct).map(p => p.item.id);
    startQuiz(s.moduleId, missedIds);
    render();
  },
  "restart": function(){
    const s = state.session;
    if (s.mode === "quiz") startQuiz(s.moduleId, null);
    else if (s.mode === "fillin") startFillin(s.moduleId);
    else startTest();
    render();
  },
  "short-open": function(pid){
    const mid = state.route.arg;
    state.session = { mode: "short", moduleId: mid, promptId: pid, phase: "write", text: "",
      checks: modById(mid).short.find(x => x.id === pid).rubric.map(() => false) };
    render();
  },
  "short-back": function(){ state.session = null; render(); },
  "grade-reveal": function(){
    const s = state.session;
    const ta = document.querySelector('[data-input="grade-text"]');
    s.text = ta ? ta.value : s.text;
    if (!s.text.trim()) return;
    s.phase = "grade";
    render();
    window.scrollTo(0, 0);
  },
  "grade-save": function(){
    const s = state.session;
    const score = s.checks.filter(Boolean).length;
    if (s.mode === "short") {
      const sp = modById(s.moduleId).short.find(x => x.id === s.promptId);
      const rec = shortRec(s.moduleId);
      const old = rec[s.promptId];
      rec[s.promptId] = {
        best: Math.max(old ? old.best : 0, score),
        last: score, max: sp.rubric.length,
        at: new Date().toISOString(),
        response: s.text.slice(0, 5000)
      };
    } else {
      const sc = SCENARIOS.find(x => x.id === s.scenarioId);
      const old = RD.scenario[sc.id];
      RD.scenario[sc.id] = {
        best: Math.max(old ? old.best : 0, score),
        last: score, max: sc.rubric.length,
        at: new Date().toISOString(),
        response: s.text.slice(0, 5000)
      };
    }
    gradedEvent();
    s.phase = "saved";
    render();
  },
  "reset-all": function(){
    if (!confirm("Delete all saved progress, scores, and streak? This cannot be undone.")) return;
    RD = defaultRD();
    flushRD();
    render();
  }
};

document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.getAttribute("data-action")];
  if (fn) fn(el.getAttribute("data-arg"));
});

document.addEventListener("change", function(e){
  const el = e.target.closest("[data-action-change]");
  if (!el) return;
  if (el.getAttribute("data-action-change") === "rubric") {
    const s = state.session;
    s.checks[parseInt(el.getAttribute("data-arg"), 10)] = el.checked;
    const scoreEl = document.getElementById("rubricscore");
    if (scoreEl) scoreEl.textContent = s.checks.filter(Boolean).length + " / " + s.checks.length;
  }
});

document.addEventListener("input", function(e){
  const el = e.target;
  if (!el.hasAttribute || !el.hasAttribute("data-input")) return;
  const kind = el.getAttribute("data-input");
  if (kind === "grade-text") {
    const s = state.session;
    if (s) s.text = el.value;
    const c = document.getElementById("charcount");
    if (c) c.textContent = String(el.value.length);
    const btn = document.getElementById("revealbtn");
    if (btn) btn.disabled = !el.value.trim();
  } else if (kind === "guide-search") {
    state.guideQ = el.value;
    const box = document.getElementById("guideresults");
    if (box) box.innerHTML = guideEntriesHTML();
  }
});

document.addEventListener("keydown", function(e){
  const s = state.session;
  const tag = e.target.tagName;
  if (tag === "TEXTAREA") return;
  if (tag === "INPUT" && (e.target.type === "text" || e.target.type === "search")) {
    if (e.key === "Enter" && e.target.getAttribute("data-input") === "fillin") { e.preventDefault(); submitCurrent(); }
    return;
  }
  if (e.key === "Enter") {
    const btn = document.querySelector("[data-primary]");
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
    return;
  }
  if (!s || s.phase !== "answer") return;
  if (s.mode !== "quiz" && s.mode !== "test") return;
  const p = s.items[s.idx];
  if (p.item.type !== "single" && p.item.type !== "multi") return;
  const n = parseInt(e.key, 10);
  if (!(n >= 1 && n <= 9)) return;
  const di = n - 1;
  if (di >= p.disp.length) return;
  ACTIONS["opt"](String(p.disp[di]));
});

/* ============================================================
   SECTION 5: SELFTEST
   ============================================================ */
const ST_IND = { answer: "IND", accept: ["investigational new drug", "investigational new drug application"] };
const ST_PV = { answer: "pharmacovigilance", accept: ["drug safety", "PV"] };
const ST_SAE = { answer: "SAE", accept: ["serious adverse event"] };
const ST_DSMB = { answer: "DSMB", accept: ["data safety monitoring board", "data monitoring committee", "DMC"] };
const ST_ORR = { answer: "ORR", accept: ["objective response rate", "overall response rate"] };
const ST_PK = { answer: "pharmacokinetics", accept: ["PK"] };
const ST_BLA = { answer: "BLA", accept: ["biologics license application"] };
const ST_CRO = { answer: "CRO", accept: ["contract research organization"] };

const SELFTEST_VECTORS = [
  ["IND", ST_IND, true],
  ["i.n.d.", ST_IND, true],
  ["the ind", ST_IND, true],
  ["investigational new drug", ST_IND, true],
  ["serious adverse event", ST_SAE, true],
  ["s a e", ST_SAE, true],
  ["data monitoring committee", ST_DSMB, true],
  ["DMC", ST_DSMB, true],
  ["overall response rate", ST_ORR, true],
  ["drug safety", ST_PV, true],
  ["pharmacokinetcs", ST_PK, true],
  ["AE", ST_SAE, false],
  ["NDA", ST_BLA, false],
  ["CRA", ST_CRO, false],
  ["PFS", ST_ORR, false]
];

function runSelftest(){
  return SELFTEST_VECTORS.map(v => {
    const got = fillinMatch(v[0], v[1]);
    return { input: v[0], against: v[1].answer, expected: v[2], got: got, pass: got === v[2] };
  });
}

function selftestScreen(){
  const results = runSelftest();
  const allPass = results.every(r => r.pass);
  results.forEach(r => console.log("[selftest]", r.pass ? "PASS" : "FAIL", JSON.stringify(r.input), "vs", r.against, "expected", r.expected, "got", r.got));
  let rows = "";
  results.forEach(r => {
    rows += "<tr><td class=\"mono\">" + esc(r.input) + "</td><td class=\"mono\">" + esc(r.against) + "</td>" +
      '<td class="num">' + (r.expected ? "pass" : "fail") + "</td>" +
      '<td class="num">' + (r.pass ? '<span class="stpass">✓ OK</span>' : '<span class="stfail">✕ BROKEN</span>') + "</td></tr>";
  });
  return '<div class="hd"><div class="eyebrow">Matcher self-test</div><h1>' + (allPass ? "All vectors hold" : "Vectors broken") + "</h1></div>" +
    '<div class="scrollx"><table><thead><tr><th>Input</th><th>Against</th><th class="num">Should</th><th class="num">Result</th></tr></thead><tbody>' +
    rows + "</tbody></table></div>";
}

if (RD.dev) runSelftest();

    String(e && e.message || e).replace(/[<>&]/g, " ") + '. Tell Claude this exact message.</div>';
  throw e;
}

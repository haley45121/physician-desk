MODULES.push({
  id: "m07",
  title: "Clinical Operations",
  tagline: "The physician decides; operations executes that decision across 120 sites",

  learn: {
    sections: [
      { heading: "Deciding versus executing",
        point: "The physician decides what happens to a patient and operations decides how that reaches 120 sites on time and on budget, and confusing the two produces bad job specs.",
        html: "<p>Clinical operations is the function that turns a medical decision into an executed action at every site in a study. Hold this picture and you will never confuse the two worlds again: a Medical Director decides whether a patient with a rising liver value stays on drug. <dfn>Clinical operations</dfn> figures out how that decision reaches 120 sites in nine countries, gets documented in the right place, gets monitored, and lands correctly in the database. Same trial, two different jobs.</p>" +
        "<p>At the top sits the <dfn>Head of Clinical Operations</dfn> or <dfn>VP Clinical Operations</dfn>, who owns execution across the portfolio: study timelines, enrollment delivery, budgets, vendor selection, and the people who run studies. She partners with the <dfn>VP Clinical Development</dfn> and the CMO on a split that is clean when it works. Development owns what the study is asking, what the protocol requires, and what the data mean. Operations owns whether the study is on time, on budget, and clean. When the split is respected, the program moves. When it is not, you get a physician doing project management or an operations lead making medical calls, and both are hiring events waiting to happen.</p>" +
        "<p>One structural question sets the shape of the whole operations organization: the <dfn>outsourcing model</dfn>. Under <dfn>full service outsourcing</dfn> the sponsor hands the study to a CRO and keeps a thin oversight layer. Under an <dfn>FSP</dfn> model, functional service provider, the sponsor rents monitors or data managers into its own process and keeps control of it. Some sponsors insource almost everything. Ask which model a client runs on every intake call. A sponsor moving from full service to FSP is about to hire a stack of people, and a physician who spent three years chasing a CRO through a thin oversight layer is a candidate.</p>" },

      { heading: "The study team, and the CTM versus CPM question",
        point: "Operations titles are not standardized across company sizes, so screen on sites run, countries covered, enrollment owned, and what the person escalated versus decided.",
        html: "<p>A study is run by a small standing group that meets every week. The typical seats: a study lead from operations, the Medical Director or <dfn>Medical Monitor</dfn> for medical judgment, a clinical scientist, a data manager, a biostatistician, a safety or pharmacovigilance representative, a regulatory lead, a clinical supply lead, and the vendor counterparts from the CRO or the central lab. The physician is one voice at that table, usually the most senior one on medicine and the least involved in logistics.</p>" +
        "<p>The <dfn>Clinical Trial Manager</dfn>, CTM, owns one study end to end on the operations side: site selection and activation, vendor timelines, enrollment tracking, the study budget, protocol deviations, and the escalations that come up daily. If you want to know why a trial is behind, the CTM is the person who actually knows. The <dfn>Clinical Project Manager</dfn> or Clinical Program Manager, CPM, is usually a level up or a level sideways: cross-study or program-level ownership, budget and vendor governance across several trials, and the interface with the program team.</p>" +
        "<p>Now the honest part. These titles are not standardized. At a large sponsor a CPM may sit above several CTMs. At a 60 person biotech the same person is both, plus the vendor manager, plus the one who books the investigator meeting. Do not screen on the title. Screen on the questions that survive company size: how many sites and countries did you personally run, what was your enrollment target against actual, and what did you escalate to the medical side and what did you decide yourself. That last question tells you whether you are talking to an owner or a coordinator, and it works at any company.</p>" },

      { heading: "The site-facing layer: CRAs and CTAs",
        point: "CRAs verify site data against the original records and the CRO to sponsor move is the standard operations career step, which is why insourcing always generates hiring.",
        html: "<p>Between the sponsor and the hospital sits the <dfn>Clinical Research Associate</dfn>, the CRA, and this is one of the most recruited jobs in the industry. A CRA visits sites, checks that consent was obtained properly, verifies that the data entered in the database match the original hospital records, counts the drug supply, and documents protocol deviations. The check against the original records is <dfn>source data verification</dfn>, SDV, and most sponsors now run <dfn>risk-based monitoring</dfn>, verifying a targeted sample of critical data rather than every field, because full verification of everything is expensive and catches little.</p>" +
        "<p>The split that matters for her: an in-house CRA works for the sponsor and monitors the sponsor's own studies, usually with more program context and a bit less travel churn. A <dfn>CRO</dfn> CRA works for the vendor and may cover several sponsors, which builds breadth fast and burns people out just as fast. The CRO to sponsor move is the most common career step in operations, and it is why a sponsor bringing monitoring in-house always generates hiring.</p>" +
        "<p>Below the CRA is the <dfn>Clinical Trial Associate</dfn>, CTA, the entry rung. A CTA keeps the <dfn>trial master file</dfn> complete, chases site regulatory documents, maintains trackers, and supports study meetings. It is administrative in the way that a paralegal is administrative: unglamorous, and the study fails an inspection without it. Nobody will hire her to fill a CTA seat and she should not chase it. She needs to recognize the title so that when a Medical Director says his study team was thin, she knows what was missing at the bottom.</p>" },

      { heading: "The clinical scientist, the neighbor who gets miscategorized",
        point: "A clinical scientist can know the molecule better than any physician on the team and still cannot sign an eligibility or causality call, so place him in clinical science, not a Medical Director seat.",
        html: "<p>Learn this role properly, because it is the closest non-physician neighbor to a Medical Director and candidates land in the wrong pile constantly. A <dfn>clinical scientist</dfn> sits inside clinical development, not operations. Typical credential is a PhD, PharmD, or a masters plus years of trial work. The job: draft the scientific sections of the protocol, write and defend the eligibility criteria, review the emerging clinical data for scientific signals, answer scientific questions from investigators, build materials for advisory boards and the <dfn>DSMB</dfn>, and draft large parts of the clinical study report and the investigator brochure.</p>" +
        "<p>What a clinical scientist does not do: make the medical judgment call. Whether a specific patient continues dosing, whether a serious adverse event is related to the drug, whether a borderline patient can be enrolled anyway, those are physician decisions with a signature attached. On eligibility the physician's ruling is almost always no, because enrolling outside the criteria is a protocol deviation rather than a routine call, and a true waiver is a documented exception nobody wants on the record. A strong clinical scientist may know the molecule better than any physician on the team, and still cannot sign that line.</p>" +
        "<p>Where it goes wrong: at small biotechs the title wall breaks down. A PhD clinical scientist with ten years on one asset gets promoted to Director or even Senior Director of Clinical Development, and now her keyword search returns him for a Medical Director role. He is not a fraud and he is not a fit for a seat that requires medical sign-off. Read three things on the resume: the credential, whether the person has ever made a dose or eligibility decision, and whether the title came from a company small enough to hand out titles instead of money. Then place him where he actually wins, which is a clinical science seat, often at more money than he is on now, and tell the client honestly why he is not the physician they asked for.</p>" },

      { heading: "Data management and biostatistics",
        point: "The analysis plan is locked before the database is, so ask any physician whether a positive result was the pre-specified primary analysis or something found afterward.",
        html: "<p>These two functions decide whether the trial produces a usable answer, and neither reports to the physician. Data management builds the study database in an <dfn>EDC</dfn> system, electronic data capture, and drives the <dfn>query</dfn> process, sending every inconsistency back to the site as a question that must be answered before the data are clean. That work ends at <dfn>database lock</dfn>, where the data are declared final and frozen and only then does the treatment assignment get unblinded to the analysis team.</p>" +
        "<p>The <dfn>biostatistician</dfn> owns the arithmetic. He sets the sample size, builds the randomization scheme, and writes the <dfn>statistical analysis plan</dfn>, the SAP, which fixes in advance exactly how the primary endpoint will be analyzed. The SAP is finalized before lock precisely so nobody can pick the analysis that flatters the drug.</p>" +
        "<p>This is why a physician cannot read a readout alone. The clinical question, does this drug help patients, is his; whether the number in front of him is the pre-specified primary analysis or a favorable subgroup found afterward is a statistical call. The physicians she will place know this and say so. The ones who talk as though the statistician is a service function are telling her something about how they work.</p>" },

      { heading: "How the team runs, and where the friction becomes a search",
        point: "Enrollment failure, an outsourcing model change, a leadership reorganization, and a deprioritized program are four complaints you can hear on a call and convert into a search.",
        html: "<p>The rhythm is the weekly study team meeting: enrollment against plan site by site, open protocol deviations, safety events since the last meeting, data cleaning status, vendor issues, upcoming milestones. Escalation runs on defined paths. A site question about whether a borderline patient qualifies goes to the Medical Director or Medical Monitor, not to the CTM. A serious adverse event goes to safety on a clock and then to the physician for a causality assessment. A site that has not enrolled in four months goes to the CTM and then to the head of operations. A slipping database lock goes to data management and the program team.</p>" +
        "<p>The handoffs that go wrong are predictable. A physician grants eligibility waivers one at a time by email, and six months later the trial population no longer matches the protocol. A physician rewrites eligibility criteria to fix enrollment without anyone costing the <dfn>protocol amendment</dfn>, which means re-consenting patients and re-approving at every site. Operations builds a timeline the medical lead never agreed was feasible, then treats his objections as obstruction. In every case the physician is the one who calls a recruiter, because the work stopped being medicine.</p>" +
        "<p>Four friction patterns are hiring events she can act on. First, enrollment failure: a trial far behind plan produces protocol amendments, added sites, blame, and turnover on both the operations and the medical side. Second, a CRO relationship breaking down or an outsourcing model change, which creates a hiring wave inside the sponsor and shakes loose people at the vendor. Third, a reorganization, especially a new CMO or new VP Clinical Operations, since new leaders bring their own people and the incumbents start listening. Fourth, a program deprioritized: the physicians on that asset are suddenly available and nobody has told the market yet. Her job is to hear one of these in a call and ask the next question, not to nod politely.</p>" }
    ],
    checklist: [
      "Split any job spec into the medical decision and the operational execution before sourcing a name",
      "Name the study team seats a Medical Director works with every week",
      "Tell a clinical scientist from a Medical Director on a resume in under a minute",
      "Ask which outsourcing model a client runs, full service or FSP, on every intake call",
      "Turn an enrollment, CRO, or reorganization complaint into a specific search question",
      "Explain in one line why a physician cannot interpret a readout without biostatistics"
    ]
  },

      prompt: "Say it out loud as the recruiter. A VP Clinical Development says his Phase III is badly behind on enrollment and the CRO is not delivering. You do not run trials and never will. Turn the complaint into a search conversation.",

MODULES.push({
  id: "m08",
  title: "Oncology First",
  tagline: "The tumor, the line, the biomarker, and the endpoints that decide a program",

  learn: {
    sections: [
      { heading: "Solid tumors and hematologic malignancies",
        point: "Solid tumor and heme are a real career boundary in training, response measurement, and investigator networks, so ask which one before you ask anything else.",
        html: "<p>The first fork in any oncology conversation. <dfn>Solid tumors</dfn> are cancers that form a mass in an organ: lung, breast, colorectal, prostate, pancreatic, melanoma, and the rest. <dfn>Hematologic malignancies</dfn>, heme for short, are cancers of the blood and immune system: the leukemias, the lymphomas, and multiple myeloma. Ask which one a client is working in before you ask anything else, because the answer sorts the entire candidate universe.</p>" +
        "<p>This is a real career boundary, not a technicality. The physicians are trained differently: heme programs want a hematologist or a hematologist-oncologist, often with stem cell transplant or cell therapy exposure. The diseases are measured differently: a solid tumor is measured on scans, while heme response is judged on marrow, blood counts, imaging in lymphoma, and increasingly <dfn>MRD</dfn>, measurable residual disease, which is disease detected below the level a microscope can see. The investigator networks barely overlap, and a heme trial runs at a different set of academic centers than a lung cancer trial.</p>" +
        "<p>So when a client running a myeloma program says no solid tumor people, that is usually a defensible position rather than snobbery. Her move is not to argue the boundary away, it is to know when the bridge is real. A physician who ran a bispecific antibody in lymphoma has managed the same toxicity profile a myeloma bispecific will produce. A checkpoint inhibitor physician from melanoma has not. Within solid tumors the boundaries are softer but still live: lung, breast, and gastrointestinal each have their own investigator community, their own standard of care, and their own competitive field, and a client in lung cancer will notice immediately if a candidate has never worked it.</p>" },

      { heading: "Stage, standard of care, and line of therapy",
        point: "New drugs start in late-line patients where the bar is low and work backward toward first line, so line of therapy tells you where a program sits in its life.",
        html: "<p>Cancer is described by how far it has spread. <dfn>Staging</dfn> runs roughly from stage I, local disease, to stage IV, <dfn>metastatic</dfn> disease that has spread to distant organs. The clinical detail behind it is the <dfn>TNM</dfn> system, tumor size, node involvement, metastasis, which she needs at name-recognition level only. Two words attach to surgery: <dfn>adjuvant</dfn> treatment is given after surgery to prevent recurrence, and <dfn>neoadjuvant</dfn> is given before surgery to shrink the tumor first. Most new drugs start in metastatic disease and move earlier over time, and adjuvant trials are famously long because you are waiting to see recurrences that may never happen.</p>" +
        "<p><dfn>Standard of care</dfn> is what a patient with this disease would receive today outside a trial. It is the benchmark a new drug has to beat, the comparator arm in a randomized study, and the reason placebo-controlled trials are usually unethical in cancer: you compare against the best available treatment, or you add your drug on top of it.</p>" +
        "<p><dfn>Line of therapy</dfn> is the phrase that appears in nearly every oncology trial description. <dfn>First line</dfn> is the initial treatment a newly diagnosed patient receives. <dfn>Second line</dfn> is what comes after the first regimen stops working. <dfn>Relapsed or refractory</dfn>, written as relapsed/refractory, means the disease came back after responding or never responded at all, and those patients have usually already had several regimens. New agents almost always begin in the late-line, heavily pretreated setting where there is no good option and the bar is low, then work backward toward first line where the money and the risk both live. When she reads a synopsis that says patients must have progressed on at least two prior lines, she is looking at an early program taking its first real shot.</p>" },

      { heading: "Biomarkers and patient selection",
        point: "Selecting for a biomarker buys a higher response rate with harder logistics: more sites, heavy screening, a companion diagnostic, and screen failure rates the physician talks about constantly.",
        html: "<p>Modern oncology mostly does not treat a tumor by organ alone; it treats a molecular feature. A <dfn>biomarker</dfn> is a measurable characteristic of the tumor or patient that predicts who will benefit. The names she will hear repeatedly: HER2 in breast and gastric cancer, EGFR and ALK in lung cancer, BRAF in melanoma, KRAS G12C in lung and colorectal, PD-L1 expression across many tumors, and MSI-high or mismatch repair deficiency as a tumor-agnostic marker.</p>" +
        "<p>A <dfn>biomarker-positive</dfn> population is a trial that only enrolls patients whose tumors carry the feature. To find them you need a test, and when a test is developed alongside the drug and approved with it as the required screening tool, that is a <dfn>companion diagnostic</dfn>, sometimes written CDx. Name recognition is enough here. She needs to know the term exists and that it means the drug and the test ship together.</p>" +
        "<p>Patient selection changes trial economics in every direction at once, and this is worth understanding because it explains half of what a client complains about. Selecting for a biomarker raises the expected response rate, sometimes dramatically, which is why a small single-arm study can produce a convincing result. It also means you must screen many patients to enroll one, so the trial needs more sites, longer timelines, and a screening budget that surprises everyone. If the marker appears in only a small share of the disease, the eligible population may be scattered across a lot of geography. That is why biomarker-driven programs run heavy on sites and heavy on operations friction, and why the physicians who run them talk about screen failure rates the way other people talk about weather.</p>" },

      { heading: "The modality families",
        point: "Each modality family carries a signature toxicity, and that shared toxicity is the honest bridge you argue when moving a physician between modalities.",
        html: "<p><dfn>Immuno-oncology</dfn>, IO, means drugs that direct the patient's own immune system against the tumor. The dominant class is the <dfn>checkpoint inhibitor</dfn>, antibodies against PD-1, PD-L1, or CTLA-4 that release the brakes cancer uses to hide from immune cells. The signature clinical issue is <dfn>immune-related adverse events</dfn>, autoimmune-style toxicity in the skin, gut, liver, lungs, or endocrine organs, which physicians manage with steroids and dose interruption. Most new IO programs are combinations, because single-agent checkpoint therapy is now standard of care in many settings.</p>" +
        "<p><dfn>Targeted small molecules</dfn> are pills that block a specific mutated protein driving the tumor, most often a kinase. They are tied to biomarkers by definition, they produce fast deep responses, and their story is always resistance: the tumor eventually finds a way around the block, so the field runs on next-generation inhibitors that cover the resistance mutations. In lung cancer, whether a drug reaches the brain matters, since metastases there are common.</p>" +
        "<p><dfn>Antibody-drug conjugates</dfn>, ADCs, are an antibody that finds a target on the tumor cell, a linker, and a cytotoxic payload: chemotherapy delivered to an address rather than sprayed everywhere. They have been the hottest modality in oncology for several years. Toxicity depends on the payload, and the classes she will hear named are lung inflammation, ocular effects, and peripheral neuropathy, depending on the drug.</p>" +
        "<p><dfn>Cell therapy</dfn>, chiefly <dfn>CAR-T</dfn>, takes a patient's T cells, engineers them to recognize a tumor target, and infuses them back. It is mostly a heme story so far. It brings its own vocabulary: apheresis to collect the cells, lymphodepletion before infusion, manufacturing turnaround time, and a limited network of certified treatment centers. The two toxicities every cell therapy physician manages are <dfn>cytokine release syndrome</dfn>, CRS, a systemic inflammatory reaction, and neurologic toxicity known as ICANS.</p>" +
        "<p><dfn>Bispecific antibodies</dfn> grab a tumor target with one arm and a T cell with the other, pulling the immune cell to the tumor. Same biology as CAR-T without the manufacturing, which is why they are called off-the-shelf. They produce CRS too, which is why programs use step-up dosing and close monitoring early in treatment, and it is why a bispecific physician is a legitimate candidate for a cell therapy program.</p>" },

      { heading: "The endpoints, and why regulators weigh them differently",
        point: "Response endpoints count patients and survival endpoints count time; regulators trust overall survival most because death cannot be argued with, and a high response rate with short duration is a program in trouble.",
        diagram: "<svg viewBox=\"0 0 520 190\" role=\"img\" aria-label=\"Oncology endpoints ordered by how quickly they read out, from response rate to overall survival\"><text x=\"14\" y=\"20\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8.5\" letter-spacing=\"1.4\" fill=\"#8a8172\">HOW SOON IT READS OUT</text><line x1=\"14\" y1=\"34\" x2=\"506\" y2=\"34\" stroke=\"rgba(42,38,32,0.22)\"/><rect x=\"14\" y=\"46\" width=\"130\" height=\"34\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"#8b4513\"/><text x=\"79\" y=\"62\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#8b4513\">ORR</text><text x=\"79\" y=\"74\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">complete plus partial</text><rect x=\"14\" y=\"88\" width=\"270\" height=\"34\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"149\" y=\"104\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">PFS</text><text x=\"149\" y=\"116\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">until it worsens or she dies</text><rect x=\"14\" y=\"130\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"234\" y=\"146\" text-anchor=\"middle\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"11\" font-weight=\"600\" fill=\"#2a2620\">OS</text><text x=\"234\" y=\"158\" text-anchor=\"middle\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">until death from any cause</text><text x=\"466\" y=\"151\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8b4513\">trusted</text><text x=\"466\" y=\"161\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8b4513\">most</text><text x=\"14\" y=\"182\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8a8172\">Faster to read out means easier to fund and easier to argue with. Regulators trade speed for certainty.</text></svg><figcaption>Response reads out first, survival reads out last</figcaption>",
        html: "<p>This is the highest-value vocabulary on the desk. Response endpoints are counted as a share of patients. A <dfn>complete response</dfn>, CR, means the tumor is gone by the measurement used. A <dfn>partial response</dfn>, PR, means it shrank past a defined threshold, commonly around 30 percent by the standard solid tumor criteria. <dfn>Objective response rate</dfn>, ORR, also called overall response rate and both forms are accepted in the field, is the share of patients with a complete or partial response, and it carries single-arm early studies because it is fast and needs no control arm. <dfn>Disease control rate</dfn>, DCR, adds the patients whose disease simply held steady, which is a softer number and easier to inflate. <dfn>Duration of response</dfn>, DoR, is how long the responses lasted in the patients who responded, and it is the number that separates a real drug from a brief tumor shrinkage. A high ORR with a short DoR is a program in trouble.</p>" +
        "<p>Time-to-event endpoints are measured as a length of time. <dfn>Progression free survival</dfn>, PFS, is the time from randomization until the disease worsens or the patient dies, whichever comes first. <dfn>Overall survival</dfn>, OS, is the time from randomization until death from any cause. Both are reported as a median and a <dfn>hazard ratio</dfn>, the relative risk against the control arm.</p>" +
        "<p>Why a regulator prefers OS: death from any cause is unambiguous, and it does not depend on how often scans are read or on who judged whether a lesion grew. PFS reads out faster and takes fewer patients, which is why sponsors love it, but it depends on the imaging schedule, the reader, and the progression criteria, usually <dfn>RECIST</dfn>, the response evaluation criteria for solid tumors, which she needs only by name. OS is also harder to show cleanly because patients cross over to the effective drug afterward and go on to other therapies that dilute the difference.</p>" +
        "<p>That tension is the reason <dfn>accelerated approval</dfn> exists. A drug can be approved on a surrogate endpoint, usually ORR with a supporting DoR, that is reasonably likely to predict clinical benefit, on the condition that a confirmatory randomized trial proves real benefit on PFS or OS. If that trial fails or never runs, the approval can be withdrawn, and regulators have grown firmer about wanting it underway at the time of approval. When a client says accelerated approval, her two questions are how durable the responses are and whether the confirmatory trial is designed and enrolling, because that trial is the next hiring wave.</p>" },

      { heading: "Why oncology owns physician hiring, and the areas next to it",
        point: "Volume, competitive intensity, and a permanently short supply of oncologists willing to leave practice are why oncology is the desk, with rare disease, neurology, and immunology next to it.",
        html: "<p>Oncology is the largest single share of clinical-stage drug development, commonly cited as somewhere near a third of the industry pipeline and a larger share of early-stage programs. Three things follow. First, sheer volume: more programs means more Medical Director and Medical Monitor seats than any other therapeutic area, and it is why oncology is her first area rather than an eventual one. Second, competitive intensity: a dozen companies chase the same target and the same investigators, so speed matters and clients will pay for a physician who already knows the disease and the sites. Third, scarcity: the trial physician has to be an oncologist, oncologists are in demand clinically, and most of them like treating patients, so the pool willing to leave practice for industry is small and permanently oversubscribed. That combination is the whole reason her desk exists.</p>" +
        "<p><dfn>Rare disease</dfn> is the second area she will meet. Tiny patient populations, often pediatric, often genetic. Trials are small, sometimes single-arm out of necessity, endpoints are frequently functional measures rather than survival, and the physicians are scarce because the disease itself is scarce. Hiring there rewards anyone who has actually run a trial in the specific condition, and the personal connection to the disease community is a real motivator in a way it is not elsewhere.</p>" +
        "<p><dfn>Neurology</dfn> covers a long list from Alzheimer's disease and Parkinson's to multiple sclerosis, epilepsy, ALS, and migraine. The defining problem is measurement: endpoints are often rating scales judged by a clinician, which are noisy, slow, and heavily debated, so trials are long and expensive and the failure history is brutal. Clients want neurologists with experience on the specific scale and disease, and they are rare.</p>" +
        "<p><dfn>Immunology</dfn> and inflammation covers rheumatoid arthritis, psoriasis, inflammatory bowel disease, lupus, and asthma. Large populations, established standard of care, and a crowded field of approved biologics, which means new drugs must beat a high bar and trials are big. Physicians come from rheumatology, dermatology, gastroenterology, and pulmonology, so the candidate pool is broader than oncology, and the competition is commercial rather than existential.</p>" }
    ],
    checklist: [
      "Ask solid tumor or hematologic malignancy in the first two minutes of any oncology intake",
      "Read a trial synopsis for line of therapy and say where the program sits in its life",
      "Name the modality family and the toxicity the physician will spend his time managing",
      "Explain progression free survival versus overall survival and why a regulator prefers the second",
      "Hear accelerated approval and ask about duration of response and the confirmatory trial",
      "Argue an adjacent-modality transfer using tumor type, line, and toxicity as the bridge"
    ]
  },

    { id: "m08s01",

MODULES.push({
  id: "m09",
  title: "Reading the Physician CV",
  tagline: "Pick up any physician CV cold and say three true things about it inside two minutes",

  learn: {
    sections: [
      { heading: "The credential line, decoded",
        point: "Degree, residency, fellowship, boards, and licensure are a ten-second read, and the only one worth a fight is whether the client's licensure requirement is load-bearing for the seat.",
        html: "<p>The top of a physician CV is a ten-second read once you know the parts. <dfn>MD</dfn> and <dfn>DO</dfn> are both fully licensed physicians and industry treats them as equivalent; a client who balks at a DO is expressing a preference worth surfacing, not citing a rule. <dfn>MD/PhD</dfn> marks a research-native physician, often deeper on mechanism and translational science than on running large operations, which is a feature on an early-development search and a question mark on a Phase 3 machine. <dfn>MBBS</dfn> is the standard medical degree in the UK, India, Australia, and much of the world, equivalent to the MD. Its holder is a <dfn>foreign medical graduate</dfn>, FMG on some forms, IMG on others; some completed a second residency in the US, some never trained here at all, and the difference only matters when the client requires US training or licensure, so establish that requirement on the intake, not at offer.</p>" +
        "<p><dfn>Residency</dfn> is specialty training: internal medicine, pediatrics, neurology. <dfn>Fellowship</dfn> is the subspecialty layered on top: oncology, cardiology, endocrinology. The fellowship usually predicts which therapeutic areas the physician can credibly lead, and clients read it that way even when they do not say so.</p>" +
        "<p><dfn>Board certification</dfn> means passing the specialty boards after training. Early in an industry career it is a real signal. Ten years in, a lapsed certification is common, because maintenance requires an active unrestricted license plus periodic assessment and points on a cycle, and many physicians let all of that go once they stop seeing patients. Note what maintenance does not require: clinical practice hours. Plenty of industry oncologists and internists keep their boards current from a development seat, so a lapse tells you what this physician chose, not what the job forced. Treat lapsed boards as a probe, not a verdict, and make the real question whether the client's board-certification requirement is load-bearing for the seat. Some clients hard-require current boards, and some sponsors require <dfn>active licensure</dfn> for anyone named as <dfn>medical monitor</dfn> on a protocol, because that person makes medical decisions on a live trial. When the spec says licensed, ask whether it is a legal requirement of the seat or a reflex in the template.</p>" },

      { heading: "Two career shapes and the transition point",
        point: "Industry experience starts at the seam where the physician crossed over, not at medical school, so find that year and do the arithmetic on every claim after it.",
        html: "<p>An academic CV and an industry CV are built from different currencies. The academic shape runs residency into fellowship into a faculty appointment, and its currency is grants, publications, teaching, and clinic time, with promotion from assistant to associate to full professor. The industry shape's currency is programs, filings, decisions, and teams. Most physician CVs you read will contain both shapes, and the single most informative feature is the seam between them: the <dfn>transition point</dfn>, the year and the level at which this person crossed into industry.</p>" +
        "<p>The classic crossing is mid-career, an academic or practicing physician stepping into a Medical Director seat. An early crossing, straight from fellowship, buys more industry runway but less clinical gravitas. A late crossing, full professor directly into a VP or CMO title, brings gravitas and a network, but probe whether they have ever operated inside a matrix, been overruled by a program team, owned a budget, or shipped anything on a timeline they did not set. Some have. Many have not, and the title hides it.</p>" +
        "<p>The transition point also lets you do arithmetic on claims. Someone three years out of academia listing four INDs and a pivotal program deserves a calendar check, because industry experience starts at the seam, not at medical school. One more pattern that is normal and fine: many industry physicians keep a clinic day or occasional practice, sometimes precisely to keep licensure active. It is not a lack of commitment; sometimes it is the opposite.</p>" },

      { heading: "Four doors in, and the sponsor versus CRO tell",
        point: "Ownership language means sponsor and multi-client portfolio language means CRO, and since clients pay a premium for sponsor time your write-up must never blur the two.",
        html: "<p>Almost every clinical development physician entered through one of four doors, and each door has a read.</p>" +
        "<ul><li><strong>Academic clinician or trialist to Medical Director</strong>: the strongest science and often the thinnest operations. They have run studies as a site investigator; they have not run a sponsor program. Good clients know this and buy the science anyway, with support around them.</li>" +
        "<li><strong>CRO medical monitor to sponsor</strong>: deep trial operations across many studies. The question is whether they have ever owned one asset end to end, or always watched a portfolio of other people's.</li>" +
        "<li><strong>Drug safety to development</strong>: knows the safety machinery cold. Probe whether they have designed and run studies, or adjudicated events on studies someone else designed.</li>" +
        "<li><strong>Medical affairs to development</strong>: the hardest sell. Medical affairs lives largely post-approval: KOL engagement, advisory boards, data dissemination. Clients discount it for development seats because it sits downstream of the decisions a development physician must make. It is doable, usually through a stepping-stone seat, but do not price it as a lateral move.</li></ul>" +
        "<p>Then the tell that CVs work hardest to hide: <dfn>sponsor</dfn> time versus <dfn>CRO</dfn> time. A sponsor owns the asset; a contract research organization runs trials for paying clients, and both hand out the same Medical Director titles. The tells: many concurrent studies across unrelated therapeutic areas reads CRO; the phrases for multiple sponsors or across client programs read CRO; escalation language, escalated findings to the sponsor medical lead, reads CRO; ownership language, clinical development plan, governance committee, my asset, reads sponsor. Learn the large CRO names so the employer line does the work for you. Both histories have value, but clients pay a premium for sponsor time at Senior Medical Director and above, and your submittal write-up should never blur the two.</p>" },

      { heading: "Phase fingerprints",
        point: "Count the listed studies by phase instead of believing the summary paragraph, because a program passing through three phases is not the same as a physician leading studies in each.",
        html: "<p>The summary paragraph at the top of a CV claims breadth. The studies actually listed tell the truth, and reading them is a skill worth naming: the <dfn>phase fingerprint</dfn>. First-in-human, dose escalation, healthy volunteers, single and multiple ascending dose: Phase 1. Proof-of-concept, dose-ranging, randomized with a real efficacy endpoint: Phase 2, which is the center of gravity of your desk. Registrational, pivotal, global, hundreds to thousands of patients, event-driven endpoints: Phase 3. Open-label extensions, post-marketing commitments, registries: late lifecycle.</p>" +
        "<p>A physician is strongest where their protocol authorship and medical monitor hours actually concentrated, not where the summary says they have experience. So count. If eight of ten listed studies are Phase 1 and the summary claims full-lifecycle development, you are reading an early-development physician with a marketing paragraph. That is not a lie exactly; it is a CV doing its job, and your job is to not be its customer.</p>" +
        "<p>Be especially careful with the phrase ran Phase 1 through Phase 3. Sometimes it means the physician led studies in each phase. At least as often it means the program passed through those phases while the physician sat in one function watching it go by. The probe is simple: for each phase, which study, what was your role on the protocol, and who was the medical monitor of record. Fingerprints do not transfer between hands.</p>" },

      { heading: "Regulatory claims and the FDA lines",
        point: "On every filing and FDA meeting claim the verb is the credential: ask which sections they authored and whether they presented or merely attended.",
        html: "<p>The <dfn>IND</dfn> opens human testing; the <dfn>NDA</dfn> asks to market a small molecule; the <dfn>BLA</dfn> asks to market a biologic. On CVs these appear as supported, contributed to, or was instrumental in, and the honest range behind supported the BLA runs from authoring the clinical overview and the summary of clinical efficacy down to attending one meeting about it. The probes, in order: which sections did you personally author; who presented the clinical package when FDA had questions, and were you in the room; what did the agency push back on; what changed because of it. People who owned the work answer in specifics before you finish asking. People who were nearby talk about the team.</p>" +
        "<p>FDA meetings on a CV are seniority markers if you know the taxonomy. The <dfn>pre-IND meeting</dfn> happens before human testing; presence there marks early-development program involvement. The <dfn>end of Phase 2 meeting</dfn>, EOP2, is where pivotal trial design gets negotiated with the agency, and leading that preparation is a genuine development-leadership credential. A <dfn>Type A meeting</dfn> is reserved for a stalled program, a clinical hold or a refuse-to-file; anyone who sat in one has managed a crisis. <dfn>Type B</dfn> is the milestone category, and pre-IND and EOP2 formally live inside it; <dfn>Type C</dfn> is the catch-all; and since PDUFA VII in 2023 the taxonomy also carries <dfn>Type D</dfn> meetings for a narrow set of focused questions and <dfn>INTERACT</dfn> meetings for advice earlier than pre-IND, so do not describe it as a three-type system in front of a regulatory-literate CMO. An <dfn>advisory committee</dfn> appearance, defending data in public before FDA's outside experts, is the most senior agency exposure a CV can carry, CMO-adjacent by definition. In every case the question is the same: presented, or attended. The verb is the credential.</p>" },

      { heading: "Publications, progression, and flags worth probing",
        point: "Watch whether scope grows or only the title does, and turn every flag into a question, since short tenures after failed readouts are this industry working as designed.",
        html: "<p>Authorship order carries information. <dfn>First author</dfn> did the work, typical of fellowship and junior faculty years. <dfn>Last author</dfn> is the senior scientist who ran the group. Middle authorship on a forty-author trial paper is participation, nothing more. A long publication list with no protocols authored is an academic with gravitas and no program ownership, which is fine if the client wants scientific weight and fatal if they need someone to run a Phase 3 machine on Monday. Industry physicians publish less; that is normal, not decline. Credible counts run modest: a handful of protocols authored and medical monitor duty on a manageable number of studies across a decade is a real career. A claim of twenty INDs means a platform company churning candidates, or inflation. Ask which ones they owned and which they touched.</p>" +
        "<p>Progression versus <dfn>title drift</dfn>: real progression shows scope growing, study to program to portfolio, direct reports appearing, a seat at governance. Drift shows the title rising while the scope does not.</p>" +
        "<p>Finally, the flags worth probing rather than dismissing. A title jump at a tiny company, Associate Medical Director at big pharma to CMO of fifteen people, can be a real bet-on-yourself move or pure inflation: probe headcount, budget, board exposure. A safety-only career presented as clinical development gives itself away in the verbs: adjudicated, coded, compiled aggregate reports. Serial short tenures are different in this industry, because programs die on schedule and layoffs follow readouts: ask what happened at each stop, and whether departures came after the data or suspiciously before it. Gaps: ask plainly, do not speculate. Geographic churn, five states in eight years: geography kills physician placements, so that is a qualification question, not trivia.</p>" }
    ],
    checklist: [
      "Read the credential line in ten seconds: degree, residency, fellowship, boards, licensure",
      "Locate the transition point and state the year and level this physician crossed into industry",
      "Separate sponsor time from CRO time using ownership language, study counts, and employer names",
      "Count the listed studies by phase and state the real fingerprint, ignoring the summary paragraph",
      "Probe any IND, NDA, or BLA claim down to sections authored and meetings presented",
      "Convert every red flag into a probing question before letting it become a rejection"
    ]
  },

    { id: "m09s01",
      prompt: "Say it out loud as the recruiter. You open this CV cold: MBBS, US internal medicine residency, oncology fellowship, nine years academic faculty with 70 publications, four years as Medical Director at a large CRO, eighteen months as Senior Medical Director at a small biotech, with a line claiming she supported two BLAs. Brief your search partner in under two minutes: three true things and two probes.",

MODULES.push({
  id: "m10",
  title: "Working the Desk",
  tagline: "Intake, funnel, comp, counteroffer, and the honest arithmetic of your first year",

  learn: {
    sections: [
      { heading: "The model and the money",
        point: "Senior physician searches belong on retained or engaged terms because a pool of a few dozen passive physicians takes weeks of mapping that contingency cannot fund.",
        html: "<p>Three ways a physician search gets paid, and who is exposed in each. <dfn>Contingency</dfn>: the firm is paid only on a hire, usually non-exclusive, so the firm carries all the risk and rationally spends its hours where the odds are best. <dfn>Retained</dfn>: the client pays for the search itself, typically in installments such as thirds at engagement, milestone, and completion, and works with one firm exclusively; the client carries the upfront risk and buys committed effort in exchange. <dfn>Engaged</dfn>, also called a <dfn>container</dfn>: a smaller upfront deposit credited against the final fee, splitting the risk and buying exclusivity without the full retainer.</p>" +
        "<p>Senior physician searches belong on retained or engaged terms for a structural reason, not a preference. The qualified population for a Medical Director search in a specific phase and therapeutic area is measured in dozens, nearly all of them passive, and reaching them takes weeks of mapping and development that a non-exclusive race cannot fund. A contingency race rewards whoever surfaces an active candidate fastest; your client is not paying for fast, they are paying for the one physician who fits.</p>" +
        "<p>The fee is commonly a percentage of the placed candidate's first-year cash compensation, often quoted in the range of 25 to 35 percent on senior roles, with CMO searches frequently priced higher or structured. Call the package something around the low 300 thousands for a Medical Director and a fee near 30 percent, and the invoice lands somewhere around ninety to a hundred thousand dollars; that is what funds the forty hours of mapping. The <dfn>guarantee period</dfn>, commonly around 90 days and sometimes longer at executive levels, is the tail on that fee: if the hire leaves inside it, most agreements owe a <dfn>replacement</dfn> search rather than a refund. Read every agreement, because the replacement-versus-refund line is where clients and firms surprise each other.</p>" },

      { heading: "A funnel measured in dozens",
        point: "Work backward from your placement goal to a weekly count of real physician conversations, because that count is the only number fully inside your control.",
        diagram: "<svg viewBox=\"0 0 520 250\" role=\"img\" aria-label=\"The physician search funnel narrowing from mapped physicians to a placement\"><rect x=\"14\" y=\"20\" width=\"452\" height=\"28\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"24\" y=\"32\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"10.5\" font-weight=\"600\" fill=\"#2a2620\">Mapped physicians</text><text x=\"24\" y=\"43\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">dozens, nearly all passive</text><rect x=\"22\" y=\"54\" width=\"412\" height=\"28\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"32\" y=\"66\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"10.5\" font-weight=\"600\" fill=\"#2a2620\">Real conversations</text><text x=\"32\" y=\"77\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">the only number you control</text><rect x=\"30\" y=\"88\" width=\"372\" height=\"28\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"40\" y=\"100\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"10.5\" font-weight=\"600\" fill=\"#2a2620\">Qualified and interested</text><text x=\"40\" y=\"111\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">a real driver, not curiosity</text><rect x=\"38\" y=\"122\" width=\"332\" height=\"28\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"48\" y=\"134\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"10.5\" font-weight=\"600\" fill=\"#2a2620\">Submittals</text><text x=\"48\" y=\"145\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">what the client sees</text><rect x=\"46\" y=\"156\" width=\"292\" height=\"28\" rx=\"3\" fill=\"#fdfaf3\" stroke=\"rgba(42,38,32,0.22)\"/><text x=\"56\" y=\"168\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"10.5\" font-weight=\"600\" fill=\"#2a2620\">Interviews</text><text x=\"56\" y=\"179\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">the process starts</text><rect x=\"54\" y=\"190\" width=\"252\" height=\"28\" rx=\"3\" fill=\"#f3e7db\" stroke=\"#8b4513\"/><text x=\"64\" y=\"202\" font-family=\"ui-serif,Palatino Linotype,Georgia,serif\" font-size=\"10.5\" font-weight=\"600\" fill=\"#8b4513\">Offer and placement</text><text x=\"64\" y=\"213\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"7.5\" fill=\"#8a8172\">four to six months</text><text x=\"14\" y=\"242\" font-family=\"ui-monospace,SF Mono,Consolas,monospace\" font-size=\"8\" fill=\"#8a8172\">When a stage stops converting, the problem lives in the stage above it.</text></svg><figcaption>Every stage narrows, and each one diagnoses the last</figcaption>",
        html: "<p>Every desk is a funnel; a physician desk is a narrow, slow one, and pretending otherwise is how rookies break. The pool is small: for a given search, the physicians with the right degree, phase fingerprint, and therapeutic area often number a few dozen. The cycles are long: physicians are conservative movers, notice periods stretch, and the decision is rarely one person's. The spouse is frequently another physician with a license, a patient panel, or a partnership that does not travel, and school years, aging parents, and real estate all vote. A courtship that runs months is normal. A search that closes in weeks is the exception you should not budget for.</p>" +
        "<p>The discipline that survives this is backward arithmetic. If roughly one offer emerges from every few finalists interviewed, and an interview process starts from a few submittals, and a submittal comes from several qualified conversations, then a placement goal translates into a weekly count of real conversations with mapped physicians, and that count is the only number fully inside your control. Early on you do not know your own ratios, so borrow the desk's house numbers and track your own from day one. The funnel also diagnoses: when a stage stops converting, the stage above it is where the problem lives, and the ratios tell you which conversation to have next.</p>" +
        "<p>What the narrowness buys you: on a pool of dozens, every single conversation compounds. The physician who is wrong for this search is on the map for the next one, and the map is the asset that makes year two easier than year one.</p>" },

      { heading: "Reading the pipeline for when the seat opens",
        point: "Program stage predicts physician hiring for free, so open the conversation at the readout or the financing, months before the requisition exists.",
        html: "<p>Everything else in this module is about running a search you already have. This is about knowing one is coming. A program's stage is the best public predictor of physician hiring you will ever get for free, and since your own clock runs roughly four to six months from kickoff to a signed offer, the moment worth being in the conversation is well before the requisition exists.</p>" +
        "<p>The transitions that make physician seats:</p>" +
        "<ul>" +
        "<li><strong>A positive Phase II readout, and the money that follows it.</strong> Good data alone hires nobody. Good data plus a financing hires. A company that reads out well and then raises is staffing a pivotal program, and what it reaches for first is a physician senior enough to defend a design.</li>" +
        "<li><strong>The run up to the end of Phase 2 meeting.</strong> Someone has to own the pivotal design in front of the agency. A company that has been getting by on a CMO and a fractional consultant discovers here that it needs a full-time VP of Clinical Development or an Executive Medical Director, and it usually discovers it late.</li>" +
        "<li><strong>Scaling into Phase III.</strong> More studies across more sites means more medical coverage than one physician can carry. This is where the second and third Medical Director appear, and where a dedicated medical monitor stops being optional.</li>" +
        "<li><strong>Pre-submission.</strong> The ask narrows and turns specific: physicians who have authored clinical sections of a marketing application, sat in a pre-NDA or pre-BLA meeting, or faced an advisory committee. That pool is far smaller than clients assume, which is your argument for a retained engagement.</li>" +
        "</ul>" +
        "<p>Two cautions. Failure creates searches as reliably as success does, which the execution module covers: a missed endpoint, a safety signal, or a reprioritized portfolio pushes good physicians out and sometimes leaves the seat open behind them. A quiet pipeline is not a dead account. And a press release earns you the call, it does not replace the intake. You do not know whether a company is hiring, backfilling, or frozen until it says so, so read the stage to open the conversation and then ask every question anyway.</p>" },

      { heading: "The intake call is where searches are won",
        point: "You lose more placements to shallow intakes than to lost candidates, and the gates-versus-wishes question is the highest-leverage thing you can ask.",
        html: "<p>You will lose more placements on shallow intakes than on lost candidates. Before you source a single name, the client owes you answers, and asking for them is what a retained firm sounds like.</p>" +
        "<ul><li>Why is the seat open, what happened to the last person, and is an internal candidate in the running?</li>" +
        "<li>Which requirements are gates and which are wishes: MD required or MD preferred, boards, licensure, phase experience, therapeutic area? <strong>Must-have versus preference is the single highest-leverage distinction on the call.</strong></li>" +
        "<li>What phase is the asset actually in, and what is it? A Phase 2 dose-ranging seat and a pivotal-readiness seat are different searches wearing the same title.</li>" +
        "<li>Is a CRO background acceptable, or is sponsor time required? Is an academic crossing into a first industry seat acceptable?</li>" +
        "<li>What is the approved comp range: base, target bonus, equity, sign-on room? Approved, not aspirational, and who signed off on it?</li>" +
        "<li>What is the interview process, step by step, with names: who interviews, who decides, who can veto?</li>" +
        "<li>What is the real relocation and remote policy? A hybrid that means four days on site kills half the map, and you need to know that before the first call, not after the third finalist.</li>" +
        "<li>What would make you say no to an otherwise strong candidate? This question surfaces the unstated veto, and there is almost always one.</li></ul>" +
        "<p>Add the business terms: exclusive or shopped, timeline, and what breaks if the seat stays open. A complete intake produces a search you can run verbatim. An incomplete one produces a month of guessing billed to your own ramp.</p>" },

      { heading: "Qualifying the physician, and why they actually move",
        point: "Ask in the first screen what would still be broken if they matched the money tomorrow, because a candidate without an answer is a raise negotiation you run for free.",
        html: "<p>Qualification is a structured pass, run early and logged verbatim. Motivation first, in their own words: what is actually wrong with the current seat, because those sentences are your <dfn>counteroffer</dfn> defense in eight weeks, and defense starts at the first screen, never at offer stage. Then the practicals: comp expectations, base and bonus, and the unvested equity they would be walking away from, priced now rather than discovered at offer. Geography and family: where can they actually live, who else votes, and has the family seen the city or only the offer letter. Timeline: could they say yes in six weeks, or is something anchoring them to a date. Competition: what other processes are in play, and how far along. And confidentiality: who else knows they are looking, because a search their employer already suspects runs on a different clock.</p>" +
        "<p>Why clinical development physicians move, in roughly the order you will hear it: the program was killed and there is nothing behind it; the science stopped being interesting, an asset in maintenance mode, open-label extensions as far as the eye can see; operational friction without authority, running the studies while the decisions happen two levels up; a reorganization or a new CMO who brought their own people; wanting to own a program instead of a study; wanting the CMO seat somewhere it is reachable; an equity event, vesting cliffs passed or a private company going nowhere; geography and family; and for those still practicing, burnout from clinical medicine. That last one needs care: a physician running away from the clinic must also be running toward development, or they will be just as unhappy in a year, on your guarantee.</p>" +
        "<p>The counteroffer question belongs in the first screen, in this form: if they matched the money tomorrow, what would still be broken? A candidate with a real answer can be closed. A candidate without one is a raise negotiation you are running for free.</p>" },

      { heading: "Compensation at these levels",
        point: "Sign-on and the initial equity grant flex because they sit outside the salary bands, so price forfeited equity at screen instead of pushing on base.",
        html: "<p>The package has four moving parts. <strong>Base</strong>, which sits inside internal bands and commonly flexes least. <strong>Target bonus</strong>, typically a percentage of base that rises with level, commonly cited somewhere in the roughly 15 to 40 percent range across the ladder from Medical Director up through VP, higher at CMO, always plan-dependent. <strong>Equity</strong>, where the real differences live: <dfn>options</dfn> dominate at private companies, high leverage and possibly worthless, priced off a strike; <dfn>RSUs</dfn> dominate at public companies, visible value that vests on a schedule. A physician weighing a private offer against a public one is weighing a lottery ticket against a paycheck, and your job is to make that trade explicit rather than let it surface at offer stage. <strong>One-time money</strong>: a <dfn>sign-on</dfn> bonus, most often used to offset a forfeited annual bonus or unvested equity left behind, and occasionally a <dfn>retention</dfn> grant later to keep someone through a readout.</p>" +
        "<p>What is actually negotiable, in rough order of flex: sign-on and the initial equity grant move most, because they live outside the salary bands; start date and review timing move easily; title sometimes moves; base moves least, and pushing hard on it can sour a deal that sign-on would have solved quietly. When your candidate is leaving unvested paper behind, size the ask against what that paper might plausibly be worth and put it in the sign-on and grant conversation early. Cash comp figures at these levels vary widely with company stage, geography, and indication, so never quote a number as fact: gather the client's approved range on intake, gather the candidate's expectations at screen, and your job is to know before anyone flies anywhere whether those two ranges touch.</p>" },

      { heading: "Ramp math, and staying alive while it runs",
        point: "A first placement commonly lands six to twelve months in, so keep score in activity and let the broken conversion stage name your fix.",
        html: "<p>The arithmetic of a rookie retained desk, without decoration. A physician search commonly runs roughly four to six months from kickoff to a signed offer, and roughly six to eight months to a start date once a physician's notice period is counted. A new recruiter spends her first weeks with no searches of her own. Stack those two facts and a first placement commonly lands somewhere in the six-to-twelve-month range, and when it comes earlier it usually arrives as a <dfn>split</dfn>, candidate-side work on a senior colleague's search. This is not a test of character; it is how the pipeline's physics work, and a manager who runs a retained desk already knows it.</p>" +
        "<p>What the early months should look like in activity terms: months one and two are the map, the first hundred conversations, shadowed intake calls, and <dfn>MPC</dfn> presentations that open client doors; months three and four should show submittals, first interviews, and a search or two of your own; the back half of the first year is where placements become a reasonable expectation rather than a hope. A good week with nothing closed is countable: real conversations with mapped physicians, a submittal moving, a client debrief pushed to a decision, the pipeline honest in the CRM the day it changes.</p>" +
        "<p>Your manager does not read your placements in month three; they read your conversions. Many conversations and no submittals: wrong pool or a screen that never asks for commitment. Submittals and no interviews: a mis-scoped search or a client you have lost control of. Interviews and no offers: qualification or prep. The number names the broken stage; the broken stage names the fix.</p>" +
        "<p>Deals will die: a counteroffer lands, a spouse vetoes, a program gets cut mid-search, a client freezes the req. The recruiters who last do the same four things: autopsy the loss the same day, where did it die and was it knowable earlier; keep prospecting while deals are closing, because a fall-off hurts most when the pipeline behind it is empty; make the next call within the hour; and keep score in activity, which they control, not in outcomes, which they only influence. The ones who wash out stop prospecting when something looks close, take fall-offs personally, and start hiding from their own CRM. The difference is habit, not talent.</p>" }
    ],
    checklist: [
      "Explain retained, engaged, and contingency to a client, including who carries the risk in each",
      "Run a full intake and leave with gates versus wishes, approved comp, process names, vetoes, and the real relocation policy",
      "Qualify a physician on motivation, comp and equity left behind, geography, timeline, other processes, and who knows",
      "Start counteroffer defense in the first screen by logging reasons for leaving verbatim and asking what money would not fix",
      "Work backward from a placement goal to a weekly conversation count using house ratios",
      "Read your own week the way a manager does: find the stage that stopped converting and name the fix"
    ]
  },

  quiz: [

    { id: "m10s01",
      prompt: "Say it out loud as the recruiter. It is month four and you have made no placements. Brief your manager the way you would want to be briefed: what the numbers say, what you are changing, and what you are not panicking about.",
      model: "Four months in: two searches of my own, candidate-side on the CMO search, forty-one logged physician conversations, nine submittals, four first interviews, one candidate at finalist stage. Conversation to submittal is holding around house ratio; the break is submittal to interview on the dermatology search, three submittals and silence, so this week I am forcing a calibration call because I believe the spec moved after intake. I am also adding one MPC presentation per week, since my client-side pipeline is thinner than my candidate-side pipeline and that gap becomes a problem in the fall. I am not panicking about zero placements at month four, because my first real intakes happened in month two and this desk's cycle commonly runs roughly four to six months from kickoff to a signed offer and roughly six to eight months to a start date. If conversion holds, the finalist and the CMO split both land inside the next eight to twelve weeks, and if it does not, the weekly numbers will say exactly where it broke.",
